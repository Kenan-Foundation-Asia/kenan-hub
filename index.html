   ไม่ทำแบบนี้ ปุ่มย้อนกลับของมือถือจะเด้งออกจากแอปทันทีตั้งแต่หน้าแรก */
function go(name, params = {}, replace = false){
  if(replace){
    if(S.stack.length) S.stack[S.stack.length - 1] = { name, params };
    else S.stack.push({ name, params });
    try{ history.replaceState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }else{
    S.stack.push({ name, params });
    try{ history.pushState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }
  render(name, params);
}
function back(){
  if(S.stack.length > 1){ try{ history.back(); return; }catch(e){} }
  S.stack = []; go('home', {}, true);
}
window.addEventListener('popstate', () => {
  if(S.stack.length > 1){
    S.stack.pop();
    const prev = S.stack[S.stack.length - 1];
    render(prev.name, prev.params);
  }else{
    // อยู่หน้าแรกแล้วกดย้อนกลับ = ตั้งใจจะออกจริง ปล่อยให้ออกได้ตามปกติ
    render('home', {});
  }
});

function paintDriverNav(active){
  const nav = $('#nav');
  if(!nav) return;
  nav.innerHTML = DRV_NAV.map(x => `
    <button data-go="${x.go}" class="${x.go === active ? 'on' : ''}">${x.ic}

function chrome(name){
  if(S.driverMode){
    // หน้าที่คนขับเข้าได้มีเท่านี้ นอกจากนี้พาไปหน้างานของเขาแทน
    const okPages = ['driver-portal','driver-me','driver-report','driver-pair','offline','gate'];
    paintDriverNav(name);
    $('#backBtn').hidden = true;
    $('#brand').hidden   = true;
    $('#title').hidden   = false;
    $('#nav').hidden     = false;
    $('#fab').hidden     = true;
    $x('#langTop').hidden = false;
    $x('#side').style.display = 'none';
    if(!okPages.includes(name)) return;
    return;
  }
  paintNav();
  paintSide(name);
  const isHome = name === 'home';
  if(isHome) setTitle(t('navHome'));
  // 'privacy' = หน้าเดียวกับ consent แต่เปิดจากโปรไฟล์ → ต้องมีปุ่มกลับและเมนูล่าง
  const isFull = ['register','otp','consent','gate','offline'].includes(name);
  $('#backBtn').hidden = isHome || isFull;
  // จอคอมมีเมนูข้างที่มีโลโก้อยู่แล้ว แถบบนจึงควรบอก "อยู่หน้าไหน" ทุกหน้า รวมหน้าแรก
  $('#brand').hidden   = !isHome || window.innerWidth >= 900;
  $('#title').hidden   = isHome && window.innerWidth < 900;
  $('#nav').hidden     = isFull;
  $x('#side').style.display = isFull ? 'none' : '';
  $x('#langTop').hidden = isFull;
  // ปุ่มลอยโผล่เฉพาะหน้าที่เกี่ยวกับพัสดุและเมนูผู้ดูแลเท่านั้น
  // หน้าอื่น (โดยเฉพาะหน้าฉุกเฉิน) ห้ามมีอะไรมาบัง
  $('#fab').hidden = !S.isOfficer ||
                     !['my-parcels','unidentified','admin'].includes(name);
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.go === name || (name === 'parcel-in' && b.dataset.go === 'my-parcels')));
}
let RENDER_SEQ = 0;
async function render(name, params){
  const seq = ++RENDER_SEQ;
  /* ลิงก์เก่าหรือปุ่มย้อนกลับพาคนขับไปหน้าพนักงานได้ — พาเขากลับมาหน้าของเขา
     เซิร์ฟเวอร์ปฏิเสธอยู่แล้ว แต่หน้าจอ error ไม่ได้ช่วยให้เขาทำงานต่อได้ */
  if(S.driverMode && !['driver-portal','driver-me','driver-report','driver-pair','offline','gate'].includes(name)){
    name = 'driver-portal'; params = {};
  }
  chrome(name);
  const fn = ROUTES[name] || ROUTES.home;
  $x('#main').innerHTML = `<div class="view">${skeleton(2)}</div>`;
  try{ await fn(params); }
  catch(e){
    if(seq !== RENDER_SEQ) return;   // ผู้ใช้เปลี่ยนหน้าไปแล้ว ไม่ต้องขึ้น error ของหน้าเก่า
    if(e.message === 'NO_CONFIG'){
      $x('#main').innerHTML = `<div class="view"><div class="note">${IC.info}<div><b>${t('noConfig')}</b><br>${t('noConfigBody')}</div></div></div>`;
    }else{
      errorScreen(e, () => render(name, params));
    }
  }
}

/** หน้าจอเวลาเชื่อมต่อไม่ได้ — ลองใหม่ได้ตรงนี้โดยไม่ต้องรีโหลดทั้งแอป
    และมีปุ่มทดสอบการเชื่อมต่อ เอาไว้ส่งข้อความ error ให้คนแก้ดู */
function errorScreen(e, retryFn){
  $x('#main').innerHTML = `<div class="view">
    <div class="empty">${IC.info}<h3>${esc(t('netErr'))}</h3><p>${esc(t('netErrHint'))}</p></div>
    <button class="btn primary" id="rt">${esc(t('retry'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="dg">${esc(t('diag'))}</button>
    <pre id="dgOut" hidden style="margin-top:12px;padding:11px;background:var(--surface);
      border:1px solid var(--line);border-radius:12px;font-size:var(--fs-meta);
      white-space:pre-wrap;word-break:break-all;color:var(--ink-2)"></pre>
  </div>`;
  $('#rt').onclick = () => (retryFn ? retryFn() : location.reload());
  $('#dg').onclick = async () => {
    const box = $('#dgOut'); box.hidden = false; box.textContent = t('loading');
    let out = 'error: ' + (e?.message || e) + (e?.snippet ? '\nsnippet: ' + e.snippet : '') + '\n';
    out += 'uid: ' + (S.uid ? S.uid.slice(0,8) + '…' : '(none)') + '\n';
    out += 'liff: ' + (S.liffReady ? 'ok' : 'no') + '\n';
    // net = เวลารวมที่รอ · srv = เวลาที่ Apps Script ใช้จริง · db = เวลาอ่าน Google Sheet
    // net สูงแต่ srv ต่ำ = เสียเวลาไปกับการปลุกเครื่อง ไม่ใช่โค้ดเรา
    out += 'timings (net/srv/db ms):\n' + S.timings.map(x =>
      '  ' + x.a + ' ' + x.net + '/' + (x.srv ?? '-') + '/' + (x.db ?? '-')).join('\n') + '\n';
    try{
      const r = await api('ping', {}, 'GET');
      out += 'ping: ' + JSON.stringify(r);
    }catch(err){
      out += 'ping FAILED: ' + (err?.message || err) + (err?.snippet ? '\n' + err.snippet : '');
    }
    box.textContent = out;
  };
}

   เตือนล่วงหน้า 60 วัน เพื่อให้มีเวลาไปต่ออายุ */
function licWarn(exp){
  if(!exp) return '';
  const days = Math.floor((Date.parse(exp) - Date.now()) / 86400000);
  if(isNaN(days) || days > 60) return '';
  const bad = days < 0;
  return `<div style="font-size:var(--fs-meta);font-weight:800;margin-top:2px;color:${
    bad ? 'var(--bad)' : 'var(--warn)'}">${esc(bad ? t('licExpired') : t('licSoon')(days))}</div>`;
}

/* หัวข้อของวัน — คนอ่าน "วันนี้/พรุ่งนี้" เร็วกว่าอ่านวันที่ */
function dayLabel(key){
  const today = dayKey(new Date());
  const tmr   = dayKey(new Date(Date.now() + 86400000));
  if(key === today) return t('dayToday');
  if(key === tmr)   return t('dayTomorrow');
  return new Date(key + 'T00:00:00+07:00').toLocaleDateString(
    S.lang === 'th' ? 'th-TH' : 'en-GB', { weekday:'short', day:'numeric', month:'short' });
}

  document.querySelectorAll('[data-bgo]').forEach(b => b.onclick = () => go(b.dataset.bgo));
  document.querySelectorAll('[data-go]').forEach(b => {
    if(b.dataset.go) b.onclick = () => go(b.dataset.go);
  });
  $('#allNews').onclick = () => go('news');

  try{
    const r = S.bootNews ? { items:S.bootNews } : await apiRetry('getAnnouncements', {}, 'GET');
    S.bootNews = null;
    const list = r?.items || [];
    $x('#newsBox').innerHTML = list.length
      ? `<div class="rows">${list.slice(0,3).map(a => `
          <button class="row" data-news="1"><div class="body">
            <div class="t">${esc(a.title || a.title_th || a.title_en)}</div>
            <div class="s">${esc(fmtDate(a.at))}</div>
          </div><span class="go">${IC.chev}</span></button>`).join('')}</div>`
      : `<div class="quiet">${esc(S.lang === 'th' ? 'ยังไม่มีประกาศ' : 'No announcements')}</div>`;
    document.querySelectorAll('[data-news]').forEach(b => b.onclick = () => go('news'));
  }catch(e){ $x('#newsBox').innerHTML = ''; }
};

 *  พิมพ์ "รถ" ควรได้ทั้งปุ่มจองรถ และใบจองรถของตัวเองที่ยังไม่จบ

 *  ส่วนของฉันกับรายชื่อคนต้องถามเซิร์ฟเวอร์ จึงขึ้นตามมาทีหลัง
 *  ทำแบบนี้ช่องค้นหาจึงไม่เคย "ค้างรอ" — มีอะไรตอบได้ก่อนก็ตอบไปก่อน
 * ══════════════════════════════════════════════════════════════════ */
ROUTES.search = async ({ kw } = {}) => {
  setTitle(t('schTitle'));
  const q0 = String(kw || '');
  $x('#main').innerHTML = `<div class="view">
    <div class="srch">
      <input id="sq" value="${esc(q0)}" placeholder="${esc(t('schPh2'))}"
        inputmode="search" enterkeyhint="search" autocomplete="off">
      <button id="sqx" aria-label="${esc(t('schClear'))}">✕</button>
    </div>
    <p class="schhint" id="sqHint">${esc(t('schHint'))}</p>
    <div id="sqOut"></div>
  </div>`;

  const inp = $('#sq');
  setTimeout(() => inp.focus(), 120);
  $('#sqx').onclick = () => { inp.value = ''; inp.focus(); paint(''); };

  let seq = 0;
  const paint = async v => {
    const kwl = v.trim().toLowerCase();
    const mine = ++seq;
    $x('#sqHint').hidden = !!kwl;

    if(kwl.length < 2){ $x('#sqOut').innerHTML = ''; return; }

    /* ── 1. เมนู: ค้นในเครื่อง ขึ้นทันทีไม่ต้องรอเน็ต ── */
    const svc = [];
    SERVICE_GROUPS().forEach(gr => gr.items.forEach(i => {
      if((i.label + ' ' + (i.sub || '') + ' ' + (i.kw || '')).toLowerCase().includes(kwl))
        svc.push(i);
    }));

    const sec = (title, body) => body
      ? `<div class="hz-h" style="margin-top:18px"><h3>${esc(title)}</h3></div>${body}` : '';

    $x('#sqOut').innerHTML =
      sec(t('schSvc'), svc.length ? `<div class="svl">${svc.slice(0, 6).map(svRow).join('')}</div>` : '') +
      `<div id="sqSrv" class="schwait">${esc(t('schLooking'))}</div>`;
    document.querySelectorAll('#sqOut .svl [data-go]').forEach(b =>
      b.onclick = () => go(b.dataset.go));

    /* ── 2. ของฉัน + คน + ระบบอื่น: ถามเซิร์ฟเวอร์ครั้งเดียว ── */
    let r = null;
    try{ r = await apiRetry('oneSearch', { kw:kwl }, 'GET'); }catch(e){}
    if(mine !== seq) return;                 // พิมพ์ต่อไปแล้ว ผลชุดนี้ตกรุ่น ทิ้งไป
    if(!r?.ok){ $x('#sqSrv').textContent = t('netErr'); return; }

    const ST = { arrived:t('prcS_wait'), notified:t('prcS_wait'), claimed:t('prcS_done'),
                 closed:t('prcS_done'), reserved:t('eqReserved'), issued:t('eqOut'),
                 approved:t('assigned'), assigned:t('assigned'), in_use:t('mnOut') };

    const recs = r.records.length ? `<div class="rows">${r.records.map(x => `
      <button class="row" data-rgo="${esc(x.go)}" data-rec="${esc(x.record_id)}">
        <div class="thumb">${x.type === 'car' ? IC.car : x.type === 'room' ? IC.cal
          : x.type === 'borrow' ? IC.laptop : x.type === 'issue' ? IC.tool : IC.box}</div>
        <div class="body">
          <div class="t">${esc(x.title || '—')}</div>
          <div class="s">${esc([x.where, x.at ? fmtDate(x.at) : ''].filter(Boolean).join(' · '))}</div>
        </div>
        <span class="pill ${x.open ? 'wait' : 'done'}">${esc(ST[x.status] || x.status)}</span>
      </button>`).join('')}</div>` : '';

    const ppl = r.people.length ? `<div class="rows">${r.people.map(p => `
      <div class="row schp">
        <span class="av2">${esc((p.name || '?').trim().charAt(0))}</span>
        <div class="body">
          <div class="t">${esc(p.name)}${p.nickname ? ` <span class="nick">(${esc(p.nickname)})</span>` : ''}</div>
          <div class="s">${esc([p.position, p.dept].filter(Boolean).join(' · '))}</div>
          <div class="schc">
            ${p.phone ? `<a href="tel:${esc(p.phone)}">${IC.phone}${esc(p.phone)}</a>` : ''}
            ${p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ''}
          </div>
        </div>
      </div>`).join('')}</div>` : '';

    const lks = r.links.length ? `<div class="svl">${r.links.map(l => `
      <button class="svi" data-url="${esc(l.url)}">
        <span class="svi-i">${LKIC[l.icon] || LKIC.link}</span>
        <span class="svi-x"><span class="svi-n">${esc(
          S.lang === 'th' ? l.title_th : (l.title_en || l.title_th))}</span>
          <span class="svi-s">${esc(S.lang === 'th' ? l.note_th : (l.note_en || l.note_th))}</span></span>
        <span class="go">${IC.ext}</span>
      </button>`).join('')}</div>` : '';

    const body = sec(t('schMine'), recs) + sec(t('schPeople'), ppl) + sec(t('svOther'), lks);
    $x('#sqSrv').outerHTML = body || (svc.length ? '' :
      `<div style="padding:26px 0">${emptyState(IC.search, t('schNone'), t('schNoneBody')(v.trim()))}</div>`);

    document.querySelectorAll('#sqOut [data-rgo]').forEach(b => b.onclick = () => {
      const dest = b.dataset.rgo || '';
      if(dest) go(dest, ['my-parcels', 'issues'].includes(dest) ? { rec:b.dataset.rec } : {});
    });
    document.querySelectorAll('#sqOut [data-url]').forEach(b =>
      b.onclick = () => openExternal(b.dataset.url));
  };

  /* หน่วง 300 มิลลิวินาทีก่อนถามเซิร์ฟเวอร์
     ถ้ายิงทุกตัวอักษร พิมพ์ "ประชุม" = ยิงหกครั้ง แล้วผลชุดแรกจะมาทับชุดหลัง */
  let timer;
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(() => paint(inp.value), 300); };
  inp.onkeydown = e => { if(e.key === 'Enter'){ clearTimeout(timer); paint(inp.value); } };
  if(q0) paint(q0);
};

ROUTES.notifications = async () => {
  setTitle(t('notifTitle'));
  $x('#main').innerHTML = `<div class="view"><div id="list">${skeleton(3)}</div></div>`;
  let items = [];
  try{ const r = await apiRetry('getNotifications', {}, 'GET'); items = r?.items || []; }catch(e){}

  if(!items.length){
    $x('#list').innerHTML = emptyState(IC.bellBig, t('notifEmpty'), '');
    S.notifCount = 0; $x('#bellDot').hidden = true;
    return;
  }

  const B = [
    { k:'action', l:t('nfAction'), s:t('nfActionSub') },
    { k:'update', l:t('nfUpdate'), s:'' },
    { k:'info',   l:t('nfInfo'),   s:'' }
  ];
  const row = n => `
    <button class="nrow ${esc(n.bucket || 'update')}" ${n.record_id && n.go
      ? `data-rec="${esc(n.record_id)}" data-go="${esc(n.go)}"` : ''}>
      <span class="ndotm" aria-hidden="true"></span>
      <span class="nbody">
        <span class="nt">${esc(evLabel(n))}</span>
        <span class="ns">${esc(fmtDate(n.at))}</span>
      </span>
      ${n.record_id && n.go
        ? `<span class="ncta">${esc(t('nfOpen'))} ${IC.chev}</span>` : ''}
    </button>`;

  $x('#list').innerHTML = B.map(b => {
    const rows = items.filter(n => (n.bucket || 'update') === b.k);
    if(!rows.length) return '';
    return `<div class="nsec">
      <div class="nsec-h"><h3>${esc(b.l)}</h3>
        ${b.k === 'action' ? `<span class="hz-n">${rows.length}</span>` : ''}</div>
      ${b.s ? `<p class="nsec-s">${esc(b.s)}</p>` : ''}
      <div class="nlist">${rows.map(row).join('')}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('#list .nrow[data-rec]').forEach(b => b.onclick = () => {
    const dest = b.dataset.go || 'my-parcels';
    go(dest, ['my-parcels', 'issues'].includes(dest) ? { rec:b.dataset.rec } : {});
  });
  S.notifCount = 0; $x('#bellDot').hidden = true;
};

/** เปิดลิงก์นอกระบบ — ใน LIFF ต้องบอกให้เปิดเบราว์เซอร์จริง
    ไม่งั้นมันจะเปิดในหน้าต่างของ LINE แล้วผู้ใช้กลับเข้า Kenan ONE ไม่ได้ */
function openExternal(url){
  if(!/^https:\/\//i.test(String(url || ''))) return;
  try{
    if(S.liffReady && typeof liff?.openWindow === 'function'){
      liff.openWindow({ url, external:true }); return;
    }
  }catch(e){}
  window.open(url, '_blank', 'noopener');
}

      <div class="ikp" id="kI">${LKIC_LIST.map(k => `

function burst(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const s = document.createElement('span');
  s.className = 'ch-burst'; s.textContent = '✦';
  el.appendChild(s);
  setTimeout(() => s.remove(), 700);
}

      </select></div>
    <label class="switch" style="margin-bottom:14px">
      <input type="checkbox" id="mO" ${m.off ? 'checked' : ''}>
      <span><b>${esc(t('msgTurnOff'))}</b><br>
        <span style="font-size:var(--fs-meta);color:var(--ink-3)">${esc(t('msgTurnOffSub'))}</span></span>
    </label>

    <div class="field"><label>${esc(t('msgPreview'))}</label>
      <div class="lchat"><div class="lbub" id="mP"></div></div>
      <div class="hint">${esc(t('msgPreviewHint'))}</div></div>

    <button class="btn primary" id="mS">${esc(t('admResSave'))}</button>
    <button class="btn soft" id="mTest">${esc(t('msgTest'))}</button>
    ${m.edited ? `<button class="btn ghost" id="mR">${esc(t('msgReset'))}</button>` : ''}
    <button class="btn ghost" id="mX">${esc(t('cancel'))}</button>`, { wide:true });

  /* ── พรีวิวแบบเดียวกับที่เซิร์ฟเวอร์เรนเดอร์: บรรทัดที่มีตัวแปรว่างจะหายทั้งบรรทัด
        ตรงนี้เติมค่าตัวอย่างให้ทุกตัว จึงเห็นครบทุกบรรทัด ── */
  const render = () => {
    const fill = s2 => String(s2).replace(/\{(\w+)\}/g, (_, k) => `(${k})`);
    const head = fill($('#mT').value).trim();
    const body = fill($('#mB').value);
    $x('#mP').innerHTML = `<b>${esc(head)}</b>` +
      (body ? '<br>' + body.split('\n').map(l =>
        /^https?:\/\//.test(l.trim())
          ? `<span class="llink">${esc(l)}</span>` : esc(l)).join('<br>') : '');
  };
  $('#mT').oninput = render; $('#mB').oninput = render; render();

  // แตะชิปตัวแปรแล้วแทรกลงตำแหน่งเคอร์เซอร์ — พิมพ์ชื่อตัวแปรเองมีโอกาสสะกดผิด
  document.querySelectorAll('.vchip').forEach(c => c.onclick = () => {
    const ta = $('#mB'), p = ta.selectionStart ?? ta.value.length, tag = `{${c.dataset.v}}`;
    ta.value = ta.value.slice(0, p) + tag + ta.value.slice(ta.selectionEnd ?? p);
    ta.focus(); ta.selectionStart = ta.selectionEnd = p + tag.length;
    render();
  });

  $('#mX').onclick = closeSheet;
  if($('#mR')) $('#mR').onclick = async () => {
    try{ await apiRetry('resetMessage', { key:m.key }, 'POST'); closeSheet();
         toast(t('msgResetOk'), 'ok'); refresh(); }catch(e){ toast(t('netErr'), 'bad'); }
  };
  $('#mTest').onclick = async () => {
    const b = $('#mTest'); b.disabled = true;
    try{
      const r = await apiRetry('testMessage', { key:m.key }, 'POST');
      toast(r?.ok ? t('msgTestSent')
                  : (r?.error === 'NO_LINE' ? t('msgTestNoLine') : t('netErr')),
            r?.ok ? 'ok' : 'bad');
    }catch(e){ toast(t('netErr'), 'bad'); }
    b.disabled = false;
  };
  const save = async (confirm) => {
    const b = $('#mS'); b.disabled = true;
    try{
      const r = await apiRetry('saveMessage', {
        key:m.key, title:$('#mT').value, body:$('#mB').value,
        urgency:$('#mU').value, off:$('#mO').checked, confirm: !!confirm
      }, 'POST');
      /* ตัวแปรที่โค้ดไม่ได้ส่งให้ จะกลายเป็นช่องว่างตอนส่งจริงทุกฉบับ
         ถามก่อนดีกว่าปล่อยให้ข้อความขาดชื่อไปเงียบๆ เป็นเดือน */
      if(r?.error === 'UNKNOWN_VARS'){
        b.disabled = false;
        if(confirm2(t('msgBadVars')(r.vars.join(', ')))) return save(true);
        return;
      }
      if(r?.ok === false) throw 0;
      closeSheet(); toast(t('admResSaved'), 'ok'); refresh();
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };
  $('#mS').onclick = () => save(false);
}
const confirm2 = msg => window.confirm(msg);

ROUTES['admin-parcels'] = async (params = {}) => {
  setTitle(t('prcTitle'));
  if(!S.isOfficer && !S.isAdmin){
    $x('#main').innerHTML = `<div class="view" style="padding-top:36px">
      ${emptyState(IC.info, t('adminNo'), t('adminNoBody'))}</div>`; return;
  }
  const F = ['wait', 'done', 'unid', 'all'];
  let filter = F.includes(params.filter) ? params.filter : 'wait';
  let kw = params.kw || '', page = Number(params.page) || 0;

  $x('#main').innerHTML = `<div class="view">
    <div class="srch">
      <input id="pKw" value="${esc(kw)}" placeholder="${esc(t('prcSearch'))}"
        inputmode="search" enterkeyhint="search">
      <button id="pKwGo" aria-label="${esc(t('prcSearch'))}">${IC.search}</button>
    </div>
    <div class="chips" id="pF" style="margin:11px 0">${F.map(f => `
      <button class="chip ${f === filter ? 'on' : ''}" data-f="${f}">${esc(t('prcF_' + f))}</button>`).join('')}</div>
    <div id="pList">${skeleton(4)}</div>
    <div id="pPage"></div>
  </div>`;

  const nav = o => go('admin-parcels', Object.assign({ filter, kw, page }, o), true);
  document.querySelectorAll('#pF .chip').forEach(b =>
    b.onclick = () => nav({ filter:b.dataset.f, page:0 }));
  const search = () => nav({ kw:$('#pKw').value.trim(), page:0 });
  $('#pKwGo').onclick = search;
  $('#pKw').onkeydown = e => { if(e.key === 'Enter') search(); };

  let r = null;
  try{ r = await apiRetry('parcelReport', { filter, kw, page }, 'GET'); }catch(e){}
  if(!r?.ok){ $x('#pList').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }

  /* ── รายการ ── */
  if(!r.items.length){
    $x('#pList').innerHTML = emptyState(IC.box, t('prcNone'),
      kw ? t('prcNoneKw')(kw) : t('prcNoneBody'));
    $x('#pPage').innerHTML = '';
    return;
  }
  const PILL = { arrived:'wait', notified:'wait', unidentified:'wait',
                 claimed:'done', closed:'done' };
  const LBL  = { arrived:t('prcS_wait'), notified:t('prcS_wait'),
                 unidentified:t('prcS_unid'), claimed:t('prcS_done'), closed:t('prcS_done') };

  $x('#pList').innerHTML = `<div class="rows">${r.items.map(p => {
    const done = PILL[p.status] === 'done';
    /* เวลาที่รอ คือตัวเลขที่บอกอะไรได้จริงที่สุดในหน้านี้
       ของที่รับแล้ว = รอไปกี่วันกว่าจะมารับ · ของที่ยังค้าง = ค้างมาแล้วกี่วัน */
    const h = p.wait_h;
    const wait = h === null ? '' :
      (h < 24 ? t('prcHrs')(Math.round(h)) : t('prcDays')(Math.round(h / 24)));
    const late = !done && h !== null && h >= 72;
    return `<button class="row" data-id="${esc(p.record_id)}">
      ${p.thumb_id ? `<img class="thumb" data-ph="${esc(p.thumb_id)}" alt="">`
                   : `<div class="thumb">${IC.box}</div>`}
      <div class="body">
        <div class="t">${esc(p.title || p.tracking_no || t('prcUntitled'))}</div>
        <div class="s">${esc([
            p.who || t('prcNoWho'),
            done ? t('prcGotOn')(fmtDate(p.closed_at)) : t('prcInOn')(fmtDate(p.created_at))
          ].join(' · '))}</div>
        ${p.tracking_no ? `<div class="s" style="font-family:ui-monospace,monospace">${
          esc(p.tracking_no)}</div>` : ''}
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <span class="pill ${PILL[p.status] || 'wait'}">${esc(LBL[p.status] || p.status)}</span>
        ${wait ? `<div class="pwait ${late ? 'late' : ''}">${esc(wait)}</div>` : ''}
      </div>
    </button>`;
  }).join('')}</div>`;
  paintPhotos($('#pList'));

  const byId = {}; r.items.forEach(p => byId[p.record_id] = p);
  document.querySelectorAll('#pList .row').forEach(b =>
    b.onclick = () => parcelSheet(byId[b.dataset.id]));

  /* ── หน้าถัดไป ── */
  const last = Math.max(0, Math.ceil(r.total / r.per) - 1);
  $x('#pPage').innerHTML = last > 0 ? `<div class="pager">
    <button class="btn ghost" id="pPrev" ${page <= 0 ? 'disabled' : ''}>← ${esc(t('prcPrev'))}</button>
    <span>${esc(t('prcPageN')(page + 1, last + 1, r.total))}</span>
    <button class="btn ghost" id="pNext" ${page >= last ? 'disabled' : ''}>${esc(t('prcNext'))} →</button>
  </div>` : `<p class="pager-n">${esc(t('prcShowing')(r.total))}</p>`;
  if($('#pPrev')) $('#pPrev').onclick = () => nav({ page:page - 1 });
  if($('#pNext')) $('#pNext').onclick = () => nav({ page:page + 1 });
};

        <div class="t" style="font-family:ui-monospace,monospace">${esc(p.tracking_no)}</div></div></div>` : ''}
      <div class="row"><div class="body"><div class="s">${esc(t('prcLogged'))}</div>
        <div class="t">${esc(fmtDate(p.created_at))}${p.by ? ' · ' + esc(p.by) : ''}</div></div></div>

        <div class="t">${esc(p.wait_h === null ? '—'
          : (p.wait_h < 24 ? t('prcHrs')(Math.round(p.wait_h))

      <div class="row"><div class="body"><div class="s">${esc(t('prcId'))}</div>

    <div style="height:12px"></div>

ROUTES['my-parcels'] = async (params = {}) => {
  setTitle(t('pcTitle'));
  $x('#main').innerHTML = `<div class="view">
    ${S.isOfficer ? `<button class="btn soft" id="toUn" style="margin-bottom:14px">${esc(t('unTitle'))}</button>` : ''}
    <div id="list">${skeleton(3)}</div></div>`;
  if($('#toUn')) $('#toUn').onclick = () => go('unidentified');
  const r = await apiRetry('getMyParcels', {}, 'GET');
  const items = r?.items || [];
  const waiting = items.filter(i => i.status === 'arrived' || i.status === 'notified');
  const done    = items.filter(i => i.status === 'claimed' || i.status === 'closed');
  if(!items.length){
    $x('#list').innerHTML = emptyState(IC.box, t('pcEmpty'), t('pcEmptyBody'));
    return;
  }
  const rowHtml = (p, act) => `
    <button class="row" data-id="${esc(p.record_id)}" ${act ? 'data-act="1"' : ''}>
      ${p.thumb_id ? `<img class="thumb" data-ph="${esc(p.thumb_id)}" alt="">` : `<div class="thumb">${IC.box}</div>`}
      <div class="body">
        <div class="t">${esc(p.title || p.tracking_no || (S.lang === 'th' ? 'พัสดุ' : 'Parcel'))}</div>
        <div class="s">${esc(t('pcArrived')(fmtDate(p.created_at)))}</div>
      </div>
      ${act ? `<span class="pill wait">${esc(t('pcWaiting'))}</span>` : `<span class="pill done">${esc(t('pcClaim'))}</span>`}
    </button>`;
  $x('#list').innerHTML = `
    ${waiting.length ? `<div class="section-title">${esc(t('pcWaiting'))}</div>
      <div class="rows">${waiting.map(p => rowHtml(p, true)).join('')}</div>` : ''}
    ${done.length ? `<div class="section-title">${esc(t('pcHistory'))}</div>
      <div class="rows">${done.map(p => rowHtml(p, false)).join('')}</div>` : ''}`;
  const byId = {}; items.forEach(p => byId[p.record_id] = p);
  document.querySelectorAll('#list .row[data-act]').forEach(b =>
    b.onclick = () => claimSheet(b.dataset.id, byId[b.dataset.id]));

  // มาจากลิงก์ในข้อความแจ้งเตือน หรือกดจากหน้าการแจ้งเตือน → เปิดพัสดุชิ้นนั้นเลย
  const focus = params.rec;
  if(focus && byId[focus]){
    const row = document.querySelector(`#list .row[data-id="${CSS.escape(focus)}"]`);
    if(row) row.scrollIntoView({ block:'center' });
    setTimeout(() => claimSheet(focus, byId[focus]), 260);
  }else if(focus){
    toast(t('recGone'));
  }
  paintPhotos($('#list'));
  document.querySelectorAll('#list img[data-ph]').forEach(im => {
    // แตะที่รูปเล็ก = เปิดดูจ่าหน้าเต็มจอทันที ไม่ต้องผ่านหน้ายืนยัน
    im.onclick = ev => {
      ev.stopPropagation();
      const p = byId[im.closest('.row').dataset.id] || {};
      openPhoto(p.photo_id || im.dataset.ph, p.title || '');
    };
  });
};

ROUTES['parcel-in'] = async () => {
  setTitle(t('inTitle'));
  $x('#main').innerHTML = `<div class="view">
    <label class="shot" id="shot">
      <input type="file" accept="image/*" capture="environment" id="file" hidden>
      <div class="ph">${IC.cam}<p>${esc(t('inShoot'))}</p>
        <p style="opacity:.7;font-weight:400;margin-top:4px">${esc(t('inShootSub'))}</p></div>
    </label>
    <div style="margin-top:14px" id="afterShot" hidden>
      <button class="btn soft" id="scanBtn">${esc(t('inScan'))}</button>
      <div class="field" style="margin-top:16px">
        <label>${esc(t('inRecipient'))}<span class="en">${esc(t('inRecipientEn'))}</span></label>
        <button class="picker-btn" id="rcp">
          <span class="nm ph" id="rcpNm">${esc(t('inPick'))}</span><span class="ch">▾</span>
        </button>
      </div>
      <div class="field">
        <label>${esc(t('inTracking'))}</label>
        <input id="trk" inputmode="latin" autocomplete="off" placeholder="TH01234567890">
      </div>
      <div class="sticky-cta"><button class="btn primary" id="saveBtn">${esc(t('inSave'))}</button></div>
    </div>
  </div>`;

  const fileEl = $('#file');
  $('#shot').onclick = e => { if(e.target.tagName !== 'INPUT') fileEl.click(); };
  fileEl.onchange = async () => {
    const f = fileEl.files[0]; if(!f) return;
    const im = await shrink2(f);
    S.draft.photo = im.full; S.draft.thumb = im.thumb;
    $x('#shot').innerHTML = `<img src="${im.full}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    $('#shot').onclick = () => fileEl.click();
    $('#afterShot').hidden = false;
  };

  // โหลดรายชื่อพนักงานล่วงหน้าตอนที่ผู้ใช้กำลังถ่ายรูป — พอเลื่อนลงมาจะพร้อมแล้ว
  if(!S.employees.length){
    try{ const r = await cached('emp', 6e5, () => apiRetry('getEmployees', {}, 'GET'));
         S.employees = r?.items || []; }catch(e){}
  }

  let chosen = null, isUnknown = false;
  const nmEl = $('#rcpNm'), saveBtn = $('#saveBtn');
  $('#rcp').onclick = async () => {
    const pick = await pickPerson();
    if(!pick) return;
    if(pick.unknown){
      isUnknown = true; chosen = null;
      nmEl.className = 'nm'; nmEl.textContent = t('inUnknown');
      saveBtn.textContent = t('inSaveUnknown');
    }else{
      isUnknown = false; chosen = pick;
      nmEl.className = 'nm';
      nmEl.innerHTML = `${esc(pick.name_th || pick.name_en)}` +
        (pick.department ? `<small>${esc(pick.department)}</small>` : '');
      saveBtn.textContent = t('inSave');
    }
  };

  $('#scanBtn').onclick = async () => {
    const b = $('#scanBtn'); b.disabled = true; b.textContent = t('inScanning');
    try{
      const r = await apiRetry('scanParcelPhoto', { photo:S.draft.photo }, 'POST');
      if(r?.trackingNo) $('#trk').value = r.trackingNo;
      const guess = (r?.recipientName || '').trim();
      let matched = null;
      if(guess){
        const n = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
        const g = n(guess);
        matched = S.employees.find(p => n(p.name_th) === g || n(p.nickname) === g)
               || S.employees.find(p => g.includes(n(p.nickname)) && n(p.nickname).length > 1)
               || S.employees.find(p => n(p.name_th).includes(g) && g.length > 2);
      }
      if(matched){
        // AI เดาให้ แต่ยังต้องให้คนกดยืนยันเสมอ — แจ้งผิดคนเสียความเชื่อมั่นกว่าที่คิด
        chosen = matched; isUnknown = false;
        nmEl.className = 'nm';
        nmEl.innerHTML = `${esc(matched.name_th || matched.name_en)}` +
          (matched.department ? `<small>${esc(matched.department)}</small>` : '');
        saveBtn.textContent = t('inSave');
      }
      toast(matched ? t('inScanOk') : t('inScanFail'), matched ? 'ok' : '');
    }catch(e){ toast(t('inScanFail')); }
    b.disabled = false; b.textContent = t('inScan');
  };

  saveBtn.onclick = async () => {
    if(!S.draft.photo){ toast(t('inNeedPhoto'), 'bad'); return; }
    const unknown = isUnknown || !chosen;
    const btn = saveBtn; btn.disabled = true;
    try{
      await apiRetry('logParcel', {
        photo:S.draft.photo,
        thumb:S.draft.thumb,
        recipient_id: unknown ? '' : chosen.kenan_user_id,
        recipient_name: unknown ? '' : (chosen.name_th || chosen.name_en || ''),
        tracking_no: $('#trk').value.trim()
      }, 'POST');
      S.draft = { photo:null, thumb:null, scan:null, recipient:null, tracking:'' };
      toast(unknown ? t('inDoneUnknown') : t('inDone'), 'ok');
      go('parcel-in', {}, true);   // พร้อมถ่ายชิ้นถัดไปทันที ไม่ต้องกดกลับ
    }catch(e){ toast(t('netErr'), 'bad'); btn.disabled = false; }
  };
};

  $x('#main').innerHTML = `<div class="view">

/** ปุ่มวัดความเร็ว — ย้ายออกมาเป็นฟังก์ชัน เพราะหน้าฉันถูกรื้อใหม่
    net = รอทั้งหมด · srv = Apps Script ใช้จริง · db = อ่าน Google Sheet
    net สูงแต่ srv ต่ำ แปลว่าเสียเวลาไปกับการปลุกเครื่อง ไม่ใช่โค้ดช้า */
async function speedTest(){
  const box = $('#spdOut'); box.hidden = false; box.textContent = t('loading');
  const t1 = performance.now(); const p1 = await apiRetry('ping', {}, 'GET');
  const cold = Math.round(performance.now() - t1);
  const t2 = performance.now(); await apiRetry('ping', {}, 'GET');
  const warm = Math.round(performance.now() - t2);
  const okBuild = p1?.build === CFG.BUILD;
  box.textContent =
    (okBuild ? '✅ ' + t('spdBuildOk') + ' (' + CFG.BUILD + ')'
             : '⚠️ ' + t('spdBuildBad') + '\n   ' + t('spdBuildApp') + ': ' + CFG.BUILD +
               '\n   ' + t('spdBuildSrv') + ': ' + (p1?.build || t('spdBuildOld'))) + '\n\n' +
    t('spdFirst') + ': ' + cold + ' ms\n' +
    t('spdSecond') + ': ' + warm + ' ms\n\n' +
    'action  net / srv / db (ms)\n' +
    S.timings.map(x => x.a + '  ' + x.net + ' / ' + (x.srv ?? '-') + ' / ' + (x.db ?? '-')).join('\n');
}

    return `<span class="pill" style="background:var(--neutral);color:var(--ink-3)">${esc(t('roleStaff'))}</span>`;
  };
  const paint = kw => {
    const k = String(kw || '').toLowerCase();
    const hits = users.filter(u => !k ||
      String(u.name_th).toLowerCase().includes(k) ||
      String(u.nickname).toLowerCase().includes(k) ||
      String(u.email).toLowerCase().includes(k));

        </div>${badge(u)}

    document.querySelectorAll('#ulist .row:not([disabled])').forEach(b =>

    const cur = String(u.roles || 'staff');
    const lvl = cur.includes('admin') ? 'admin' : cur.includes('officer') ? 'officer' : 'staff';
    const opt = (v, th, sub) => `
      <button class="row" data-r="${v}" style="border-radius:12px;border:1.5px solid ${

        <div class="body"><div class="t">${esc(th)}</div><div class="s">${esc(sub)}</div></div>
        ${v === lvl ? '<span style="color:var(--primary);font-weight:800">✓</span>' : ''}
      </button>`;
    sheet(`<h3>${esc(u.name_th)}</h3><p class="sub">${esc(u.email)}</p>
      ${opt('staff',   t('roleStaff'),   t('roleStaffSub'))}
      ${opt('officer', t('roleOfficer'), t('roleOfficerSub'))}
      ${opt('admin',   t('roleAdmin'),   t('roleAdminSub'))}
      <button class="btn ghost" id="cx" style="margin-top:6px">${esc(t('cancel'))}</button>`);
    $('#cx').onclick = closeSheet;
    document.querySelectorAll('#sheetBody .row[data-r]').forEach(b => b.onclick = async () => {
      const roles = b.dataset.r === 'admin'   ? 'staff,officer,admin'
                  : b.dataset.r === 'officer' ? 'staff,officer' : 'staff';
      closeSheet();
      try{
        await apiRetry('setUserRoles', { target_id:u.kenan_user_id, roles }, 'POST');
        u.roles = roles; toast(t('roleSaved'), 'ok'); paint($('#rq').value);
      }catch(e){ toast(t('netErr'), 'bad'); }
    });
  }
};

    <div id="dl" class="dircols">${skeleton(4)}</div></div>`;

       people = r?.items || []; }catch(e){}
  if(!people.length){ $x('#dl').innerHTML = emptyState(IC.info, t('dirEmpty'), t('dirEmptyBody')); return; }

  const norm = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
  const paint = kw => {
    const k = norm(kw);
    const hits = !k ? people : people.filter(p =>
      norm(p.name_th).includes(k) || norm(p.name_en).includes(k) ||
      norm(p.nickname).includes(k) || norm(p.department).includes(k));
    if(!hits.length){ $x('#dl').innerHTML = `<div class="pk-empty">${esc(t('pkNone'))}</div>`; return; }
    // จัดกลุ่มตามแผนก — หาคนง่ายกว่าเรียงชื่อยาวๆ 40 คนรวด
    const groups = {};
    hits.forEach(p => { (groups[p.department || '—'] ||= []).push(p); });
    $x('#dl').innerHTML = Object.keys(groups).map(d => `
      <div class="dgrp">
      <div class="section-title">${esc(d)}</div>

          <div class="body">
            <div class="t">${esc(p.name_th || p.name_en)}${p.nickname ? ' · ' + esc(p.nickname) : ''}${

            <div class="s">${esc(p.position || p.phone || p.email || t('dirNoPhone'))}</div>
          </div><span class="go">${IC.chev}</span>
        </button>`).join('')}</div></div>`).join('');
    // ปุ่มวงกลมเล็กๆ สองอันชิดกันกดพลาดง่ายบนมือถือ → เปิดการ์ดที่มีปุ่มเต็มความกว้างแทน
    // ให้พนักงานรู้ว่าต้องติดต่อใครเวลามีปัญหา แทนที่จะเดินถามกันไปทั้งออฟฟิศ
  const staff = people.filter(p => /(^|,)\s*(admin|officer)\s*(,|$)/.test(String(p.roles || '')));

    $x('#dl').insertAdjacentHTML('afterbegin', `<div class="dgrp">
      <div class="section-title">${esc(t('dirAdmins'))}</div>
      <div class="rows">${staff.map(p => `
        <button class="row" data-id="${esc(p.kenan_user_id)}">
          <span class="av" style="background:var(--navy);color:#fff">${
            esc(String(p.name_th || '?').trim().charAt(0))}</span>
          <div class="body"><div class="t">${esc(p.name_th || p.name_en)}</div>
            <div class="s">${esc([p.position, p.department].filter(Boolean).join(' · '))}</div></div>
          <span class="go">${IC.chev}</span></button>`).join('')}</div></div>`);
  }
  document.querySelectorAll('#dl .row[data-id]').forEach(b => b.onclick = () => {
      const p = people.find(x => x.kenan_user_id === b.dataset.id); if(!p) return;
      sheet(`${p.photo ? `<img src="${p.photo}" alt=""
          style="width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px">` : ''}
        <h3 style="text-align:center">${esc(p.name_th || p.name_en)}${p.nickname ? ' · ' + esc(p.nickname) : ''}</h3>
        <p class="sub" style="text-align:center">${esc([p.position, p.department, p.office].filter(Boolean).join(' · '))}</p>
        ${p.phone ? `<a class="btn primary" href="tel:${esc(p.phone)}"
            style="text-decoration:none">📞 ${esc(t('dirCall'))} ${esc(p.phone)}</a>` : ''}
        ${p.email ? `<a class="btn ghost" href="mailto:${esc(p.email)}"
            style="text-decoration:none;word-break:break-all">✉ ${esc(p.email)}</a>` : ''}
        ${p.phone ? `<button class="btn ghost" id="cp">${esc(t('dirCopy'))}</button>` : ''}
        <button class="btn ghost" id="cx">${esc(t('close'))}</button>`);
      $('#cx').onclick = closeSheet;
      if($('#cp')) $('#cp').onclick = async () => {
        try{ await navigator.clipboard.writeText(p.phone); toast(t('dirCopied'), 'ok'); }
        catch(e){ toast(p.phone); }
      };
    });
  };
  paint('');
  $('#dq').oninput = e => paint(e.target.value);
};

/* ── เวลาทุกจุดในแอปยึดเวลาไทย ไม่ใช่เวลาของเครื่อง ───────────────
   ของเดิมใช้เวลาเครื่อง ซึ่งตรงกันเกือบตลอดจนไม่มีใครสังเกต
   แต่พังเงียบๆ กับสองกรณีที่เกิดจริงในออฟฟิศนี้:
   เจ้าหน้าที่ต่างชาติที่ยังไม่ได้ตั้งโซนเวลาเครื่องเป็นไทย
   และคนที่เปิดแอปตอนไปราชการต่างประเทศ — เขาจะเห็นทุกการจองเลื่อนไปทั้งวัน
   แล้วไปถึงห้องผิดเวลาโดยที่ระบบไม่ได้เตือนอะไรเลย                        */
const BKK_TZ = 'Asia/Bangkok';
const _bkkFmt = new Intl.DateTimeFormat('en-GB', { timeZone:BKK_TZ,
  year:'numeric', month:'2-digit', day:'2-digit',
  hour:'2-digit', minute:'2-digit', hour12:false });
function bkkParts(d){
  const p = {};
  _bkkFmt.formatToParts(new Date(d)).forEach(x => { if(x.type !== 'literal') p[x.type] = x.value; });
  // เที่ยงคืนบางเครื่องคืนมาเป็น 24 — ปรับให้เป็น 00 ตามที่คนอ่าน
  if(p.hour === '24') p.hour = '00';
  return p;
}
const dayKey = d => { const p = bkkParts(d); return `${p.year}-${p.month}-${p.day}`; };
const hhmm = iso => { try{ const p = bkkParts(iso); return `${p.hour}:${p.minute}`; }catch(e){ return ''; } };
const H0 = 8, H1 = 18, HPX = 44;            // ตาราง 08:00–18:00 ช่องละ 44px
const minsFrom8 = iso => { const p = bkkParts(iso);
  return (Number(p.hour) - H0) * 60 + Number(p.minute); };
/* ในช่องแคบๆ ของตาราง เวลาเริ่มกับชื่อเต็มอ่านไม่ทัน
   บอก "ยาวแค่ไหน" กับ "ใคร" พอ — เวลาเริ่มดูได้จากตำแหน่งของบล็อกอยู่แล้ว */
const durLabel = (s, e) => {
  const m = Math.round((Date.parse(e) - Date.parse(s)) / 60000);
  if(m < 60) return m + (S.lang==='th' ? ' น.' : 'm');
  const hh = Math.floor(m/60), mm = m%60;
  return hh + (mm ? '.' + Math.round(mm/6) : '') + (S.lang==='th' ? ' ชม.' : ' hr');
};
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';


/* ══════════════════════════════════════════════════════════════════
 *  แถบขั้นตอน · ปฏิทินรายเดือน — เพิ่ม 2026-09-06b

/**
 * แถบบอกว่าตอนนี้อยู่ขั้นไหน และเหลืออีกกี่ขั้น
 *
 * ที่ต้องมี เพราะการเข้าใช้ครั้งแรกไม่ใช่หน้าเดียว มันมีสี่หน้าเรียงกัน
 * คนที่ไม่รู้ว่ามีสี่หน้า พอเจอหน้าที่สองจะคิดว่า "ยังอีกเหรอ" แล้วปิดทิ้ง
 * บอกไปตรงๆ ตั้งแต่หน้าแรกว่าเหลืออีกสามขั้น เขาจะรออีกสามขั้นได้
 */
function stepBar(steps, cur){
  const left = steps.length - cur - 1;
  return `<nav class="stpb" aria-label="${esc(t('stpAria')(cur + 1, steps.length))}">
    <ol class="stpl">${steps.map((s, i) => `
      <li class="stp ${i < cur ? 'done' : i === cur ? 'now' : ''}"
          ${i === cur ? 'aria-current="step"' : ''}>
        <span class="stpn" aria-hidden="true">${i < cur ? '✓' : i + 1}</span>
        <span class="stpt">${esc(s)}</span>
      </li>`).join('')}</ol>
    <p class="stpleft">${esc(left > 0 ? t('stpLeft')(left) : t('stpLast'))}</p>
  </nav>`;
}
/* ลำดับจริงของการเข้าใช้ครั้งแรก — เขียนไว้ที่เดียว ทุกหน้าจะได้นับตรงกัน
   ถ้าวันหนึ่งเพิ่มหรือลดขั้น แก้ตรงนี้แล้วทุกหน้าขยับตาม */
const ONBOARD = () => [t('obLine'), t('obConsent'), t('obYou'), t('obMail')];

/**
 * ปฏิทินรายเดือน
 *
 * มุมมองรายวันตอบได้แค่ "วันนี้ว่างไหม" แต่คำถามที่คนถามก่อนจองจริงๆ คือ
 * "เดือนนี้วันไหนยังว่าง" ซึ่งต้องเห็นทั้งเดือนพร้อมกันถึงจะตอบได้
 *
 * จงใจไม่แสดงรายละเอียดทุกใบ หน้าที่ของมันคือชี้ให้เห็นว่าวันไหนแน่นวันไหนโล่ง
 * แล้วให้กดเข้าไปดูของจริงในมุมมองรายวัน
 *
 * ev = [{ day:'YYYY-MM-DD', label, tone }]   tone: '' | warn | bad | mine
 */
function monthGrid({ ym, events, sel, onDay, onMonth, legend }){
  const [Y, Mo] = String(ym).split('-').map(Number);
  const first = new Date(Y, Mo - 1, 1);
  const start = new Date(first);
  start.setDate(1 - first.getDay());            // ตารางเริ่มวันอาทิตย์เสมอ
  const byDay = {};
  (events || []).forEach(e => { (byDay[e.day] = byDay[e.day] || []).push(e); });
  const today = dayKey(new Date());
  const loc = S.lang === 'th' ? 'th-TH' : 'en-GB';

  const dows = Array.from({ length:7 }, (_, i) => {
    const d = new Date(2024, 8, 1 + i);          // 1 ก.ย. 2024 = วันอาทิตย์
    return { n:d.toLocaleDateString(loc, { weekday:'short' }), we:(i === 0 || i === 6) };
  });

  /* เดือนส่วนใหญ่ใช้ 5 แถวก็พอ บังคับ 6 แถวเสมอจะได้แถวว่างเปล่าทั้งแถว
     ซึ่งกินพื้นที่จอมือถือไปฟรีๆ หนึ่งในเจ็ดของหน้า */
  const inMonth = new Date(Y, Mo, 0).getDate();
  const rows = Math.ceil((first.getDay() + inMonth) / 7);

  const cells = Array.from({ length:rows * 7 }, (_, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = dayKey(d), inM = d.getMonth() === Mo - 1, ev = byDay[k] || [];
    return `<button class="mc ${inM ? '' : 'out'} ${k === today ? 'today' : ''} ${
        k === sel ? 'on' : ''}" data-d="${k}"
        aria-label="${esc(d.toLocaleDateString(loc, { day:'numeric', month:'long' }) +
                          (ev.length ? ' · ' + t('mnN')(ev.length) : ''))}">
      <span class="mcd">${d.getDate()}</span>
      <span class="mce" aria-hidden="true">${ev.slice(0, 4).map(e =>
        `<i class="mdot ${e.tone || ''}"></i>`).join('')}${
        ev.length > 4 ? `<i class="mmore">+${ev.length - 4}</i>` : ''}</span>
      <span class="mcl" aria-hidden="true">${ev.slice(0, 3).map(e =>
        `<em class="mbar ${e.tone || ''}">${esc(e.label || '')}</em>`).join('')}${
        ev.length > 3 ? `<em class="mbar more">+${ev.length - 3}</em>` : ''}</span>
    </button>`;
  }).join('');

  const html = `
    <div class="mnav">
      <button class="mbtn" id="mPrev" aria-label="${esc(t('mnPrev'))}">‹</button>
      <h3>${esc(first.toLocaleDateString(loc, { month:'long', year:'numeric' }))}</h3>
      <div style="display:flex;gap:7px">
        <button class="mbtn mtoday" id="mNow">${esc(t('rmToday'))}</button>
        <button class="mbtn" id="mNext" aria-label="${esc(t('mnNext'))}">›</button>
      </div>
    </div>
    <div class="mgrid">
      <div class="mdow">${dows.map(x =>
        `<span class="${x.we ? 'we' : ''}">${esc(x.n)}</span>`).join('')}</div>
      <div class="mbody" data-rows="${rows}">${cells}</div>
    </div>
    ${legend ? `<div class="mlgd">${legend.map(l =>
      `<span><i class="mdot ${l.tone || ''}"></i>${esc(l.label)}</span>`).join('')}</div>` : ''}`;

  // ผูกปุ่มให้เอง เพื่อให้ที่เรียกใช้เขียนแค่บรรทัดเดียว
  const wire = root => {
    const shift = n => {
      const d = new Date(Y, Mo - 1 + n, 1);
      onMonth(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    };
    root.querySelector('#mPrev').onclick = () => shift(-1);
    root.querySelector('#mNext').onclick = () => shift(1);
    root.querySelector('#mNow').onclick  = () => {
      const n = new Date();
      onMonth(`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`, dayKey(n));
    };
    root.querySelectorAll('.mc').forEach(b => { b.onclick = () => onDay(b.dataset.d); });
  };
  return { html, wire };
}

/** 'YYYY-MM' ของวันที่หนึ่ง และวันแรกที่ตารางต้องขอข้อมูล (ย้อนไปถึงอาทิตย์ก่อนหน้า) */
const ymOf = d => { const p = bkkParts(d); return `${p.year}-${p.month}`; };
function monthWindow(ym){
  const [Y, Mo] = String(ym).split('-').map(Number);
  const first = new Date(Y, Mo - 1, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  return { from:`${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${
                  String(start.getDate()).padStart(2, '0')}`, days:42 };
}

ROUTES['room-new'] = async ({ date, room:preRoom, hour, kind:k0 } = {}) => {
  const kind = k0 === 'zoom' ? 'zoom' : 'room';
  setTitle(kind === 'zoom' ? t('zoomTitle') : t('rmBook'));
  const day = date || dayKey(new Date());
  const h1  = hour ? String(hour).padStart(2,'0') + ':00' : '09:00';
  const h2  = hour ? String(Math.min(Number(hour)+1,18)).padStart(2,'0') + ':00' : '10:00';
  let rooms = [];
  try{ const r = await apiRetry('getRoomDay', { date:day, kind }, 'GET'); rooms = r?.rooms || []; }catch(e){}

  $x('#main').innerHTML = `<div class="view">
    <div class="card">
      <div style="font-size:13px;font-weight:600;margin-bottom:9px">${esc(kind === 'zoom' ? t('zoomPick') : t('rmPick'))}</div>
      <div id="rp">${rooms.map((rm, i) => `
        <button class="row" data-v="${esc(rm.resource_id)}" style="border:1.5px solid ${
          (preRoom?rm.resource_id===preRoom:i===0)?'var(--primary)':'var(--line)'};border-radius:12px;
          margin-bottom:8px;background:${(preRoom?rm.resource_id===preRoom:i===0)?'#EEF3FF':'#fff'}">
          ${phImg(rm,'rphoto','width:52px;height:40px') || `<div class="rphoto" style="width:52px;height:40px">${IC.cal}</div>`}
          <div class="body"><div class="t">${esc(rm.name_th)}</div>
            <div class="s">${esc([rm.capacity?t('rmSeats')(rm.capacity):'', rm.note].filter(Boolean).join(' · '))}</div></div>
          <span class="ck" style="color:var(--primary);font-weight:800;${
            (preRoom?rm.resource_id===preRoom:i===0)?'':'visibility:hidden'}">✓</span>
        </button>`).join('')}</div>
    </div>
    <div class="card">
      <label class="switch" style="margin-bottom:12px">
        <input type="checkbox" id="rmulti">
        <span><b>${esc(t('rmMulti'))}</b></span>
      </label>
      <div class="times">
        <div class="tbox"><div class="k">${esc(t('rmFrom'))}</div>
          <input type="date" id="dd" value="${day}" class="tin">
          <input type="time" id="t1" value="${h1}" class="tin big"></div>
        <div class="arrow">→</div>
        <div class="tbox hl"><div class="k">${esc(t('rmTo'))}</div>
          <input type="date" id="dd2" value="${day}" class="tin" hidden>
          <input type="time" id="t2" value="${h2}" class="tin big"></div>
      </div>
    </div>
    <div class="card">
      <div class="field" style="margin:0"><label>${esc(t('rmSubject'))}<span class="req">*</span></label>
        <input id="ti" placeholder="${esc(t('rmSubjectPh'))}"></div>
    </div>
    <div class="note info">${IC.info}<div>${esc(t('rmIcsHint'))}</div></div>
    <div class="sticky-cta"><button class="btn primary" id="go">${esc(t('rmGo'))}</button></div>
  </div>`;

  $('#rmulti').onchange = () => {
    $('#dd2').hidden = !$('#rmulti').checked;
    if($('#rmulti').checked && $('#dd2').value <= $('#dd').value){
      const n = new Date($('#dd').value + 'T00:00:00'); n.setDate(n.getDate() + 1);
      $('#dd2').value = dayKey(n);
    }
  };
  let room = preRoom || rooms[0]?.resource_id || '';
  paintPhotos($('#rp'));
  document.querySelectorAll('#rp .row').forEach(b => b.onclick = () => {
    room = b.dataset.v;
    document.querySelectorAll('#rp .row').forEach(x => {
      const on = x === b;
      x.style.borderColor = on ? 'var(--primary)' : 'var(--line)';
      x.style.background  = on ? '#EEF3FF' : '#fff';
      x.querySelector('.ck').style.visibility = on ? 'visible' : 'hidden';
    });
  });
  $('#go').onclick = async () => {
    const title = $('#ti').value.trim();
    if(!title){ toast(t('admNeedTitle'), 'bad'); return; }
    const d = $('#dd').value, a = $('#t1').value, z = $('#t2').value;
    const d2 = ($('#rmulti').checked && $('#dd2').value) ? $('#dd2').value : d;
    if(!d || !a || !z){ toast(t('rmBadTime'), 'bad'); return; }
    const sIso = `${d}T${a}:00+07:00`, eIso = `${d2}T${z}:00+07:00`;
    if(Date.parse(eIso) <= Date.parse(sIso)){ toast(t('rmBadTime'), 'bad'); return; }
    const b = $('#go'); b.disabled = true;
    try{
      const r = await apiRetry('createRoomBooking', {
        resource_id:room, title, start_at:sIso, end_at:eIso
      }, 'POST');
      if(r?.error === 'CLASH'){
        toast(`${t('rmClash')} · ${r.clash?.who || ''}`, 'bad');
        b.disabled = false; return;
      }
      if(r?.ok === false) throw 0;
      toast(t('rmOk'), 'ok');
      S.stack = [{ name:'home', params:{} }]; go('rooms', { date:d, kind });
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };
};

ROUTES.equipment = async (params = {}) => {
  setTitle(t('eqTitle'));
  const view = params.view === 'cal' ? 'cal' : 'list';
  $x('#main').innerHTML = `<div class="view">
    <button class="btn soft" id="scan">▣ ${esc(t('eqScan'))}</button>
    <div class="fhint" style="margin:8px 0 12px">${esc(t('eqScanHint'))}</div>
    <div class="seg2" id="esg">
      <button class="${view==='list'?'on':''}" data-v="list">${esc(t('eqList'))}</button>
      <button class="${view==='cal'?'on':''}" data-v="cal">${esc(t('eqCal'))}</button>
    </div>
    ${view === 'list' ? `<div class="note info">${IC.info}<div>${esc(t('eqWhy'))}</div></div>` : ''}
    <div id="el" style="margin-top:12px" class="${view==='list'?'eqcols':''}">${
      S.cache.eq && view === 'list' ? '' : skeleton(3)}</div></div>`;
  $('#scan').onclick = scanTag;
  document.querySelectorAll('#esg button').forEach(b =>
    b.onclick = () => go('equipment', { view:b.dataset.v }, true));

  if(view === 'cal'){
    const ym = params.ym || ymOf(new Date());
    const w  = monthWindow(ym);
    let mr = null;
    try{ mr = await apiRetry('getEquipMonth', { date:w.from, days:w.days }, 'GET'); }catch(e){}
    if(!mr?.ok){ $x('#el').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }
    /* การยืมกินหลายวัน จึงต้องกางออกเป็นวันๆ ไม่งั้นจะเห็นแค่วันที่หยิบไป
       แล้วเข้าใจผิดว่าวันที่เหลือของยังว่างอยู่ */
    const ev = [];
    mr.items.forEach(x => {
      const s0 = new Date(Date.parse(x.start_at));
      const e0 = new Date(Date.parse(x.end_at || x.start_at));
      if(isNaN(s0)) return;
      for(let d = new Date(s0), n = 0; d <= e0 && n < 40; d.setDate(d.getDate() + 1), n++){
        ev.push({ day: dayKey(d),
                  label: `${x.name}${x.who ? ' · ' + firstName(x.who) : ''}`,
                  tone: x.mine ? 'mine' : x.status === 'issued' ? 'warn' : '' });
      }
    });
    const g = monthGrid({
      ym, events:ev,
      legend: [{ tone:'mine', label:t('mnMine') }, { tone:'warn', label:t('mnOut') },
               { tone:'', label:t('eqReserved') }],
      onDay: () => go('equipment', { view:'list' }, true),
      onMonth: nym => go('equipment', { view:'cal', ym:nym }, true)
    });
    $x('#el').innerHTML = g.html;
    g.wire($('#el'));
    return;
  }

  const pre = takePre('eq');
  if(pre) S.cache.eq = { at:Date.now(), v:pre };
  await swr('eq', () => apiRetry('getEquipment', {}, 'GET'),
            r => paintEquipment(r?.items || []), 12000);
};

function paintEquipment(items){
  if(!items.length){ $x('#el').innerHTML = emptyState(IC.laptop, t('eqEmpty'), t('eqEmptyBody')); return; }

  const mine  = items.filter(i => i.mine);
  const myRes = items.filter(i => i.reservations?.some(x => x.mine));
  const card = i => `
    <button class="rcard" data-id="${esc(i.resource_id)}">
      ${phImg(i,'rphoto') || `<div class="rphoto">${IC.laptop}</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:700">${esc(i.name_th)}</div>
        <div style="font-size:var(--fs-meta);color:var(--ink-3)">${
          esc(i.available ? (i.storage_location || i.category || '')
                          : (i.holder ? t('eqBy')(i.holder) : t('eqOut')))}</div>
        ${i.asset_tag ? `<div style="font-size:var(--fs-meta);color:var(--ink-3);letter-spacing:.05em;
          font-family:ui-monospace,Menlo,monospace;margin-top:1px">${esc(i.asset_tag)}</div>` : ''}
        ${i.reservations?.length ? `<div style="font-size:var(--fs-meta);color:var(--warn);font-weight:700;margin-top:2px">
          ${esc(t('eqUpcoming'))}: ${esc(fmtDate(i.reservations[0].start_at))}${
            i.reservations.length>1?` +${i.reservations.length-1}`:''}</div>` : ''}
      </div>
      <span class="pill ${i.available?'done':'wait'}">${esc(i.available?t('eqAvail'):t('eqOut'))}</span>
    </button>`;

  $x('#el').innerHTML =
    (mine.length  ? `<div class="section-title">${esc(t('eqMine'))}</div>${mine.map(card).join('')}` : '') +
    (myRes.length ? `<div class="section-title">${esc(t('eqMyResv'))}</div>${myRes.map(card).join('')}` : '') +
    `<div class="section-title">${esc(t('eqTitle'))}</div>${items.map(card).join('')}`;

  paintPhotos($('#el'));
  document.querySelectorAll('#el .rcard').forEach(b => b.onclick = () => {
    const i = items.find(x => x.resource_id === b.dataset.id); if(i) itemSheet(i);
  });
}

/* ข้อความในกรอบถ่ายรูปต้องตรงกับสิ่งที่กำลังถ่าย
   ของเดิมใช้ข้อความของพัสดุกับทุกที่ ตอนเพิ่มอุปกรณ์จึงขึ้นว่า "ถ่ายรูปกล่อง"
   ซึ่งคนอ่านแล้วงงว่ากล่องอะไร */
function photoField(id, label, current, opt){
  const o = opt || {};
  return `<div class="field"><label>${esc(label)}${o.optional ? '' : '<span class="req">*</span>'}</label>
    <label class="shot" id="${id}s" style="aspect-ratio:${o.ratio || '16/9'}${
      o.max ? ';max-height:' + o.max : ''}">
      <input type="file" accept="image/*" id="${id}" hidden>
      ${current ? `<img src="${current}" alt="" style="width:100%;height:100%;object-fit:cover">`
                : `<div class="ph">${IC.cam}<p>${esc(o.prompt || t('inShootAny'))}</p></div>`}
    </label></div>`;
}
function wirePhoto(id, store, onPick){
  const el = document.getElementById(id);
  const box = document.getElementById(id + 's');
  if(!el || !box) return;
  box.onclick = e => { if(e.target.tagName !== 'INPUT') el.click(); };
  el.onchange = async () => {
    const f = el.files[0]; if(!f) return;
    const im = await shrink2(f); store.v = im;
    box.innerHTML = `<img src="${im.full}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    box.onclick = () => el.click();
    if(typeof onPick === 'function') onPick(im);
  };
}

ROUTES['admin-staff'] = async () => {
  setTitle(t('admStaff'));
  $x('#main').innerHTML = `<div class="view">
    <div class="note info">${IC.info}<div>${esc(t('admStaffWhy'))}</div></div>
    <div class="card" style="margin-top:12px">
      <div class="field"><label>${esc(t('admStaffPaste'))}</label>
        <textarea id="sp" rows="10" spellcheck="false"
          placeholder="${esc(t('admStaffPh'))}"
          style="width:100%;resize:vertical;font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
      <div style="font-size:var(--fs-meta);color:var(--ink-3);line-height:1.6">${esc(t('admStaffCols'))}</div>
      <button class="btn soft" id="prev" style="margin-top:11px">${esc(t('admStaffPreview'))}</button>
    </div>
    <div id="pv"></div>
  </div>`;

  let rows = [];
  const HEAD = ['name_th','email','department','position','name_en','nickname'];

  $('#prev').onclick = () => {
    const raw = $('#sp').value.trim();
    if(!raw){ toast(t('admNeedTitle'),'bad'); return; }
    // แยกด้วย tab ก่อน (วางจาก Excel) ถ้าไม่มีจึงลองคอมมา
    rows = raw.split(/\n+/).map(line => {
      const cells = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
      const o = {}; HEAD.forEach((h, i) => o[h] = cells[i] || '');
      return o;
    }).filter(r => r.name_th || r.email);
    // ถ้าบรรทัดแรกเป็นหัวตาราง ตัดออก
    if(rows.length && !/@/.test(rows[0].email) && /mail|อีเมล/i.test(rows[0].email)) rows.shift();

    const bad = rows.filter(r => !/^[^@\s]+@kenan-asia\.org$/.test(r.email));
    $x('#pv').innerHTML = `
      <div class="section-title">${esc(t('admStaffFound')(rows.length))}</div>
      ${bad.length ? `<div class="note" style="border-color:var(--bad);margin-bottom:12px">${IC.info}
        <div><b>${esc(t('admStaffBad')(bad.length))}</b><br>${
          bad.slice(0,5).map(r => esc((r.name_th || '?') + ' — ' + (r.email || t('admStaffNoMail')))).join('<br>')}</div></div>` : ''}
      <div class="rows">${rows.slice(0,60).map(r => `
        <div class="row"><span class="av">${esc(String(r.name_th || '?').trim().charAt(0))}</span>
          <div class="body"><div class="t">${esc(r.name_th || '—')}</div>
            <div class="s">${esc([r.email, r.department, r.position].filter(Boolean).join(' · '))}</div></div>
          ${/^[^@\s]+@kenan-asia\.org$/.test(r.email)
            ? '<span class="pill done">✓</span>'
            : '<span class="pill" style="background:var(--bad-bg);color:var(--bad)">✕</span>'}
        </div>`).join('')}</div>
      ${rows.length > 60 ? `<div class="quiet">${esc(t('admStaffMore')(rows.length - 60))}</div>` : ''}
      <button class="btn primary" id="imp2" style="margin-top:14px">${
        esc(t('admStaffGo')(rows.length - bad.length))}</button>`;

    $('#imp2').onclick = async () => {
      const b = $('#imp2'); b.disabled = true; b.textContent = t('loading');
      try{
        const r = await apiRetry('importStaff', { rows: JSON.stringify(rows) }, 'POST');
        if(!r?.ok) throw 0;
        clearCache();
        $x('#pv').innerHTML = `<div class="note info" style="margin-top:14px">${IC.info}<div>
          <b>${esc(t('admStaffDone')(r.added, r.updated))}</b>
          ${(r.skipped || []).length ? '<br>' + esc(t('admStaffSkipped')) + '<br>' +
            r.skipped.map(x => esc(x)).join('<br>') : ''}</div></div>
          <button class="btn soft" id="toDir" style="margin-top:12px">${esc(t('mDir'))} →</button>`;
        $('#toDir').onclick = () => go('directory');
      }catch(e){ toast(t('netErr'),'bad'); b.disabled = false; b.textContent = t('admStaffGo')(rows.length); }
    };
  };
};

       if(!r?.ok){ $x('#rs').innerHTML = emptyState(IC.info, t('adminNo'), t('adminNoBody')); return; }
       items = r.items; drivers = r.drivers || []; }catch(e){}

  const grp = { room:[], equipment:[], vehicle:[] };
  items.forEach(i => (grp[i.kind] || (grp[i.kind] = [])).push(i));
  const sec = (k, label) => grp[k]?.length ? `
    <div class="section-title">${esc(label)}</div>
    ${grp[k].map(i => `
      <button class="rcard" data-id="${esc(i.resource_id)}" ${i.is_active?'':'style="opacity:.5"'}>
        ${phImg(i,'rphoto') || `<div class="rphoto">${
          k==='room'?IC.cal:k==='vehicle'?IC.car:k==='zoom'?IC.chat:IC.laptop}</div>`}
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:700">${esc(i.name_th)}</div>
          <div style="font-size:var(--fs-meta);color:var(--ink-3)">${esc([
            i.capacity ? t('rmSeats')(i.capacity) : '', i.category, i.storage_location
          ].filter(Boolean).join(' · '))}</div>
          ${k==='vehicle' ? `<div style="font-size:var(--fs-meta);font-weight:700;color:${
            i.default_driver ? 'var(--ok)' : 'var(--warn)'};margin-top:2px">${
            esc(i.default_driver ? t('carDriver') + ' ' + i.driver_name : t('admResNoDriver'))}</div>` : ''}
        </div>
        ${i.is_active ? `<span class="go">${IC.chev}</span>`
                      : `<span class="pill" style="background:var(--neutral);color:var(--ink-3)">${esc(t('admResInactive'))}</span>`}
      </button>`).join('')}` : '';
  $x('#rs').innerHTML = sec('room', t('admResRoom')) + sec('zoom', t('admResZoom')) +
                        sec('equipment', t('admResEq')) + sec('vehicle', t('admResCar'));
  paintPhotos($('#rs'));
  document.querySelectorAll('#rs .rcard').forEach(b =>
    b.onclick = () => resEdit(items.find(x => x.resource_id === b.dataset.id)));

  /* ── ฟอร์มเพิ่ม/แก้รายการ ───────────────────────────────────────
     ของเดิมเป็นแถบผอมยาว ช่องเรียงต่อกันสิบกว่าช่องโดยไม่บอกอะไรเลย
     คนกรอกจึงเดาไม่ออกว่าช่องไหนสำคัญ และไม่รู้ว่าต้องใส่อะไรลงไป
     ที่แก้: แบ่งเป็นหมวดพร้อมคำอธิบายว่าหมวดนั้นมีไว้ทำไม
             ใส่ตัวอย่างจริงในทุกช่อง จอกว้างวางสองคอลัมน์
             และของที่ต้องดูสเปค ให้ถ่ายรูปป้ายแล้วให้ AI แกะให้                */
  function resEdit(it){
    let kind = it ? it.kind : 'equipment';
    const guide = { equipment:t('admResGuideEq'), room:t('admResGuideRoom'),
                    vehicle:t('admResGuideCar'), zoom:t('admResGuideZoom') };

    sheet(`<h3>${esc(it ? it.name_th : t('admResAdd'))}</h3>

      <div class="fsec"><h4>${esc(t('admResSecWhat'))}</h4>
        <p class="why" id="gWhy">${esc(guide[kind] || '')}</p></div>
      ${it ? '' : `<div class="field"><label>${esc(t('admResKind'))}</label>
        <select id="rk"><option value="equipment">${esc(t('admResEq'))}</option>
          <option value="room">${esc(t('admResRoom'))}</option>
          <option value="vehicle">${esc(t('admResCar'))}</option>
          <option value="zoom">${esc(t('admResZoom'))}</option></select></div>`}
      <div class="fgrid">
        <div class="field full"><label>${esc(t('admResName'))}<span class="req">*</span></label>
          <input id="rn2" value="${esc(it?.name_th || '')}" placeholder="กล้อง Canon R6 ตัวที่ 1"></div>
        <div class="field"><label>${esc(t('admResCat'))}</label>
          <input id="rc" value="${esc(it?.category || '')}" placeholder="${esc(t('admResCatPh') || 'กล้อง · ไมค์ · จอภาพ')}"></div>
        <div class="field" id="capF" ${['room','vehicle','zoom'].includes(kind) ? '' : 'hidden'}>
          <label id="capL">${esc(kind === 'vehicle' ? t('admResSeatsCar')
            : kind === 'zoom' ? t('admResZoomCap') : t('admResCap'))}</label>
          <input id="rcap" inputmode="numeric" value="${esc(it?.capacity || '')}" placeholder="8"></div>
      </div>

      <div id="eqSec" ${kind === 'equipment' ? '' : 'hidden'}>
        <div class="fsec"><h4>${esc(t('admResSecId'))}</h4>
          <p class="why">${esc(t('admResAiHint'))}</p></div>
        ${photoField('rai', t('admResAi'), null,
          { optional:true, ratio:'4/3', max:'260px', prompt:t('admResAi') })}
        <button class="btn soft" id="aiGo" type="button" disabled>${esc(t('admResAiGo'))}</button>
        <div class="fhint" id="aiMsg" style="margin-top:8px"></div>
        <div class="fgrid" style="margin-top:12px">
          <div class="field"><label>${esc(t('admResBrand'))}</label>
            <input id="rbrand" value="${esc(it?.brand || '')}" placeholder="${esc(t('admResBrandPh'))}"></div>
          <div class="field"><label>${esc(t('admResModel'))}</label>
            <input id="rmodel" value="${esc(it?.model || '')}" placeholder="${esc(t('admResModelPh'))}"></div>
          <div class="field full"><label>${esc(t('admResSpec'))}</label>
            <input id="rspec" value="${esc(it?.spec || '')}" placeholder="${esc(t('admResSpecPh'))}"></div>
          <div class="field"><label>${esc(t('admResSerial'))}</label>
            <input id="rser" value="${esc(it?.serial || '')}" placeholder="${esc(t('admResSerialPh'))}"></div>
          <div class="field"><label>${esc(t('admResYear'))}</label>
            <input id="ryear" inputmode="numeric" value="${esc(it?.purchase_year || '')}"
              placeholder="${esc(t('admResYearPh'))}"></div>
        </div>
        <div class="field"><label>${esc(t('admResTag'))}</label>
          <input value="${esc(it?.asset_tag || '')}" disabled
            style="font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em;opacity:.75"
            placeholder="${esc(t('admResTagAuto'))}"></div>
        ${it?.asset_tag ? `<div class="qrbox">${QR.svg(itemUrl(it.asset_tag), 132, 1)}
          <div class="tg">${esc(it.asset_tag)}</div></div>` : ''}
      </div>

      <div id="carSec" ${kind === 'vehicle' ? '' : 'hidden'}>
        <div class="fsec"><h4>${esc(t('admResSecCar'))}</h4></div>
        <div class="fgrid">
          <div class="field"><label>${esc(t('admResPlate'))}</label>
            <input id="rplate" value="${esc(it?.plate || '')}" placeholder="1กก-1234 กรุงเทพมหานคร"></div>
          <div class="field"><label>${esc(t('admResColor'))}</label>
            <input id="rcolor" value="${esc(it?.color || '')}" placeholder="ขาว · เทา · ดำ"></div>
          <div class="field"><label>${esc(t('admResFuel'))}</label>
            <input id="rfuel" value="${esc(it?.fuel_type || '')}" placeholder="ดีเซล · เบนซิน · ไฮบริด · ไฟฟ้า"></div>
          <div class="field"><label>${esc(t('admResCo2'))}</label>
            <input id="rco2" inputmode="decimal" value="${esc(it?.co2_per_km || '')}" placeholder="0.21"></div>
        </div>
        <div class="fhint">${esc(t('admResCo2Hint'))}</div>
        <div class="field"><label>${esc(t('admResDriver'))}</label>
          <select id="rdrv"><option value="">${esc(t('admResNoDriver'))}</option>${
            drivers.map(d => `<option value="${esc(d.id)}" ${
              d.id === it?.default_driver ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select></div>
        <div class="fhint">${esc(drivers.length ? t('admResDriverHint') : t('admResNoDriverYet'))}</div>
      </div>

      <div class="fsec"><h4>${esc(t('admResSecWhere'))}</h4></div>
      <div class="field" id="locF" ${kind === 'equipment' ? '' : 'hidden'}>
        <label>${esc(t('admResLoc'))}</label>
        <input id="rloc" value="${esc(it?.storage_location || '')}" placeholder="ตู้ AV ชั้น 2 ช่อง 1"></div>
      <div class="field"><label>${esc(t('admResNote'))}</label>
        <input id="rnt" value="${esc(it?.note || '')}" placeholder="แบต 2 ก้อน · สายชาร์จ"></div>

      <div class="fsec"><h4>${esc(t('admResSecPic'))}</h4>
        <p class="why">${esc(t('admResPhotoWhy'))}</p></div>
      ${photoField('rph', t('admResPhoto'), it?.thumb || null,
        { optional:true, max:'260px', prompt:t('admResPhoto') })}

      <button class="btn primary" id="rsv2">${esc(t('admResSave'))}</button>
      ${it ? `<button class="btn ghost" id="rtog">${esc(it.is_active ? t('admResOff') : t('admResOn'))}</button>` : ''}
      <button class="btn ghost" id="rx3">${esc(t('cancel'))}</button>`, { wide:true });

    const img = { v:null }; wirePhoto('rph', img);
    const ai  = { v:null };
    wirePhoto('rai', ai, () => { $('#aiGo').disabled = false; $x('#aiMsg').textContent = ''; });

    /* ให้ AI อ่านป้ายสเปค แล้วเติมช่องให้ — คนแค่ตรวจ ไม่ต้องพิมพ์ตาม
       เติมเฉพาะช่องที่ยังว่าง จะได้ไม่ไปทับสิ่งที่คนตั้งใจพิมพ์เองไว้แล้ว */
    $('#aiGo').onclick = async () => {
      if(!ai.v) return;
      const b = $('#aiGo'); b.disabled = true; b.textContent = t('admResAiWork');
      try{
        const r = await apiRetry('aiSpec', { photo:ai.v.full }, 'POST');
        if(!r?.ok){
          $x('#aiMsg').textContent = r?.error === 'NO_KEY' ? t('admResAiNoKey') : t('admResAiFail');
          $x('#aiMsg').style.color = 'var(--warn)';
        }else{
          const sp = r.spec || {};
          const put = (id, v) => { const el = $('#' + id); if(el && v && !el.value.trim()) el.value = v; };
          put('rbrand', sp.brand); put('rmodel', sp.model); put('rser', sp.serial);
          put('rspec', sp.spec);   put('rc', sp.category);  put('rn2', sp.name_th);
          const low = (Number(sp.confidence) || 0) < 0.6;
          $x('#aiMsg').textContent = low ? t('admResAiLow') : t('admResAiOk');
          $x('#aiMsg').style.color = low ? 'var(--warn)' : 'var(--ok)';
        }
      }catch(e){
        $x('#aiMsg').textContent = t('admResAiFail'); $x('#aiMsg').style.color = 'var(--warn)';
      }
      b.textContent = t('admResAiGo'); b.disabled = false;
    };

    if($('#rk')) $('#rk').onchange = () => {
      kind = $('#rk').value;
      $x('#gWhy').textContent = guide[kind] || '';
      $('#capF').hidden  = (kind === 'equipment');
      $x('#capL').textContent = kind === 'vehicle' ? t('admResSeatsCar')
        : kind === 'zoom' ? t('admResZoomCap') : t('admResCap');
      $('#locF').hidden  = (kind !== 'equipment');
      $('#eqSec').hidden = (kind !== 'equipment');
      $('#carSec').hidden= (kind !== 'vehicle');
    };

    $('#rx3').onclick = closeSheet;
    const save = extra => async () => {
      const name = $('#rn2').value.trim();
      if(!name){ toast(t('admNeedTitle'),'bad'); return; }
      const b = $('#rsv2'); b.disabled = true;
      try{
        await apiRetry('saveResource', Object.assign({
          resource_id: it?.resource_id || '',
          kind: it ? it.kind : kind,
          name_th:name, category:$('#rc').value.trim(),
          capacity:$('#rcap')?.value.trim() || '', storage_location:$('#rloc')?.value.trim() || '',
          note:$('#rnt').value.trim(), default_driver:$('#rdrv')?.value ?? '',
          plate:$('#rplate')?.value.trim() ?? '', color:$('#rcolor')?.value.trim() ?? '',
          fuel_type:$('#rfuel')?.value.trim() ?? '', co2_per_km:$('#rco2')?.value.trim() ?? '',
          brand:$('#rbrand')?.value.trim() ?? '', model:$('#rmodel')?.value.trim() ?? '',
          serial:$('#rser')?.value.trim() ?? '', spec:$('#rspec')?.value.trim() ?? '',
          purchase_year:$('#ryear')?.value.trim() ?? '',
          photo:img.v?.full || '', thumb:img.v?.thumb || '', card:img.v?.card || ''
        }, extra || {}), 'POST');
        closeSheet(); clearCache(); toast(t('admResSaved'),'ok'); go('admin-res', {}, true);
      }catch(e){ toast(t('netErr'),'bad'); b.disabled = false; }
    };
    $('#rsv2').onclick = save(null);
    if($('#rtog')) $('#rtog').onclick = save({ is_active: it.is_active ? 'false' : 'true' });
  }
};


/* ── จองรถ ──────────────────────────────────────────────────────
   หลักคิด 3 ข้อที่ต่างจากจองห้อง
   1) เวลาที่จอง = ออกจากออฟฟิศ → กลับถึงออฟฟิศ ไม่ใช่เวลาประชุม
   2) ต้องผูกโครงการเสมอ ไม่งั้นค่าน้ำมันถูกหารเฉลี่ยลงทุกโครงการเหมือนเดิม
   3) คนขับเป็นคนกดออก-กลับ เพราะทุกเที่ยวมีคนขับอยู่ด้วยเสมอ
      เที่ยวที่ไม่ได้จองจึงถูกบันทึกได้โดยไม่ต้องมีใครไปฟ้องใคร               */

const isDriverNow = () => /(^|,)\s*driver\s*(,|$)/.test(String(S.me?.roles || ''));
const carStName   = k => (t('carSt') || {})[k] || k;
const stopsOf     = tr => { try{ return Array.isArray(tr.stops) ? tr.stops : []; }catch(e){ return []; } };

ROUTES.cars = async (params = {}) => {
  setTitle(t('carTitle'));
  const today = new Date();
  const sel   = params.date || dayKey(today);
  const mode  = params.mode || 'day';
  const dchips = Array.from({length:14}, (_,i) => { const d = new Date(today); d.setDate(today.getDate()+i); return d; });
  const wdays  = Array.from({length:7},  (_,i) => { const d = new Date(sel + 'T00:00:00'); d.setDate(d.getDate()+i); return d; });

  $x('#main').innerHTML = `<div class="view">
    <div id="dbn"></div>
    <div class="seg2" id="sg">
      <button class="${mode==='day'?'on':''}" data-m="day">${esc(t('rmDay'))}</button>
      <button class="${mode==='week'?'on':''}" data-m="week">${esc(t('rmWeek'))}</button>
      <button class="${mode==='month'?'on':''}" data-m="month">${esc(t('rmMonth'))}</button>
    </div>
    <div id="ctl"></div>
    <div class="bkwrap">
      <div><div id="gr">${skeleton(3)}</div></div>
      <div class="bkside">
        <div class="section-title">${esc(t('carPickVeh'))}</div>
        <div id="vl"></div>
      </div>
    </div>
    <div class="sticky-cta"><button class="btn primary" id="bk">＋ ${esc(t('carBook'))}</button></div>
  </div>`;
  $('#bk').onclick = () => go('car-new', { date:sel });
  document.querySelectorAll('#sg button').forEach(b =>
    b.onclick = () => go('cars', { date:sel, mode:b.dataset.m }, true));

  if(mode === 'month'){
    const ym = params.ym || ymOf(sel);
    const w  = monthWindow(ym);
    $x('#ctl').innerHTML = ''; $x('#dbn').innerHTML = '';
    let mr = null;
    try{ mr = await apiRetry('getCarDay', { date:w.from, days:w.days }, 'GET'); }catch(e){}
    if(!mr?.ok){ $x('#gr').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }
    const vname = {};
    (mr.vehicles || []).forEach(v => { vname[v.resource_id] = v.name_th; });
    const meId = String(S.me?.kenan_user_id || '');
    const g = monthGrid({
      ym, sel,
      events: mr.trips.map(x => ({
        day: dayKey(x.start_at),
        label: `${hhmm(x.start_at)} ${vname[x.resource_id] || ''}`.trim(),
        tone: x.status === 'in_use' ? 'warn'
            : (String(x.requester_id) === meId || String(x.driver_id) === meId) ? 'mine' : ''
      })),
      legend: [{ tone:'mine', label:t('mnMine') }, { tone:'warn', label:t('mnOut') },
               { tone:'', label:t('mnOther') }],
      onDay: d => go('cars', { date:d, mode:'day' }, true),
      onMonth: (nym, nd) => go('cars', { date:nd || sel, mode:'month', ym:nym }, true)
    });
    $x('#gr').innerHTML = g.html +
      `<p style="font-size:var(--fs-meta);color:var(--ink-3);margin:11px 0 0">${esc(t('mnTapDay'))}</p>`;
    g.wire($('#gr'));
    document.querySelector('.bkside')?.remove();
    return;
  }

  // ถ้าเข้ามาจาก Rich Menu ข้อมูลวันนี้ถูกแนบมากับ bootstrap แล้ว ไม่ต้องถามซ้ำ
  let r = (mode === 'day' && sel === dayKey(today)) ? takePre('car') : null;
  if(!r){ try{ r = await apiRetry('getCarDay', { date:sel, days: mode==='week' ? 7 : 1 }, 'GET'); }catch(e){} }
  if(!r?.ok){ $x('#gr').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }

  if(!r.vehicles.length){
    $x('#gr').innerHTML = emptyState(IC.car, t('carEmpty'), t('carEmptyBody'));
    $x('#vl').innerHTML = ''; return;
  }

  const me   = String(S.me?.kenan_user_id || '');
  let   veh0 = params.veh || r.vehicles[0]?.resource_id;

  /* คนขับเห็นทางเข้างานของตัวเองก่อนอย่างอื่น ไม่ต้องไปหาในเมนู */
  if(r.isDriver){
    const mine = r.trips.filter(x => String(x.driver_id) === me &&
                                     ['assigned','requested','in_use'].includes(x.status));
    $x('#dbn').innerHTML = `<button class="row" id="dgo" style="border:1.5px solid var(--primary);
        border-radius:14px;background:#EEF3FF;margin-bottom:12px;width:100%">
        <div class="thumb" style="background:#fff;color:var(--primary)">${IC.car}</div>
        <div class="body"><div class="t">${esc(t('drvOpen'))}</div>
          <div class="s">${esc(mine.length ? t('drvJobs')(mine.length) : t('drvNone'))}</div></div>
        <span class="go">${IC.chev}</span></button>`;
    $('#dgo').onclick = () => go('driver');
  }

  /* ── แถบเลือกวัน / เลือกคัน */
  $x('#ctl').innerHTML = mode === 'day'
    ? `<div class="chips" id="dch" style="margin-bottom:11px">${dchips.slice(0,10).map(d => `
        <button class="chip ${dayKey(d)===sel?'on':''}" data-d="${dayKey(d)}">
          ${d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'})}
          <span class="d">${d.getDate()}</span></button>`).join('')}</div>`
    : `<div class="chips" id="vch" style="margin-bottom:11px">${r.vehicles.map(v => `
        <button class="chip ${v.resource_id===veh0?'on':''}" data-v="${esc(v.resource_id)}">
          ${esc(v.name_th)}</button>`).join('')}</div>`;
  if($('#dch')) document.querySelectorAll('#dch .chip').forEach(c =>
    c.onclick = () => go('cars', { date:c.dataset.d, mode }, true));
  if($('#vch')) document.querySelectorAll('#vch .chip').forEach(c =>
    c.onclick = () => go('cars', { date:sel, mode, veh:c.dataset.v }, true));

  /* ── ตาราง 08:00–18:00 */
  const cols = mode === 'day'
    ? r.vehicles.map(v => ({ key:v.resource_id, n:v.name_th,
        c: v.driver_name ? firstName(v.driver_name) : (v.capacity ? t('rmSeats')(v.capacity) : '') }))
    : wdays.map(d => ({ key:dayKey(d),
        n:d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'}), c:String(d.getDate()) }));

  const evFor = col => r.trips.filter(x => mode === 'day'
    ? x.resource_id === col.key
    : (x.resource_id === veh0 && dayKey(x.start_at) === col.key));

  const nowTop = (() => {
    const n = new Date();
    if(mode === 'day' && dayKey(n) !== sel) return null;
    const m = (n.getHours()-H0)*60 + n.getMinutes();
    return (m < 0 || m > (H1-H0)*60) ? null : (m/60)*HPX;
  })();

  $x('#gr').innerHTML = `<div class="gridwrap"><div class="gridscroll"><div style="min-width:${34+cols.length*84}px">
    <div class="ghead"><div class="corner"></div>${cols.map(c => `
      <div class="hcell"><div class="n">${esc(c.n)}</div><div class="c">${esc(c.c)}</div></div>`).join('')}</div>
    <div class="gbody">
      <div class="ghours">${Array.from({length:H1-H0+1},(_,i)=>`<span>${String(H0+i).padStart(2,'0')}</span>`).join('')}</div>
      ${cols.map(c => `<div class="gcol" data-k="${esc(c.key)}">
        ${Array.from({length:H1-H0},(_,i)=>`<div class="hr" data-h="${H0+i}"></div>`).join('')}
        ${evFor(c).map(x => {
          const s = x.started_at || x.start_at, e = x.finished_at || x.end_at;
          const top = Math.max(0,(minsFrom8(s)/60)*HPX);
          const hgt = Math.max(20,((minsFrom8(e)-minsFrom8(s))/60)*HPX-2);
          const cls = x.unbooked ? 'unb' : (x.status === 'in_use' ? 'live'
                    : (String(x.requester_id) === me ? 'mine' : ''));
          return `<button class="gev ${cls}" data-b="${esc(x.record_id)}" style="top:${top}px;height:${hgt}px">
            <div class="t">${esc(durLabel(s, e))}</div>
            <div class="w">${esc(firstName(x.who) || firstName(x.driver))}</div>
            ${hgt > 40 && x.project_code ? `<div class="p">${esc(x.project_code)}</div>` : ''}</button>`;
        }).join('')}
      </div>`).join('')}
      ${nowTop!==null?`<div class="gnow" style="top:${nowTop}px"></div>`:''}
    </div>
  </div></div></div>
  <div class="carleg">
    <span><i style="background:var(--ok)"></i>${esc(t('carLegMine'))}</span>
    <span><i style="background:var(--warn)"></i>${esc(carStName('in_use'))}</span>
    <span><i style="background:var(--bad)"></i>${esc(t('carUnbooked'))}</span>
  </div>

/** ตัวเลือกแบบพิมพ์ค้นหาได้ — ใช้กับรายการที่ยาวเกินกว่าจะเลื่อนหา
    ที่คีนันมีโครงการ 20+ โครงการ dropdown ธรรมดาจะหาไม่เจอจริงๆ */
function pickFromList({ title, items, label, sub, current, search }){
  return new Promise(resolve => {
    sheet(`<h3>${esc(title)}</h3>
      <input id="plq" placeholder="${esc(search || t('pkSearch'))}" autocomplete="off">
      <div id="pll"></div>
      <button class="btn ghost" id="plx" style="margin-top:10px">${esc(t('cancel'))}</button>`);
    const norm = x => String(x || '').toLowerCase().replace(/\s/g, '');
    const paint = kw => {
      const k = norm(kw);
      const hits = !k ? items : items.filter(i =>
        norm(label(i)).includes(k) || norm(sub ? sub(i) : '').includes(k));
      $x('#pll').innerHTML = hits.length ? hits.map((i, n) => `
        <button class="pk-row" data-i="${n}">

      document.querySelectorAll('#pll .pk-row').forEach(b => b.onclick = () => {
        closeSheet(); resolve(hits[Number(b.dataset.i)]);

    };
    paint('');
    const inp = $('#plq');
    inp.oninput = () => paint(inp.value);
    $('#plx').onclick = () => { closeSheet(); resolve(null); };
    setTimeout(() => inp.focus(), 260);
