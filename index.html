<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0033CC">
<title>Kenan ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   DESIGN TOKENS — ตรงกับ Kenan ONE Vision ใน Stitch
   ───────────────────────────────────────────────────────────── */
:root{
  /* ════ สีตาม Brand Guideline ของมูลนิธิ (หน้า COLORS) ════
     สีหลักคือ Celadon Blue #0076A9 ไม่ใช่น้ำเงินสดที่ใช้อยู่เดิม
     ของเดิมเป็นสีที่ผมหยิบมาเอง ไม่เคยตรงกับแบรนด์จริงเลยสักครั้ง */
  --brand:#0076A9;            /* Celadon Blue — สีหลัก */
  --brand-700:#005C85;        /* เข้มขึ้น สำหรับปุ่มตอนกด */
  --brand-300:#A7D9E6;        /* Non Photo Blue — สีรอง */
  --brand-50:#EAF4F9;         /* พื้นอ่อนของสีหลัก */
  --grey:#4D4D4D;             /* Davys Grey — สีรอง */

  /* ชื่อเดิมที่โค้ดเรียกใช้อยู่หลายร้อยจุด ชี้มาที่สีแบรนด์จริง
     ทำแบบนี้เพื่อไม่ต้องไล่แก้ทุกจุดในวันเดียว และไม่มีจุดไหนตกหล่น */
  --primary:var(--brand);
  --primary-dark:var(--brand-700);
  --secondary:#0089C4;
  --neutral:#E7EDF1;

  /* ไล่ระดับเทาสร้างจาก Davys Grey ของแบรนด์ ไม่ใช่เทาสำเร็จรูปของ framework */
  --ink:#22282B;
  --ink-2:#4D4D4D;
  --ink-3:#6F7A80;
  --bg:#F4F7F9;
  --surface:#FFFFFF;
  --line:#DCE5EA;

  /* สีสถานะแยกจากสีแบรนด์ชัดเจน เพราะมันสื่อความหมาย ไม่ใช่สื่อตัวตน */
  --ok:#0F7A5A;      --ok-bg:#E6F4EF;
  --warn:#B26A00;    --warn-bg:#FDF3E4;
  --danger:#C0392B;  --danger-bg:#FBECEA;
  --navy:#083A52;    /* น้ำเงินเข้มของเมนูข้าง — โทนเดียวกับ Celadon */
  --bad:#C0392B;  --bad-bg:#FBECEA;  --bad-line:#F2CFCA;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --shadow:0 1px 2px rgba(8,58,82,.06),0 4px 16px rgba(8,58,82,.06);
  --shadow-lg:0 8px 32px rgba(8,58,82,.16);

  --topbar-h:56px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);

  /* ════ ตัวอักษรตาม CI (แถว WEBFONT / ONLINE / DESIGN) ════
     Montserrat หัวเรื่อง · Open Sans เนื้อความลาติน · Prompt ภาษาไทย
     เรียง Open Sans ก่อน Prompt เพื่อให้ลาตินได้ Open Sans
     ส่วนอักษรไทยที่ Open Sans ไม่มี เบราว์เซอร์จะหยิบ Prompt มาให้เอง */
  --font:'Open Sans','Prompt',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-head:'Montserrat','Prompt',-apple-system,'Segoe UI',sans-serif;

  /* ════ ขนาดตัวอักษรขั้นต่ำ ════
     ตั้งเป็นตัวแปรเพื่อให้ปรับทั้งระบบได้ที่เดียว และกันไม่ให้ใครใส่เลขเล็กกว่านี้
     เหตุผล: บนจอคอมอาจพออ่านไหว แต่ใน LINE WebView บนมือถือกับภาษาไทย เล็กเกินไป */
  --fs-h1:22px;      /* หัวหน้าจอ */
  --fs-h2:17px;      /* หัวข้อส่วน */
  --fs-body:15px;    /* เนื้อความหลัก */
  --fs-cta:16px;     /* ปุ่มหลัก */
  --fs-sec:13px;     /* ข้อความรอง */
  --fs-meta:12px;    /* ข้อมูลประกอบที่ไม่สำคัญมาก — ต่ำกว่านี้ไม่มี */
  --lh:1.6;          /* ระยะบรรทัดของภาษาไทย */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
[hidden]{display:none!important}

/* ── App shell ─────────────────────────────────────────────── */
#app{min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--topbar-h);flex:0 0 auto;
  display:flex;align-items:center;gap:4px;
  padding:0 6px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .icon-btn{
  width:40px;height:40px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
}
.topbar .icon-btn:active{background:var(--neutral)}
.topbar h1{
  flex:1;min-width:0;margin:0;padding:0 4px;
  font-size:16px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-left:8px}
.brand .mark{
  width:30px;height:30px;flex:0 0 auto;
  background:none;border-radius:0;object-fit:contain;display:block;
}
.brand .txt{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bell{position:relative}
.bell .dot{
  position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--danger);color:#fff;
  font-size:var(--fs-meta);font-weight:700;line-height:17px;text-align:center;
  border:2px solid var(--surface);
}

main{flex:1 1 auto;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 24px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Bottom nav ────────────────────────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:var(--fs-meta);font-weight:600;
}
.nav button.on{color:var(--primary)}
.nav svg{width:23px;height:23px}
.nav button{position:relative}
.nav .ndot{position:absolute;top:6px;left:50%;margin-left:5px;min-width:16px;height:16px;
  padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;
  font-size:var(--fs-meta);font-weight:800;line-height:16px;text-align:center}

/* ── FAB: ปุ่มบันทึกพัสดุเข้า — เข้าถึงได้ 1 แตะจากทุกหน้า ──── */
.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  height:52px;padding:0 20px 0 16px;border-radius:26px;
  display:flex;align-items:center;gap:8px;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:14px;
  box-shadow:0 6px 20px rgba(0,51,204,.36);
}
.fab:active{transform:scale(.97)}
.fab svg{width:22px;height:22px}

/* ── Cards & layout ────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:22px 0 10px;letter-spacing:.01em}
.section-title:first-child{margin-top:0}
.section-title .en{font-weight:500;color:var(--ink-3);font-size:var(--fs-meta);margin-left:6px}

.greet{margin:0 0 18px}
.greet h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.greet p{margin:3px 0 0;color:var(--ink-3);font-size:13px}

/* ── หน้าแรก: ทักทาย · สิ่งที่ค้าง · ตารางวันนี้ ─────────────── */
.hgreet{margin-bottom:20px}
.hdate{font-size:var(--fs-meta);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--primary);margin-bottom:6px}
.hgreet h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.hgreet p{margin:5px 0 0;font-size:13.5px;color:var(--ink-3)}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:22px}
.todoc{display:flex;align-items:baseline;gap:9px;padding:14px 15px;border-radius:var(--r);
  background:#EEF3FF;border:1px solid #D6E1FF;text-align:left}
.todoc .n{font-size:25px;font-weight:800;line-height:1;color:var(--primary)}
.todoc .l{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.3}
.todoc.warn{background:var(--warn-bg);border-color:#FDE49A}
.todoc.warn .n{color:var(--warn)}
.todoc.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.todoc.bad .n{color:var(--bad)}
.quiet{font-size:13px;color:var(--ink-3);padding:16px 2px}
.hsplit{display:block}
@media(min-width:900px){
  .hsplit{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:34px;align-items:start}
  .hsplit .section-title:first-child{margin-top:0}
  .hgreet h2{font-size:30px}
}

/* ── Module tiles ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  position:relative;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 14px;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .12s,box-shadow .12s;
}
.tile:active{transform:scale(.975);box-shadow:var(--shadow)}
.tile .ic{
  width:38px;height:38px;border-radius:11px;
  background:#EEF3FF;color:var(--primary);
  display:grid;place-items:center;
}
.tile .ic svg{width:21px;height:21px}
.tile .nm{font-size:14px;font-weight:700;line-height:1.3}
.tile .en{font-size:var(--fs-meta);color:var(--ink-3);font-weight:500;margin-top:1px}
.tile .badge.soonb{background:var(--neutral);color:var(--ink-3)}
.tile .badge{
  position:absolute;top:11px;right:11px;
  padding:3px 8px;border-radius:99px;
  font-size:var(--fs-meta);font-weight:700;
  background:var(--primary);color:#fff;
}
.tile .badge.warn{background:var(--warn)}
.tile.soon{opacity:.5}
.tile.soon .badge{background:var(--neutral);color:var(--ink-3)}
.tile.sos .ic{background:#FEF2F2;color:var(--danger)}

/* ── List rows ─────────────────────────────────────────────── */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--bg)}
.row .thumb{
  width:48px;height:48px;border-radius:10px;flex:0 0 auto;
  background:var(--neutral);object-fit:cover;
  display:grid;place-items:center;color:var(--ink-3)
}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{color:var(--ink-3);flex:0 0 auto}
.row .go svg{width:18px;height:18px;display:block}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:var(--fs-meta);font-weight:700}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.new{background:#EEF3FF;color:var(--primary)}

/* ── Forms ─────────────────────────────────────────────────── */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label .en{font-weight:400;color:var(--ink-3);font-size:var(--fs-meta);margin-left:5px}
.field label .req{color:var(--danger);margin-left:3px}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:16px; /* 16px กัน iOS zoom */
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,51,204,.1)
}
.field .hint{font-size:var(--fs-meta);color:var(--ink-3);margin-top:5px}
.field .err{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}

.btn{
  width:100%;padding:15px;border-radius:var(--r);
  font-size:var(--fs-cta);font-weight:700;text-align:center;
  min-height:48px;                       /* เป้าการกดขั้นต่ำสำหรับนิ้วโป้ง */
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active:not(:disabled){background:var(--primary-dark)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#EEF3FF;color:var(--primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn + .btn{margin-top:9px}
.btn svg{width:20px;height:20px}

/* ปุ่มหลักติดขอบล่าง — อยู่ในระยะนิ้วโป้งเสมอ */
.sticky-cta{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  margin-top:20px;z-index:20;
}

/* ── Camera capture ────────────────────────────────────────── */
.shot{
  position:relative;width:100%;aspect-ratio:4/3;
  border-radius:var(--r-lg);overflow:hidden;
  background:var(--ink);display:grid;place-items:center;
}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .ph{color:#fff;text-align:center;opacity:.85;padding:20px}
.shot .ph svg{width:44px;height:44px;margin-bottom:8px}
.shot .ph p{margin:0;font-size:13px;font-weight:600}
.shot .retake{
  position:absolute;right:10px;bottom:10px;
  padding:8px 14px;border-radius:99px;
  background:rgba(15,23,42,.72);color:#fff;
  font-size:var(--fs-sec);font-weight:700;backdrop-filter:blur(8px);
}

/* ── Skeleton — ไม่เคยแสดงหน้าขาว ───────────────────────────── */
.sk{background:linear-gradient(90deg,#E9ECF1 25%,#F2F4F7 50%,#E9ECF1 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r-sm)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{height:74px;margin-bottom:10px;border-radius:var(--r-lg)}

/* ── Empty state ───────────────────────────────────────────── */
.empty{text-align:center;padding:44px 24px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;margin-bottom:12px;opacity:.5}
.empty h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink-2)}
.empty p{margin:0;font-size:13px;line-height:1.6}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;left:16px;right:16px;z-index:80;
  bottom:calc(var(--nav-h) + var(--safe-b) + 78px);
  padding:14px 16px;border-radius:var(--r);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);
  transform:translateY(20px);opacity:0;pointer-events:none;
  transition:.22s;
}
#toast.on{transform:none;opacity:1}
#toast.ok{background:var(--ok)}
#toast.bad{background:var(--danger)}

/* ── Bottom sheet — ยืนยันเร็วๆ โดยไม่ต้องเปลี่ยนหน้า ────────── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.42);opacity:0;transition:.22s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 16px calc(20px + var(--safe-b));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:86dvh;overflow:auto;
}
#sheet.on{transform:none}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
#sheet h3{margin:0 0 4px;font-size:17px;font-weight:700}
#sheet .sub{margin:0 0 16px;font-size:13px;color:var(--ink-3)}

/* ── ดูรูปเต็มจอ + ซูม (ต้องอ่านจ่าหน้าซองให้ออก) ─────────────── */
#lb{position:fixed;inset:0;z-index:90;background:#0B0F17;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;color:#fff;flex:0 0 auto}
#lb .top b{font-size:14px;font-weight:700}
#lb .x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);
  display:grid;place-items:center;color:#fff;font-size:20px;line-height:1}
#lbStage{flex:1;overflow:hidden;position:relative;touch-action:none;display:grid;place-items:center}
#lbImg{max-width:100%;max-height:100%;transform-origin:center center;
  transition:transform .16s ease-out;will-change:transform;user-select:none;-webkit-user-drag:none}
#lb .zoom{display:flex;gap:10px;justify-content:center;align-items:center;
  padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 16px);flex:0 0 auto}
#lb .zb{min-width:56px;height:46px;padding:0 16px;border-radius:23px;background:rgba(255,255,255,.16);
  color:#fff;font-size:19px;font-weight:800;display:grid;place-items:center}
#lb .zb.wide{font-size:13.5px;font-weight:700}
#lb .hint{color:rgba(255,255,255,.55);font-size:var(--fs-meta);text-align:center;padding-bottom:4px}

/* รูปใหญ่ใน sheet ยืนยันรับของ */
.sheet-photo{width:100%;border-radius:12px;background:var(--neutral);display:block;
  aspect-ratio:4/3;object-fit:cover;margin-bottom:6px}
.sheet-photo-hint{font-size:var(--fs-meta);color:var(--primary);font-weight:700;text-align:center;margin:0 0 14px}

/* ── ตัวเลือกผู้รับแบบค้นหา (40+ คน เลื่อนหาไม่ไหว) ────────────── */
.picker-btn{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);text-align:left;display:flex;align-items:center;gap:10px}
.picker-btn .nm{flex:1;min-width:0;font-size:15px}
.picker-btn .nm.ph{color:var(--ink-3)}
.picker-btn .nm small{display:block;font-size:var(--fs-meta);color:var(--ink-3);font-weight:500}
.picker-btn .ch{color:var(--ink-3);font-size:12px}
#pkSearch{width:100%;padding:13px 14px;border:1.5px solid var(--primary);border-radius:var(--r);
  font-size:16px;margin-bottom:10px;background:var(--surface)}
#pkList{max-height:46dvh;overflow:auto;margin:0 -4px}
.pk-row{width:100%;display:flex;align-items:center;gap:11px;padding:11px 10px;
  border-radius:10px;text-align:left}
.pk-row:active{background:var(--bg)}
.pk-row .av{width:34px;height:34px;border-radius:50%;background:#EEF3FF;color:var(--primary);
  font-size:13px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.pk-row .b{flex:1;min-width:0}
.pk-row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .s{font-size:var(--fs-meta);color:var(--ink-3)}
.pk-row.unknown .av{background:var(--warn-bg);color:var(--warn)}
.row img.av{object-fit:cover}
.pk-row.place{align-items:flex-start}
.pk-row.place .t{white-space:normal;overflow:visible;font-size:13.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk-row.place .pill{margin-top:2px}
.pk-empty{text-align:center;padding:26px 10px;color:var(--ink-3);font-size:13px}


/* ── ตารางห้องประชุม 08:00–18:00 ─────────────────────────────── */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ghead{display:flex;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .hcell{flex:0 0 84px;padding:8px 5px;text-align:center;border-left:1px solid var(--line)}
.ghead .hcell .n{font-size:var(--fs-meta);font-weight:800;line-height:1.25}
.ghead .hcell .c{font-size:var(--fs-meta);color:var(--ink-3);font-weight:600}
.ghead .corner{flex:0 0 34px}
.gbody{display:flex;position:relative}
.ghours{flex:0 0 34px}
.ghours span{display:block;height:44px;font-size:var(--fs-meta);color:var(--ink-3);font-weight:700;
  text-align:right;padding-right:4px;transform:translateY(-5px)}
.gcol{flex:0 0 84px;position:relative;border-left:1px solid var(--line)}
.gcol .hr{height:44px;border-bottom:1px dashed var(--line)}
.gcol .hr:active{background:var(--bk-bg,#EEF3FF)}
.gev{position:absolute;left:2px;right:2px;border-radius:7px;padding:4px 5px;
  background:var(--primary);color:#fff;overflow:hidden;text-align:left}
.gev.mine{background:var(--ok)}
.gev.unb{background:var(--bad)}
/* แถบเลือกวัน/คัน — เดิมเรียกคลาสนี้อยู่แต่ไม่เคยประกาศ เลยออกมาเป็นข้อความเปล่าๆ */
.chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:1px 0 3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-2);
  white-space:nowrap;line-height:1.25;text-align:center}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .d{display:block;font-size:14.5px;font-weight:800;line-height:1.15}
.mini{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:var(--fs-meta);font-weight:700;color:var(--ink-2)}
.mini.call{border-color:var(--primary);color:var(--primary)}
.times{display:flex;align-items:center;gap:8px;margin-top:4px}
.tbox{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;
  background:#fff;text-align:center}
.tbox.hl{border-color:var(--primary);background:#F5F8FF}
.tbox .k{font-size:var(--fs-meta);font-weight:700;color:var(--ink-3);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{flex:0 0 auto;color:var(--ink-3);font-size:15px;font-weight:800}
/* การ์ดรถในหน้าจอง — อุตส่าห์ใส่รูปแล้ว ต้องเห็นว่ารถหน้าตายังไงจริงๆ
   และรูปคนขับต้องอยู่คู่กัน คนจองจะรู้ว่าไปเจอใครที่จุดนัด */
/* วันเกิดขึ้นบนหน้าแรกให้ทุกคนเห็น แทนการยิง LINE หา 40 คน
   (40 คน × 3 วันเกิด/เดือน = 120 ข้อความ = 40% ของโควตาฟรีทั้งเดือน) */
.bday{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);
  background:linear-gradient(100deg,#FFF7ED,#FEF2F2);border:1px solid #FED7AA;
  font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:18px}
.bday .cake{font-size:24px;flex:0 0 auto}
.ntag{font-size:var(--fs-meta);font-weight:800;padding:2px 7px;border-radius:99px;
  background:var(--neutral);color:var(--ink-2);letter-spacing:.01em}
.ntag.hot{background:var(--bad-bg);color:var(--bad)}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.imgcell{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:var(--neutral)}
.imgcell img{width:100%;height:100%;object-fit:cover}
.imgcell button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:var(--fs-meta);line-height:20px}
.paxrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.paxchip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;
  border-radius:99px;background:#EEF3FF;border:1px solid #D6E1FF;
  font-size:12px;font-weight:600;color:var(--primary)}
.paxchip button{font-size:13px;line-height:1;color:var(--primary);opacity:.6}
/* รูปอยู่ซ้ายเต็มความสูงการ์ด ข้อมูลอยู่ขวา
   แบบเดิมรูปอยู่บนแล้ว crop กลางภาพ เห็นแค่กันชนกับกระจก ไม่รู้ว่ารถคันไหน
   วางแนวนอนแล้วสัดส่วนใกล้เคียงรูปรถจริง (กว้างกว่าสูง) จึงเห็นทั้งคัน */
.vcard{display:flex;width:100%;text-align:left;align-items:stretch;
  border:1.5px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--surface);margin-bottom:11px}
.vcard.on{border-color:var(--primary);box-shadow:0 0 0 3px #EEF3FF}
.vpic{flex:0 0 42%;max-width:210px;min-height:132px;background:var(--neutral);position:relative}
.vphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:grid;place-items:center;color:var(--ink-3)}
.vphoto svg{width:36px;height:36px}
.vbody{flex:1;min-width:0;padding:12px 13px;display:flex;flex-direction:column}
.vhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vname{font-size:15.5px;font-weight:800;line-height:1.25}
.vplate{display:inline-block;font-size:var(--fs-meta);font-weight:800;letter-spacing:.02em;
  border:1.5px solid var(--ink-2);border-radius:5px;padding:1px 7px;margin-top:5px}
.vspec{font-size:var(--fs-meta);color:var(--ink-3);margin-top:5px;line-height:1.45}
.vdrv{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:10px;
  border-top:1px solid var(--line)}
.dav{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:#EEF3FF;color:var(--primary);display:grid;place-items:center;
  font-size:15px;font-weight:800}
.dnm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dco{font-size:var(--fs-meta);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtel{font-size:var(--fs-meta);font-weight:800;color:var(--primary);white-space:nowrap;flex:0 0 auto;
  border:1px solid #D6E1FF;background:#EEF3FF;border-radius:8px;padding:6px 9px}
.vfree{font-size:var(--fs-meta);font-weight:800;margin-top:9px}
@media(max-width:520px){
  .vpic{flex:0 0 38%;min-height:118px}
  .dtel{padding:5px 7px;font-size:var(--fs-meta)}
}

.tin{border:none;background:transparent;width:100%;text-align:center;font-weight:700;
  color:var(--ink);font-size:13px}
.tin.big{font-size:17px;font-weight:800;margin-top:2px}
.ptrow{display:flex;gap:10px}
.ptline{flex:0 0 26px;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.ptdot{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:var(--fs-meta);font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ptdot.home{background:var(--ink-2)}
.ptbar{flex:1;width:2px;background:var(--line);margin:3px 0}
.ptbody{flex:1;min-width:0;padding-bottom:2px}
.pthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ptTag{font-size:var(--fs-meta);font-weight:800;color:var(--ink-3)}
.ptdel{font-size:var(--fs-meta);color:var(--bad);font-weight:700}
.ptseg{font-size:var(--fs-meta);font-weight:800;color:var(--primary);padding:7px 2px 9px;text-align:center}
.placebtn{text-align:left;justify-content:flex-start;line-height:1.4;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.carleg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:9px;
  font-size:var(--fs-meta);color:var(--ink-2);font-weight:600}
.carleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gev.live{background:var(--warn)}
.gev .p{font-size:8.5px;opacity:.85;line-height:1.2}
.gev .t{font-size:var(--fs-meta);font-weight:800;line-height:1.2}
.gev .w{font-size:var(--fs-meta);opacity:.9;line-height:1.25;margin-top:1px}
.gnow{position:absolute;left:34px;right:0;height:2px;background:var(--bad);z-index:3}
.gnow::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--bad)}
.seg2{display:flex;background:var(--neutral);border-radius:10px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;padding:8px;border-radius:8px;font-size:var(--fs-sec);font-weight:700;color:var(--ink-3)}
.seg2 button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rcard{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);
  border-radius:13px;background:var(--surface);margin-bottom:9px;width:100%;text-align:left}
.rphoto{width:74px;height:56px;border-radius:10px;object-fit:cover;background:var(--neutral);
  flex:0 0 auto;display:grid;place-items:center;color:var(--ink-3)}
.rphoto svg{width:26px;height:26px}

/* ── Consent / PDPA ────────────────────────────────────────── */
.legal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;max-height:38dvh;overflow:auto;
  font-size:13px;line-height:1.75;color:var(--ink-2);
}
.legal h4{margin:14px 0 5px;font-size:13.5px;color:var(--ink);font-weight:700}
.legal h4:first-child{margin-top:0}
.legal ul{margin:5px 0;padding-left:18px}
.check{display:flex;gap:11px;align-items:flex-start;margin:15px 0;cursor:pointer}
.check input{width:21px;height:21px;flex:0 0 auto;margin-top:1px;accent-color:var(--primary)}
.check span{font-size:13.5px;line-height:1.55}

/* ── Lang toggle ───────────────────────────────────────────── */
.langsw{display:inline-flex;background:var(--neutral);border-radius:9px;padding:2px}
.langsw button{padding:6px 15px;border-radius:7px;font-size:var(--fs-sec);font-weight:700;color:var(--ink-3)}
.langsw button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.09)}

.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);
  background:var(--warn-bg);border:1px solid #FDE68A;
  font-size:var(--fs-sec);line-height:1.6;color:#92400E;
}
.note.info{background:#EEF3FF;border-color:#C7D7FE;color:#1E40AF}
.note svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}

.contact-group{margin-bottom:18px}
.contact-group > h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.callbtn{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  background:var(--ok);color:#fff;display:grid;place-items:center;
}
.callbtn.sos{background:var(--danger)}
.callbtn svg{width:20px;height:20px}

/* ── แท็บเล็ต: กว้างขึ้นแต่ยังเป็นคอลัมน์เดียว ───────────────── */
@media(min-width:600px) and (max-width:899px){
  main{max-width:620px;margin:0 auto;width:100%}
  .tiles{grid-template-columns:repeat(3,1fr)}
}

/* ══════════════════════════════════════════════════════════════
   เดสก์ท็อป (≥900px) — เปลี่ยนโครงหน้าจริง ไม่ใช่แค่ขยายคอลัมน์มือถือ
   ของเดิมบีบทุกอย่างไว้ 560px บนจอ 1440px = ทิ้งพื้นที่ไป 880px
   และแถบเมนูล่างแบบมือถือบนจอคอมเป็นรูปแบบที่ผิดตั้งแต่ต้น
   ══════════════════════════════════════════════════════════════ */
#side{display:none}

@media(min-width:900px){
  #app{
    display:grid;
    grid-template-columns:252px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);
    min-height:100dvh;
  }
  #side{
    grid-row:1/3;grid-column:1;
    display:flex;flex-direction:column;
    background:var(--navy);color:#fff;
    position:sticky;top:0;height:100dvh;overflow-y:auto;
  }
  .topbar{grid-column:2;grid-row:1;height:66px;padding:0 26px}
  .topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .topbar .icon-btn{width:34px;height:34px;margin-left:-6px}
  .brand{display:none!important}
  main{grid-column:2;grid-row:2;max-width:1180px;padding:26px 30px 60px}
  .nav{display:none}
  .tiles{grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{min-height:118px;padding:17px 16px}

  /* ตารางจอง: ให้คอลัมน์ยืดเต็มความกว้าง ไม่ใช่ 84px แล้วเหลือที่ว่างครึ่งจอ */
  .gridscroll > div{width:100%}
  .gcol,.ghead .hcell{flex:1 1 0;min-width:104px}
  .ghours,.ghead .corner{flex:0 0 42px}
  .gnow{left:42px}

  /* ปุ่มหลักยังลอยติดตาม แต่ไม่กินความกว้างทั้งจอและไม่บังตาราง */
  .sticky-cta{padding:10px 0;background:none;border:0;display:flex;justify-content:flex-end;
    bottom:14px;pointer-events:none}
  .sticky-cta .btn{width:auto;min-width:210px;pointer-events:auto;box-shadow:var(--shadow)}

  /* บล็อกการจองบนจอกว้าง: อ่านเหมือนปฏิทินจริง ไม่ใช่แผ่นสีทึบเต็มช่อง */
  .gev{color:var(--ink);background:#EEF3FF;border-left:3px solid var(--primary);
    padding:6px 9px;border-radius:6px}
  .gev .t{font-size:var(--fs-meta)}
  .gev .w{font-size:var(--fs-meta);opacity:.72}
  .gev .p{font-size:var(--fs-meta);opacity:.7}
  .gev.mine{background:var(--ok-bg);border-left-color:var(--ok)}
  .gev.live{background:var(--warn-bg);border-left-color:var(--warn)}
  .gev.unb{background:var(--bad-bg);border-left-color:var(--bad)}
  .fab{bottom:26px;right:26px}

  /* ฟอร์มและรายการไม่ควรยืดเต็ม 1180px — บรรทัดยาวเกินไปอ่านไม่ไหว
     ของที่ควรกว้างจริงๆ (ตาราง · ไทล์ · แดชบอร์ด) ยกเว้นไว้ด้านล่าง */
  main > .view > .card,
  main > .view > .rows,
  main > .view > .note,
  main > .view > .empty,
  main > .view > input,
  main > .view > select,
  main > .view > textarea,
  main > .view > .btn{max-width:780px}
  main > .view > #dq{max-width:520px}
  main > .view > .gridwrap,
  main > .view > .tiles,
  main > .view > .hsplit,
  main > .view > .todo,
  main > .view > .cols2,
  main > .view > .bkwrap{max-width:none}

  /* หน้าจอง: ตารางซ้าย · รายการห้อง/รถ/Zoom ขวา
     เดิมรายการอยู่ล่างสุดเพราะเขียนเรียงตามมือถือ บนจอกว้างจึงเหลือที่ว่างข้างตารางเปล่าๆ
     ต้องเลื่อนลงไปดูรถทั้งที่มีที่ว่างอยู่ข้างๆ */
  .bkwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start;max-width:none}
  .bkwrap .section-title:first-child{margin-top:0}
  .bkside{position:sticky;top:82px}

  /* รายชื่อ 40 คนบนจอกว้าง อ่านสองคอลัมน์เร็วกว่าไล่ลงทีละแถว */
  /* ใช้ column ไม่ใช่ grid — grid จะโยนหัวข้อแผนกไปคอลัมน์ซ้ายและคนไปคอลัมน์ขวา
     column ยังไหลตามลำดับการอ่านเดิม */
  .dircols{columns:2;column-gap:26px;max-width:none}
  .eqcols{columns:2;column-gap:22px;max-width:none}
  .eqcols .rcard{break-inside:avoid;display:flex;width:100%}
  .eqcols .section-title{break-inside:avoid}
  .dircols .dgrp{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%}
  .dircols .dgrp .section-title:first-child{margin-top:0}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cols2 .rows{margin:0}
  /* แผ่นล่างบนจอคอมไม่ควรกว้างเต็ม 1440px — อ่านยากและดูเหมือนหลุดขอบ */
  #sheet{max-width:540px;left:50%;right:auto;transform:translateX(-50%) translateY(100%);
         padding:8px 22px 24px}
  #sheet.on{transform:translateX(-50%) translateY(0)}
}

@media(min-width:1280px){
  main{padding:30px 44px 64px}
  .tiles{grid-template-columns:repeat(4,1fr)}
}

/* ── เมนูข้าง ─────────────────────────────────────────────────── */
/* สลับภาษาต้องอยู่ตรงที่เห็นทันที ไม่ใช่ซ่อนในหน้าโปรไฟล์
   ออฟฟิศมีทั้งเจ้าหน้าที่ต่างชาติ และคนไทยที่ไม่สะดวกภาษาอังกฤษ */
.langtop{display:flex;gap:2px;background:var(--neutral);border-radius:9px;padding:3px;flex:0 0 auto}
.langtop button{padding:5px 10px;border-radius:7px;font-size:var(--fs-meta);font-weight:800;color:var(--ink-3)}
.langtop button.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media(min-width:900px){ .langtop{margin-left:auto} }

.sbrand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.sbrand .mark{width:36px;height:36px;flex:0 0 auto;
  background:none;border-radius:50%;padding:0;object-fit:contain;display:block}
.sbrand .txt{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sbrand .sub{font-size:var(--fs-meta);font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.04em;
  text-transform:uppercase}
.sgrp{font-size:var(--fs-meta);font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.38);padding:16px 18px 7px}
#side nav{display:flex;flex-direction:column;padding:0 8px;gap:1px}
.slink{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;
  color:rgba(255,255,255,.76);font-size:13.5px;font-weight:600;text-align:left;width:100%}
.slink svg{width:19px;height:19px;flex:0 0 auto;opacity:.85}
.slink:hover{background:rgba(255,255,255,.07);color:#fff}
.slink.on{background:var(--primary);color:#fff}
.slink.on svg{opacity:1}
.slink .sb{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--bad);color:#fff;font-size:var(--fs-meta);font-weight:800;line-height:19px;text-align:center}
.sfoot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.1)}
.sme{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.sme .av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.sme .n{font-size:13px;font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sme .d{font-size:var(--fs-meta);color:rgba(255,255,255,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══════════ เพิ่ม 2026-09-05: พอร์ทัลคนขับ · ป้าย QR · ฟอร์มเพิ่มรายการ ══════════ */

/* ── ฟอร์มที่มีหลายช่อง ────────────────────────────────────────
   ปัญหาเดิม: ฟอร์มเพิ่มรายการเป็นแถบผอมยาว ต้องเลื่อนสิบกว่าครั้งกว่าจะถึงปุ่มบันทึก
   ทั้งที่บนจอคอมมีที่ว่างข้างๆ เหลือเฟือ และช่องส่วนใหญ่สั้นมาก */
#sheet.wide{max-width:760px}
@media(min-width:900px){ #sheet.wide{width:760px} }
/* กรอบถ่ายรูปในฟอร์มกว้าง ไม่ต้องกว้างเต็มแผ่น — เป้าถ่ายรูปไม่ได้ดีขึ้นตามขนาด */
#sheet.wide .shot{max-width:380px}
.fsec{margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.fsec:first-of-type{border-top:0;padding-top:0;margin-top:6px}
.fsec h4{margin:0 0 3px;font-size:var(--fs-sec);font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-3)}
.fsec .why{margin:0 0 12px;font-size:12px;line-height:1.55;color:var(--ink-2)}
.fhint{font-size:var(--fs-meta);line-height:1.5;color:var(--ink-3);margin:-8px 0 12px}
@media(min-width:760px){
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .fgrid .full{grid-column:1/-1}
}

/* ── ป้าย QR สำหรับพิมพ์ ──────────────────────────────────────
   ตั้งใจให้พอดีสติกเกอร์ A4 แบบ 3×8 (70×37 มม.) ที่หาซื้อได้ทั่วไป
   ทุกอย่างเป็นมิลลิเมตรจริง เพราะป้ายที่พิมพ์ออกมาผิดขนาดคือป้ายที่แปะไม่ได้ */
.lbgrid{display:grid;grid-template-columns:repeat(3,70mm);gap:0;justify-content:center}
.lbl{width:70mm;height:37mm;box-sizing:border-box;padding:4mm 4mm 3mm;
  display:flex;gap:3.5mm;align-items:center;border:1px dashed var(--line);overflow:hidden}
.lbl .qr{flex:0 0 auto;width:26mm;height:26mm}
.lbl .qr svg{width:100%;height:100%;display:block}
.lbl .tx{min-width:0;flex:1}
.lbl .nm{font-size:11pt;font-weight:800;line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl .tg{font-size:12pt;font-weight:800;letter-spacing:.06em;margin-top:1.5mm;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.lbl .lo{font-size:8pt;color:#444;margin-top:1mm;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbpick{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--surface);width:100%;text-align:left;margin-bottom:7px}
.lbpick.on{border-color:var(--primary);background:var(--primary-bg,#EEF2FF)}
.lbpick .bx{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.lbpick.on .bx{background:var(--primary);border-color:var(--primary)}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{position:absolute;inset:0;padding:0;background:#fff}
  .lbl{border:1px dashed #ddd;page-break-inside:avoid}
  .lbgrid{justify-content:flex-start}
}

/* ── QR ที่แสดงในหน้ารายละเอียดอุปกรณ์ ── */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.qrbox .tg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:800;
  letter-spacing:.08em;color:#111}

/* ── แถบล่างของโหมดคนขับ ──────────────────────────────────────
   คนขับเห็นแค่สามอย่าง เพราะเขาทำอยู่สามอย่าง
   ไม่ใช่เมนูพนักงานที่ซ่อนปุ่มไปครึ่งหนึ่ง — แบบนั้นเดี๋ยวก็ลืมซ่อนสักอัน */
body.drvmode #side{display:none!important}
body.drvmode main{grid-column:1/-1!important;max-width:820px;margin:0 auto}
@media(min-width:900px){ body.drvmode #app{grid-template-columns:1fr!important} }
body.drvmode .nav{display:flex!important}
/* ปุ่มสลับภาษาบนแถบบน — คนขับกดพลาดแล้วทั้งหน้ากลายเป็นภาษาอังกฤษ
   แล้วหาทางกดกลับไม่เจอ เพราะคำว่า TH/EN ก็เล็กและอยู่มุมจอ */
body.drvmode .langtop{display:none!important}
.drvcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:14px;margin-bottom:12px}
.drvcard.live{border-color:var(--warn);border-width:2px}
.drvbig{width:100%;padding:17px;font-size:16.5px;font-weight:800;border-radius:var(--r);margin-top:12px}
.stopline{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.stopline .dot{width:9px;height:9px;border-radius:50%;background:var(--line);
  flex:0 0 auto;margin-top:6px}
.stopline.hit .dot{background:var(--ok)}


/* ══════════ ช่องค้นหา ══════════ */
/* ในหน้าบริการเป็นแค่ "ปุ่มที่หน้าตาเหมือนช่องค้นหา" — กดแล้วไปหน้าค้นหาจริง
   ทำแบบนี้เพราะหน้าบริการวาดเสร็จทันที ไม่ต้องรอคีย์บอร์ดเด้งขึ้นมาบังครึ่งจอ
   ตั้งแต่วินาทีแรกที่เปิด ทั้งที่ส่วนใหญ่คนเปิดมาเพื่อกดเมนู ไม่ได้มาพิมพ์ */
.srchbar{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:13px 15px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink-3); font-size:var(--fs-body); cursor:pointer }
.srchbar:hover{ border-color:var(--brand); color:var(--brand) }
.srchbar svg{ width:19px; height:19px; flex:0 0 auto }

.schhint{ margin:12px 2px 0; font-size:var(--fs-sec); color:var(--ink-3); line-height:1.6 }
.schwait{ padding:16px 2px; font-size:var(--fs-sec); color:var(--ink-3) }

/* ผลค้นหาที่เป็นคน — เบอร์กับอีเมลต้องกดโทร/กดส่งได้ทันทีจากตรงนี้
   ถ้าต้องจำแล้วไปกดที่อื่น เท่ากับยังไม่ได้ช่วยอะไร */
.row.schp{ align-items:flex-start; cursor:default }
.av2{ width:38px; height:38px; flex:0 0 auto; border-radius:50%; background:var(--brand-50);
  color:var(--brand); display:grid; place-items:center; font-weight:700; font-size:16px }
.nick{ font-weight:400; color:var(--ink-3); font-size:var(--fs-sec) }
.schc{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:7px }
.schc a{ display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-sec);
  color:var(--brand); text-decoration:none; font-weight:600 }
.schc a:hover{ text-decoration:underline }
.schc svg{ width:14px; height:14px }

/* ══════════ หน้าฉัน ══════════ */
.mehead{ text-align:center; padding:10px 0 6px }
.meav{ width:76px; height:76px; border-radius:50%; object-fit:cover; display:block; margin:0 auto }
.meav-t{ background:var(--brand-50); color:var(--brand); display:grid; place-items:center;
  font-size:30px; font-weight:700 }
.mehead h2{ margin:12px 0 3px; font-size:var(--fs-h1); font-weight:700; color:var(--ink) }
.mehead p{ margin:0; font-size:var(--fs-sec); color:var(--ink-2) }
.mehead p.medept{ color:var(--ink-3); margin-top:1px }

.mel{ border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:var(--surface) }
.meli{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:14px 15px; border-bottom:1px solid var(--line); background:none; cursor:pointer }
.mel .meli:last-child{ border-bottom:0 }
.meli:hover{ background:var(--brand-50) }
.meli-n{ flex:1; min-width:0; font-size:var(--fs-body); color:var(--ink) }
.meli-v{ flex:0 0 auto; font-size:var(--fs-sec); font-weight:700; color:var(--ink-3) }
.meli .go{ flex:0 0 auto; color:var(--ink-3) }
.meli .go svg{ width:17px; height:17px }
.mever{ margin:16px 0 0; text-align:center; font-size:var(--fs-meta); color:var(--ink-3) }

/* ══════════ ศูนย์แจ้งเตือน ══════════
   ไม่ใช่ทุกการแจ้งเตือนมีน้ำหนักเท่ากัน
   กลุ่ม "ต้องดำเนินการ" จึงเป็นกลุ่มเดียวที่ได้พื้นสีและปุ่ม
   ส่วนที่เหลือเป็นรายการเรียบๆ เพราะอ่านแล้วจบ */
.nsec{ margin-bottom:26px }
.nsec:last-child{ margin-bottom:0 }
.nsec-h{ display:flex; align-items:center; gap:9px; margin:0 0 4px }
.nsec-h h3{ margin:0; font-size:var(--fs-h2); font-weight:700; color:var(--ink) }
.nsec-s{ margin:0 0 10px; font-size:var(--fs-meta); color:var(--ink-3) }
.nlist{ display:flex; flex-direction:column; gap:8px }

.nrow{ display:flex; align-items:flex-start; gap:11px; width:100%; text-align:left;
  padding:13px 14px; border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface); cursor:pointer }
.nrow:hover{ border-color:var(--brand) }
.ndotm{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; margin-top:6px;
  background:var(--line2, var(--line)) }
.nbody{ flex:1; min-width:0 }
.nt{ display:block; font-size:var(--fs-body); font-weight:600; color:var(--ink);
  line-height:1.45 }
.ns{ display:block; margin-top:2px; font-size:var(--fs-meta); color:var(--ink-3) }
.ncta{ flex:0 0 auto; display:inline-flex; align-items:center; gap:3px; align-self:center;
  font-size:var(--fs-sec); font-weight:700; color:var(--brand); white-space:nowrap }
.ncta svg{ width:15px; height:15px }

/* ต้องดำเนินการ = ยังมีคนหรือของรออยู่ปลายทาง */
.nrow.action{ background:var(--warn-bg); border-color:#F0DCBB }
.nrow.action .ndotm{ background:var(--warn) }
.nrow.action .ncta{ color:var(--warn) }
/* อัปเดต = เรื่องของเราขยับแล้ว อ่านแล้วจบ */
.nrow.update .ndotm{ background:var(--brand) }
/* ข้อมูล = เรื่องทั่วไปขององค์กร ไม่ได้เจาะจงถึงเรา */
.nrow.info{ background:none; border-color:transparent; border-bottom:1px solid var(--line);
  border-radius:0; padding:12px 2px }
.nrow.info .ndotm{ background:var(--ink-3); opacity:.4 }
.nrow.info .nt{ font-weight:500; color:var(--ink-2) }
.nlist .nrow.info:last-child{ border-bottom:0 }

/* ══════════ หน้าแรกบนจอคอม ══════════
   จอคอมไม่ใช่จอมือถือที่กว้างขึ้น มีพื้นที่แนวนอนที่มือถือไม่มี
   ของเดิมวางทุกโซนต่อกันลงมาเป็นแถวเดียว บนจอ 1440px จึงเหลือที่ว่างข้างขวา
   ครึ่งจอ แล้วเรื่องที่ต้องทำกับตารางวันนี้ก็ยังต้องเลื่อนหากันอยู่ดี

   จัดใหม่เป็นสองคอลัมน์: ซ้ายคือสิ่งที่ต้องลงมือทำและข่าวสาร
   ขวาเป็นรางข้อมูลที่ต้องเหลือบดู — ตารางวันนี้กับทางลัด
   "ต้องทำตอนนี้" อยู่ซ้ายบนเสมอ เพราะเป็นเหตุผลที่คนเปิดหน้านี้ */
@media(min-width:1000px){
  .home{
    display:grid;
    grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);
    grid-template-areas:
      'head head'
      'att  week'
      'news quick';
    column-gap:30px; align-items:start;
  }
  .home > .hhead   { grid-area:head }
  .home > .hz-att  { grid-area:att }
  .home > .hz-week { grid-area:week }
  .home > .hz-quick{ grid-area:quick }
  .home > .hz-news { grid-area:news }
  /* รางขวาเป็นข้อมูลประกอบ ไม่ใช่เนื้อหาหลัก จึงใส่พื้นให้ต่างจากคอลัมน์ซ้าย */
  .home > .hz-week, .home > .hz-quick{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:16px 17px; margin-bottom:16px }
  .home > .hz-week .hz-h, .home > .hz-quick .hz-h{ margin-top:0 }
  .home .qa{ grid-template-columns:repeat(2,1fr) }
  .home .atc{ flex-direction:row; align-items:center }
  .home .atc-b{ flex:1 }
  .home .atc-cta{ align-self:center }
}

/* ══════════ สวิตช์เปิด-ปิด ══════════
   class="switch" ถูกใช้อยู่เจ็ดจุด (ความเป็นส่วนตัวในหน้าฉัน · ฟีดแบ็ก · หน้าแก้ข้อความ)
   แต่ไม่เคยมี CSS ของตัวเองเลย label เป็น inline โดยธรรมชาติ
   สองสวิตช์ที่วางติดกันจึงไหลไปต่อกันเป็นย่อหน้าเดียว อ่านไม่ออกว่าอันไหนคุมอะไร
   ที่ผ่านมามองไม่เห็นเพราะมันถูกวางคั่นด้วยบล็อกอื่นเสมอ */
.switch{display:flex;gap:11px;align-items:flex-start;cursor:pointer;
  font-size:var(--fs-sec);line-height:1.55}
.switch input{width:21px;height:21px;flex:0 0 auto;margin-top:1px;accent-color:var(--primary)}
.switch > span{flex:1;min-width:0}

/* เส้นขอบของไทล์สถานะ — ถูกเรียกใช้อยู่แล้วแต่ยังไม่เคยถูกประกาศ
   ผลคือไทล์ "ยังไม่ตอบ" กับ "ปลอดภัย" ได้ขอบสีเทาเหมือนกันหมด */
:root{ --warn-line:#F5D9A8; --ok-line:#B9E0D0 }

/* ══════════ แผงอ่านด้านข้าง ══════════
   บนจอคอมเลื่อนเข้ามาจากขวาและอยู่ข้างๆ รายการเดิม จึงยังเห็นว่าอ่านฉบับไหนอยู่
   บนมือถือเปิดเต็มจอ เพราะจอกว้าง 390px ไม่มีที่ให้วางสองอย่างข้างกัน */
#pnScrim{position:fixed;inset:0;background:rgba(8,58,82,.42);opacity:0;pointer-events:none;
  transition:opacity .2s ease;z-index:78}
#pnScrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;z-index:79;background:var(--surface);display:flex;flex-direction:column;
  inset:0;transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  visibility:hidden}
#panel.on{transform:none;visibility:visible}
.pn-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
  flex:0 0 auto;background:var(--surface)}
.pn-h h3{margin:0;font-size:var(--fs-h2);font-weight:800;line-height:1.35;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pnClose{width:36px;height:36px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:18px;line-height:1;cursor:pointer}
#pnClose:hover{border-color:var(--brand);color:var(--brand)}
#pnBody{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 40px;
  padding-bottom:calc(40px + var(--safe-b))}
body.pn-open{overflow:hidden}
@media(min-width:1000px){
  #panel{inset:0 0 0 auto;width:min(560px,46vw);transform:translateX(100%);
    box-shadow:-8px 0 40px rgba(8,58,82,.18)}
  #panel.on{transform:none}
}

/* ══════════ ดูรูปเต็ม ══════════
   ประกาศจาก HR ส่วนใหญ่คือภาพที่มีตัวหนังสือ ถ้าซูมไม่ได้ก็เท่ากับไม่ได้ประกาศ */
#zoom{position:fixed;inset:0;z-index:90;background:rgba(10,14,18,.94);display:none;
  align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}

/* ══════════ รายการประกาศแบบสองบรรทัด ══════════ */
.nwlist{display:flex;flex-direction:column;gap:8px}
.nwrow{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;cursor:pointer;
  padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.nwrow:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.nwrow.off{opacity:.6}
.nwx{flex:1;min-width:0;display:block}
.nwt{display:block;font-size:var(--fs-body);font-weight:700;color:var(--ink);line-height:1.42}
.nws{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:3px;font-size:var(--fs-sec);color:var(--ink-2);line-height:1.5}
.nwm{display:block;margin-top:5px;font-size:var(--fs-meta);color:var(--ink-3)}
.nwr{flex:0 0 auto;display:flex;align-items:center;gap:7px;align-self:center}
.nwdue{font-size:var(--fs-meta);font-weight:800;color:var(--warn);white-space:nowrap}
.nwr .go{width:18px;height:18px;color:var(--ink-3)}
.nwr .go svg{width:18px;height:18px}

.nwhead{padding-bottom:14px;border-bottom:1px solid var(--line)}
.nwmeta{font-size:var(--fs-meta);color:var(--ink-3);font-weight:700}
.nwtags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.nwhead h2{margin:8px 0 0;font-size:20px;font-weight:800;line-height:1.35}
.nwdue2{margin-top:8px;font-size:var(--fs-sec);font-weight:800;color:var(--warn)}
.nwdue2.off{color:var(--ink-3)}
.nwbody{margin-top:14px;font-size:var(--fs-body);color:var(--ink-2);line-height:1.75;
  white-space:pre-wrap}
/* รูปในแผงกว้างกว่าในรายการ เพราะที่นี่คือที่ที่คนตั้งใจมาดู */
.nwpics{margin-top:16px}
.nwpics .imgcell{aspect-ratio:auto;max-height:none}
.nwpics .imgcell img{height:auto;object-fit:contain;background:var(--neutral)}
@media(min-width:1000px){ .nwpics{grid-template-columns:1fr} }

/* ══════════ ปุ่มเลือกสามทาง (แหล่งรูปโปรไฟล์) ══════════ */
.segp{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.segp button{flex:1;padding:10px 6px;border:0;background:var(--surface);color:var(--ink-2);
  font-size:var(--fs-sec);font-weight:600;cursor:pointer;min-width:0}
.segp button + button{border-left:1px solid var(--line)}
.segp button.on{background:var(--brand);color:#fff}
.segp button:disabled{opacity:.4;cursor:not-allowed}
.prev{margin-top:12px;display:flex;justify-content:center}
.prev-im{width:76px;height:76px;border-radius:50%;object-fit:cover;display:block;
  border:1px solid var(--line)}
.prev-tx{display:grid;place-items:center;background:var(--brand-50);color:var(--brand);
  font-size:28px;font-weight:800}

/* ══════════ กระดานเหตุฉุกเฉิน ══════════ */
.emgrow{align-items:flex-start}
/* ตำแหน่งกับสิ่งที่เกิดขึ้นต้องอ่านได้ครบ ไม่ใช่ตัดด้วยจุดสามจุด
   "ชั้น 4 ห้องเก็บ…" ไม่ช่วยใครเลยตอนต้องไปหาคนให้เจอ */
.emgrow .body .s{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.55}
.emgacts{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.emgacts .mini{white-space:nowrap}
.mini.go{background:var(--warn);color:#fff;border-color:var(--warn)}
.mini.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.emgby{margin-top:4px;font-size:var(--fs-meta);font-weight:700;color:var(--ok)}
.emgrow.helping .emgby{color:var(--warn)}
.emgc{margin-top:6px;padding:4px 9px;border-radius:999px;border:1px dashed var(--line);
  background:none;color:var(--ink-3);font-size:var(--fs-meta);cursor:pointer}
.emgc:hover{border-color:var(--bad);color:var(--bad)}
.emgkin{margin-top:6px;padding:8px 10px;border-radius:var(--r-sm);background:var(--bad-bg);
  font-size:var(--fs-meta);color:var(--ink-2);line-height:1.6}
.emgkin a{font-weight:800;color:var(--bad)}

/* ══════════ ประโยคของผู้พัฒนา — หน้าจอแก้ไข ══════════ */
.dlrow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.dlno{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--brand-50);
  color:var(--brand);font-size:var(--fs-meta);font-weight:800;display:grid;place-items:center}
.dlf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dlf textarea{width:100%;resize:vertical;font-size:var(--fs-sec);padding:9px 10px;
  border:1px solid var(--line);border-radius:var(--r-sm);font-family:inherit;line-height:1.55}
.dlx{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-3);cursor:pointer;font-size:13px}
.dlx:hover{border-color:var(--danger);color:var(--danger)}

/* ══════════ ปุ่มลงมือทำในศูนย์แจ้งเตือน ══════════
   "ต้องดำเนินการ" ที่กดแล้วได้แค่หน้ารายการ ก็ยังไม่ได้ทำให้ใครดำเนินการ
   ปุ่มจึงบอกกริยาที่ต้องทำจริง แทนคำว่า "เปิด" ที่ใช้ได้กับทุกอย่าง */
.nrow.action .ncta{background:var(--brand);color:#fff;border-radius:999px;padding:6px 11px;
  font-weight:800}
.nrow.action .ncta svg{width:14px;height:14px}

/* ══════════ รูปคนในแถวรายการ ══════════
   บั๊กเก่า: .av ถูกใช้ในหน้าทำเนียบและกระดานเหตุฉุกเฉินมาตลอด
   แต่มีกฎ CSS แค่ .pk-row .av (หน้าเลือกคน) กับ .row img.av{object-fit}
   ตัวที่อยู่ใน .row จึงไม่เคยมีขนาดเลย — ตัวอักษรย่อไม่มีวงกลม
   และพอเปลี่ยนมาใช้รูปโปรไฟล์ LINE ซึ่งเป็นไฟล์เต็มขนาด รูปก็ขยายเต็มการ์ด
   จนบังชื่อคนอื่นทั้งหน้า ที่ผ่านมารอดมาได้เพราะรูปเดิมเป็น thumbnail จิ๋วในชีท */
.row .av{ width:38px; height:38px; flex:0 0 auto; border-radius:50%;
  background:var(--brand-50); color:var(--brand);
  font-size:15px; font-weight:800; line-height:1;
  display:grid; place-items:center; overflow:hidden }
.row img.av{ object-fit:cover; display:block }
.row .av.no{ background:var(--bad-bg); color:var(--bad) }

/* ══════════ พอร์ทัลคนขับ ══════════
   คนขับส่วนใหญ่อายุ 50+ ใช้มือถือกลางแดด และเปิดแอปตอนกำลังจะออกรถ
   ทุกอย่างในโหมดนี้จึงใหญ่กว่าที่อื่นในระบบหนึ่งขั้น และปุ่มต้องมีสี
   ปุ่มพื้นขาวขอบบางบนพื้นขาว คือปุ่มที่คนไม่รู้ว่าเป็นปุ่ม */
body.drvmode{ --fs-body:17px; --fs-sec:15px; --fs-meta:13px }
.drv{ padding-bottom:30px }
.dgreet{ font-size:19px; font-weight:700; color:var(--ink); margin:2px 0 10px }
.dveh{ display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:var(--r);
  background:var(--brand-50); color:var(--brand); font-size:15px; font-weight:700; margin-bottom:18px }
.dveh svg{ width:22px; height:22px; flex:0 0 auto }
.dsec{ margin:22px 0 10px; font-size:15px; font-weight:800; color:var(--ink-3);
  letter-spacing:.02em }

/* ── งานถัดไป: การ์ดใหญ่หนึ่งใบ ── */
.dhero{ border:2px solid var(--brand); border-radius:var(--r-xl); padding:18px 17px 17px;
  background:var(--surface); box-shadow:var(--shadow) }
.dhero.live{ border-color:var(--ok); background:var(--ok-bg) }
.dhero-h{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap }
.dhero-t{ font-size:36px; font-weight:800; line-height:1; letter-spacing:-.01em;
  font-variant-numeric:tabular-nums; color:var(--brand) }
.dhero.live .dhero-t{ color:var(--ok) }
.dhero-d{ font-size:17px; font-weight:700; color:var(--ink-2) }
.dhero-live{ margin-left:auto; font-size:13px; font-weight:800; color:#fff;
  background:var(--ok); padding:4px 11px; border-radius:999px }
.dhero-v{ margin-top:10px; font-size:17px; font-weight:700; color:var(--ink) }
.dhero-r{ margin-top:4px; font-size:19px; font-weight:800; line-height:1.4; color:var(--ink) }
.dhero-m{ margin-top:12px; font-size:15px; line-height:1.75; color:var(--ink-2) }
.dhero-n{ color:var(--ink-3) }

/* ── จุดแวะ ── */
.dstops{ margin-top:14px; border-top:1px dashed var(--line); padding-top:12px }
.dstop{ display:flex; align-items:center; gap:11px; padding:7px 0 }
.dstop-n{ flex:0 0 auto; width:28px; height:28px; border-radius:50%; display:grid;
  place-items:center; background:var(--brand-50); color:var(--brand);
  font-size:14px; font-weight:800 }
.dstop-x{ flex:1; min-width:0; font-size:15px; font-weight:600; line-height:1.4 }
.dstop.hit .dstop-n{ background:var(--ok); color:#fff }
.dstop.hit .dstop-x{ color:var(--ink-3); text-decoration:line-through }
.dstop-b{ flex:0 0 auto; padding:9px 14px; border-radius:999px; border:0;
  background:var(--brand); color:#fff; font-size:14px; font-weight:700; cursor:pointer }

/* ── ปุ่มของคนขับ: สูง 64–68px มีสีเสมอ ── */
.dbtn{ display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
  min-height:64px; margin-top:12px; border:0; border-radius:16px; cursor:pointer;
  font-size:19px; font-weight:800; text-align:center; text-decoration:none;
  padding:12px 14px; line-height:1.3 }
.dbtn.go{ background:var(--brand); color:#fff }
.dbtn.go:active{ background:var(--brand-700) }
.dbtn.ret{ background:var(--ok); color:#fff }
.dbtn.call{ background:var(--surface); color:var(--brand); border:2px solid var(--brand);
  min-height:56px; font-size:17px }
.dbtn.map{ background:var(--brand-50); color:var(--brand); min-height:56px; font-size:17px }
.dbtn.off{ background:var(--surface); color:var(--danger); border:2px solid var(--danger);
  min-height:56px; font-size:17px }
.dbtn-d{ width:12px; height:12px; border-radius:50%; background:#fff; flex:0 0 auto }
.dhero-btns{ display:flex; gap:10px; margin-top:14px }
.dhero-btns .dbtn{ margin-top:0 }

/* ── งานอื่นๆ ── */
.dlist{ display:flex; flex-direction:column; gap:9px }
.drow{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; cursor:pointer;
  padding:15px 15px; border-radius:var(--r-lg); border:1.5px solid var(--line);
  background:var(--surface) }
.drow:active{ background:var(--brand-50) }
.drow.off{ opacity:.62; cursor:default }
.drow-t{ flex:0 0 auto; font-size:19px; font-weight:800; color:var(--brand);
  font-variant-numeric:tabular-nums }
.drow.off .drow-t{ color:var(--ink-3) }
.drow-x{ flex:1; min-width:0 }
.drow-n{ display:block; font-size:16px; font-weight:700; line-height:1.35 }
.drow-s{ display:block; font-size:14px; color:var(--ink-3); margin-top:2px }
.drow-g{ flex:0 0 auto; width:20px; height:20px; color:var(--ink-3) }
.drow-g svg{ width:20px; height:20px }

.dnone{ display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
  padding:32px 18px; border-radius:var(--r-xl); border:2px dashed var(--line);
  color:var(--ink-3) }
.dnone svg{ width:44px; height:44px; color:var(--brand-300) }
.dnone b{ font-size:17px; color:var(--ink-2) }
.dnone span{ font-size:14px }

/* ช่องกรอกของคนขับใหญ่กว่าที่อื่น — เลขไมล์พิมพ์กลางแดดด้วยนิ้วโป้ง */
.dbig{ font-size:20px!important; padding:15px 14px!important; font-weight:700 }

/* ตัวเลือกเหตุผล: แถวเต็มความกว้าง กดพลาดยาก */
.dopts{ display:flex; flex-direction:column; gap:8px }
.dopt{ width:100%; text-align:left; padding:15px 15px; border-radius:14px;
  border:2px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:16px; font-weight:600; cursor:pointer }
.dopt.on{ border-color:var(--brand); background:var(--brand-50); color:var(--brand);
  font-weight:800 }

/* ══════════ ตารางงานของคนขับ (ฝั่งผู้ดูแล) ══════════ */
.djrow .s{ white-space:normal; overflow:visible; text-overflow:clip; line-height:1.5 }
.chips .chip[disabled]{ opacity:.45; cursor:not-allowed }

/* ══════════ ลายเซ็นคนทำ ══════════
   ใส่ชื่อตัวเองตรงๆ กลางหน้าอ่านแล้วเหมือนป้ายโฆษณาตัวเอง
   แต่ไม่ใส่เลยก็ไม่จริง เพราะมีคนลงมือทำอยู่จริงๆ
   ทางออกคือให้มันเป็นลายเซ็นเล็กๆ ที่ต้องเอานิ้วไปแตะถึงจะเห็นชื่อ
   คนที่อยากรู้ว่าใครทำจะได้รู้ คนที่ไม่ได้สนใจก็เห็นแค่รูปการ์ตูนน่ารักๆ */
.sig{ position:relative; display:block; margin:0 auto 6px; padding:4px 8px;
  background:none; border:0; cursor:pointer; line-height:0 }
.sig-i{ height:52px; width:auto; display:block; color:var(--brand);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1) }
.sig:hover .sig-i, .sig.on .sig-i{ transform:translateY(-2px) }
.sig-t{ position:absolute; left:50%; top:100%; margin-top:5px;
  transform:translateX(-50%); white-space:nowrap;
  background:var(--ink); color:#fff; font-size:var(--fs-meta); font-weight:600;
  line-height:1.4; padding:5px 10px; border-radius:8px;
  opacity:0; pointer-events:none; transition:opacity .16s ease; z-index:2 }
.sig-t::before{ content:''; position:absolute; left:50%; top:-4px; width:8px; height:8px;
  transform:translateX(-50%) rotate(45deg); background:var(--ink); border-radius:2px }
.sig:hover .sig-t, .sig:focus-visible .sig-t, .sig.on .sig-t{ opacity:1 }
/* จุดไข่ปลาจางๆ บอกว่ากดได้ — ไม่งั้นบนมือถือจะไม่มีใครรู้ว่าแตะได้ */
.sig-h{ display:block; margin:2px auto 0; width:26px; height:0;
  border-top:1.5px dotted var(--brand-300) }

/* ══════════ ปิดท้ายหน้าเกี่ยวกับ ══════════ */
.ab-close{ margin:18px 0 0; padding-top:16px; border-top:1px solid var(--line);
  font-size:var(--fs-body); font-weight:700; color:var(--brand);
  text-align:center; line-height:1.55 }
.ab-h{ margin:22px 0 10px; font-size:var(--fs-h2); font-weight:800 }

/* ══════════ ลายเซ็นเป็นรูปมาสคอตจริง ══════════
   ของเดิมวาดเป็น SVG เอง รอบนี้ใช้รูปที่เจ้าตัวทำมา — เป็นตัวเขาจริงๆ มากกว่า */
.sig-im{ display:block; width:64px; height:64px; border-radius:50%;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1) }
.sig:hover .sig-im, .sig.on .sig-im{ transform:translateY(-2px) scale(1.04) }

/* ══════════ เนื้อหาฉบับเต็ม ══════════
   ยาวสามพันคำ ระยะบรรทัดกับความกว้างจึงสำคัญกว่าหน้าอื่น
   จอคอมจำกัดความกว้างไว้ ไม่งั้นสายตาต้องกวาดข้ามจอทุกบรรทัด */
.ab-long{ max-width:64ch; margin-left:auto; margin-right:auto }
.ab-long p{ line-height:1.85 }
.ab-ul{ margin:10px 0 16px; padding-left:20px; color:var(--ink-2);
  font-size:var(--fs-body); line-height:1.8 }
.ab-ul li{ margin-bottom:6px }
.ab-ul li::marker{ color:var(--brand-300) }

/* ══════════ มุมช่วยเหลือบนหน้าแรก ══════════
   เล็ก เป็นมิตร และไม่แย่งความสนใจจาก "ต้องทำตอนนี้"
   จึงไม่มีเงา ไม่มีสีเข้ม ใช้พื้นอ่อนกับเส้นประจางๆ พอให้รู้ว่าเป็นอีกก้อนหนึ่ง */
.devbox{ padding:15px 16px; border-radius:var(--r-lg);
  background:var(--brand-50); border:1px dashed var(--brand-300) }
.dev-hd{ display:flex; align-items:flex-start; gap:11px }
.dev-logo{ width:30px; height:30px; flex:0 0 auto; border-radius:50%; display:block }
.dev-line{ margin:0; font-size:var(--fs-sec); color:var(--ink-2); line-height:1.55;
  min-width:0 }
.dev-act{ display:flex; gap:8px; margin-top:12px }
.dev-b{ flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 8px; border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface); color:var(--brand); font-size:var(--fs-sec); font-weight:600;
  cursor:pointer; min-width:0 }
.dev-b:hover{ border-color:var(--brand) }
.dev-b svg{ width:16px; height:16px; flex:0 0 auto }
.dev-b span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }

/* แถวขอบคุณ — ปุ่มเล็กกว่าหน้าเกี่ยวกับ เพราะที่นี่เป็นของแถม ไม่ใช่พระเอก */
.dev-cheer{ display:flex; align-items:center; flex-wrap:wrap; gap:7px 9px; margin-top:12px;
  padding-top:11px; border-top:1px dashed var(--brand-300) }
.dev-ct{ font-size:var(--fs-meta); color:var(--ink-3) }
.dev-row{ display:flex; gap:4px }
.dev-e{ position:relative; width:32px; height:32px; border-radius:9px; border:1px solid transparent;
  background:var(--surface); font-size:16px; line-height:1; cursor:pointer;
  display:grid; place-items:center; transition:transform .12s ease }
.dev-e:hover{ transform:translateY(-2px); border-color:var(--brand-300) }
.dev-e:active{ transform:scale(.9) }
.dev-e.given{ border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand) }
.dev-n{ margin-left:auto; font-size:var(--fs-meta); font-weight:700; color:var(--brand);
  font-variant-numeric:tabular-nums }

/* บนจอคอมมันไปนั่งตรงมุมขวาบนที่เคยว่างเปล่า — ตำแหน่งเดียวกับที่ว่างในภาพ */
@media(min-width:1000px){
  .home{
    grid-template-areas:
      'head help'
      'att  week'
      'news quick';
  }
  .home > .hz-help{ grid-area:help; margin:0 0 16px; align-self:start }
}


/* ══════════ พัสดุทั้งหมด ══════════ */
.srch{ display:flex; gap:8px }
.srch input{ flex:1; min-width:0; padding:11px 13px; border:1px solid var(--line);
  border-radius:var(--r); background:var(--surface); color:var(--ink);
  font-size:var(--fs-body); font-family:inherit }
.srch button{ flex:0 0 auto; width:46px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); color:var(--ink-2); display:grid; place-items:center; cursor:pointer }
.srch button:hover{ border-color:var(--brand); color:var(--brand) }
.srch button svg{ width:19px; height:19px }

/* เวลาที่รอ — ตัวเลขที่บอกอะไรได้มากที่สุดในแถว จึงให้มันอยู่คู่กับป้ายสถานะ */
.pwait{ margin-top:3px; font-size:var(--fs-meta); color:var(--ink-3);
  font-variant-numeric:tabular-nums; white-space:nowrap }
.pwait.late{ color:var(--danger); font-weight:700 }

.statbox{ margin:12px 0 0; padding:15px 16px; border:1px solid var(--line);
  border-radius:var(--r); background:var(--surface) }
.statbox h4{ margin:0 0 12px; font-size:var(--fs-sec); font-weight:700; color:var(--ink) }
.statnote{ margin:10px 0 0; font-size:var(--fs-meta); color:var(--ink-3); line-height:1.55 }

/* แท่งรายเดือน — หกแท่งเทียบกัน ไม่คุ้มที่จะโหลดไลบรารีกราฟมาวาด
   ตัวเลขอยู่บนหัวแท่งเสมอ เพราะแท่งบอกได้แค่ "มากกว่า/น้อยกว่า" ไม่ได้บอกว่าเท่าไร */
.bars{ display:flex; align-items:flex-end; gap:8px; height:104px }
.bar1{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center;
  justify-content:flex-end; height:100% }
.bv{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-2);
  font-variant-numeric:tabular-nums; margin-bottom:3px }
.bb{ width:100%; max-width:38px; min-height:3px; border-radius:4px 4px 0 0;
  background:var(--brand); display:block }
.bl{ margin-top:6px; font-size:var(--fs-meta); color:var(--ink-3); white-space:nowrap }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:6px 18px; margin:0; font-size:var(--fs-sec) }
.kv dt{ color:var(--ink-2) }
.kv dd{ margin:0; font-weight:700; color:var(--ink); text-align:right;
  font-variant-numeric:tabular-nums }

/* ของที่ค้างนานแค่ไหน — สีบอกความหนักเบา ตัวเลขบอกจำนวน */
.agrow{ display:flex; flex-wrap:wrap; gap:8px }
.ag{ flex:1 1 88px; padding:11px 10px; border-radius:var(--r-sm); text-align:center;
  background:var(--brand-50); border:1px solid transparent }
.ag.warn{ background:var(--warn-bg); border-color:#F0DCBB }
.ag.bad { background:var(--danger-bg); border-color:#F2CFCA }
.ag b{ display:block; font-size:19px; font-weight:700; color:var(--ink);
  font-variant-numeric:tabular-nums }
.ag span{ display:block; margin-top:2px; font-size:var(--fs-meta); color:var(--ink-2);
  line-height:1.3 }

.toplist{ margin:0; padding:0; list-style:none; counter-reset:tl }
.toplist li{ counter-increment:tl; display:flex; align-items:center; gap:10px;
  padding:8px 0; border-bottom:1px solid var(--line); font-size:var(--fs-sec) }
.toplist li:last-child{ border-bottom:0 }
.toplist li::before{ content:counter(tl); flex:0 0 auto; width:20px; height:20px;
  border-radius:50%; background:var(--bg); color:var(--ink-3); font-size:var(--fs-meta);
  font-weight:700; display:grid; place-items:center }
.toplist span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; color:var(--ink) }
.toplist b{ flex:0 0 auto; font-variant-numeric:tabular-nums; color:var(--ink-2) }

.pager{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-top:14px }
.pager .btn{ flex:0 0 auto; width:auto; padding:10px 14px; font-size:var(--fs-sec) }
.pager .btn:disabled{ opacity:.4; cursor:default }
.pager span{ font-size:var(--fs-meta); color:var(--ink-3); text-align:center;
  font-variant-numeric:tabular-nums }
.pager-n{ margin:12px 0 0; text-align:center; font-size:var(--fs-meta); color:var(--ink-3) }

/* ══════════ ทางเข้าระบบอื่นของคีนัน ══════════ */
.lk-foot{ margin:14px 0 0; font-size:var(--fs-meta); color:var(--ink-3); line-height:1.55 }
/* ตัวเลือกไอคอนตอนเพิ่มลิงก์ — ชุดปิด ไม่ให้อัปโหลดโลโก้เอง
   โลโก้ 12 อันคนละสไตล์ในหน้าเดียว รกกว่าช่วยให้หาเจอ */
.ikp{ display:flex; flex-wrap:wrap; gap:8px }
.ik{ width:46px; height:46px; border-radius:11px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-3); display:grid; place-items:center; cursor:pointer }
.ik svg{ width:21px; height:21px }
.ik:hover{ border-color:var(--brand); color:var(--brand) }
.ik.on{ border-color:var(--brand); background:var(--brand-50); color:var(--brand);
  box-shadow:inset 0 0 0 1px var(--brand) }

/* ══════════ เกี่ยวกับ Kenan ONE ══════════ */
.ab{ padding-bottom:26px }
.ab-hero{ text-align:center; padding:14px 0 22px }
.ab-hero h2{ margin:12px 0 5px; font-size:var(--fs-h1); font-weight:700; color:var(--ink) }
.ab-hero p{ margin:0 auto; max-width:34ch; font-size:var(--fs-sec); color:var(--ink-2);
  line-height:1.55 }
.ab-body p{ margin:0 0 11px; font-size:var(--fs-body); color:var(--ink-2); line-height:1.68 }
.ab-body p:last-child{ margin-bottom:0 }

.ab-facts{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin:20px 0 0;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden }
.ab-facts > div{ background:var(--surface); padding:13px 8px; text-align:center; min-width:0 }
/* ยอมให้ขึ้นบรรทัดที่สอง ดีกว่าตัดเป็น "AI Taskforc…" ซึ่งอ่านไม่ออกว่าคืออะไร */
.ab-facts b{ display:block; font-size:var(--fs-cta); font-weight:700; color:var(--ink);
  font-variant-numeric:tabular-nums; line-height:1.3; word-break:break-word }
.ab-facts span{ display:block; margin-top:2px; font-size:var(--fs-meta); color:var(--ink-3) }

/* ปุ่มขอบคุณ — บล็อกเดียวในหน้าที่ได้พื้นสี เพราะเป็นเหตุผลที่หน้านี้มีอยู่ */
.cheer{ margin-top:22px; padding:20px 16px; border-radius:var(--r-lg);
  background:var(--brand-50); border:1px solid var(--brand-300) }
.cheer h3{ margin:0; font-size:var(--fs-h2); font-weight:700; color:var(--ink); text-align:center }
.cheer-sub{ margin:6px auto 16px; max-width:36ch; text-align:center;
  font-size:var(--fs-sec); color:var(--ink-2); line-height:1.55 }
.cheer-row{ display:grid; grid-template-columns:repeat(5,1fr); gap:7px }
.ch{ position:relative; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:11px 3px 9px; border-radius:var(--r); border:1px solid transparent;
  background:var(--surface); cursor:pointer; min-height:82px; justify-content:center;
  transition:transform .12s ease, border-color .12s ease }
.ch:hover{ transform:translateY(-2px); border-color:var(--brand-300) }
.ch:active{ transform:scale(.95) }
.ch.given{ border-color:var(--brand); background:#fff;
  box-shadow:inset 0 0 0 1px var(--brand) }
.ch-e{ font-size:21px; line-height:1 }
.ch-n{ font-size:var(--fs-sec); font-weight:700; color:var(--brand);
  font-variant-numeric:tabular-nums; line-height:1.2 }
.ch-l{ font-size:10.5px; color:var(--ink-3); text-align:center; line-height:1.25 }
.cheer-note{ margin:12px 0 0; text-align:center; font-size:var(--fs-meta); color:var(--ink-3) }
@media(max-width:340px){ .cheer-row{ grid-template-columns:repeat(3,1fr) } }

.ch-burst{ position:absolute; top:2px; right:8px; font-size:15px; color:var(--brand);
  pointer-events:none; animation:chb .7s ease-out forwards }
@keyframes chb{
  0%   { opacity:0; transform:translateY(4px) scale(.6) }
  30%  { opacity:1; transform:translateY(-4px) scale(1.1) }
  100% { opacity:0; transform:translateY(-18px) scale(.9) }
}

/* ข้อความที่คนส่งเข้ามา — อ่านง่ายกว่าตารางเพราะเป็นเนื้อความ ไม่ใช่ข้อมูล */
.fbc{ padding:15px 16px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); margin-bottom:9px }
.fbc-h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:8px }
.fbc-k{ font-size:var(--fs-meta); font-weight:700; padding:2px 9px; border-radius:20px;
  background:var(--brand-50); color:var(--brand) }
.fbc-k.bug{ background:var(--danger-bg); color:var(--danger) }
.fbc-k.praise{ background:var(--ok-bg); color:var(--ok) }
.fbc-k.idea{ background:var(--warn-bg); color:var(--warn) }
.fbc-t{ font-size:var(--fs-meta); color:var(--ink-3); white-space:nowrap }
.fbc p{ margin:0; font-size:var(--fs-body); color:var(--ink); line-height:1.62;
  white-space:pre-wrap; word-break:break-word }
.fbc-w{ margin-top:9px; font-size:var(--fs-meta); color:var(--ink-3) }

/* ══════════ ผู้ดูแลแก้ข้อความแจ้งเตือน ══════════
   พรีวิวต้องเป็นฟองแชตจริงๆ ไม่ใช่กล่องข้อความธรรมดา
   เพราะสิ่งที่คนแก้ต้องตัดสินคือ "อ่านในไลน์แล้วเป็นยังไง" ไม่ใช่ "ในช่องนี้เป็นยังไง" */
.lchat{ background:#93A9BA; border-radius:12px; padding:14px 12px 18px }
.lbub{ background:#fff; color:#141B21; border-radius:4px 16px 16px 16px; padding:10px 13px;
  font-size:var(--fs-sec); line-height:1.58; word-break:break-word;
  box-shadow:0 1px 2px rgba(0,0,0,.13) }
.lbub b{ font-weight:700 }
.llink{ color:#1461B5; text-decoration:underline; word-break:break-all;
  font-size:var(--fs-meta) }

.vchips{ display:flex; flex-wrap:wrap; gap:6px }
.vchip{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-meta); font-weight:500;
  padding:4px 9px; border-radius:7px; border:1px solid var(--line);
  background:var(--surface); color:var(--brand); cursor:pointer }
.vchip:hover{ border-color:var(--brand); background:var(--brand-50) }

/* ══════════ แถบบอกขั้นตอน ══════════
   คนที่เพิ่งเปิดแอปครั้งแรกไม่รู้ว่าข้างหน้ายังเหลืออะไรอีก
   ถ้าไม่บอก เขาจะเดาว่ายาว แล้วปิดทิ้งกลางทาง
   แถบนี้จึงไม่ได้มีไว้สวย แต่มีไว้ตอบว่า "อีกนานไหม" */
.stpb{ margin:0 0 22px }
.stpl{ display:flex; align-items:flex-start; list-style:none; margin:0; padding:0 }
.stp{ flex:1; min-width:0; position:relative; text-align:center; padding-top:2px }
/* เส้นเชื่อมวาดจากจุดกึ่งกลางวงกลมของอันก่อนหน้า ไปกึ่งกลางของอันนี้ */
.stp::before{ content:''; position:absolute; top:12px; right:50%; width:100%; height:2px;
  background:var(--line) }
.stp:first-child::before{ display:none }
.stp.done::before, .stp.now::before{ background:var(--brand) }
.stpn{ position:relative; z-index:1; display:grid; place-items:center;
  width:26px; height:26px; margin:0 auto; border-radius:50%;
  background:var(--bg); border:2px solid var(--line); color:var(--ink-3);
  font-size:var(--fs-meta); font-weight:700; font-variant-numeric:tabular-nums }
.stp.done .stpn{ background:var(--brand); border-color:var(--brand); color:#fff }
.stp.now  .stpn{ background:var(--surface); border-color:var(--brand); color:var(--brand);
  box-shadow:0 0 0 4px var(--brand-50) }
.stpt{ display:block; margin-top:6px; padding:0 3px; font-size:var(--fs-meta);
  line-height:1.32; color:var(--ink-3) }
.stp.now .stpt{ color:var(--brand); font-weight:700 }
.stp.done .stpt{ color:var(--ink-2) }
.stpleft{ margin:13px 0 0; text-align:center; font-size:var(--fs-sec); color:var(--ink-2) }

/* ══════════ ปฏิทินรายเดือน ══════════
   มุมมองรายวันตอบได้แค่ "วันนี้ว่างไหม"
   แต่คำถามที่คนถามจริงคือ "เดือนนี้วันไหนยังว่าง" ซึ่งต้องเห็นทั้งเดือนพร้อมกัน
   บนจอแคบพื้นที่ต่อช่องเหลือ ~50px ใส่ตัวหนังสือไม่ได้ จึงเป็นจุด
   พอจอกว้างขึ้นค่อยเปลี่ยนเป็นแถบที่มีชื่อเรื่อง */
.mnav{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:0 0 12px }
.mnav h3{ margin:0; font-size:var(--fs-h2); font-weight:700; color:var(--ink) }
.mnav .mbtn{ width:38px; height:38px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); display:grid; place-items:center;
  cursor:pointer; font-size:16px; flex:0 0 auto }
.mnav .mbtn:hover{ border-color:var(--brand); color:var(--brand) }
.mnav .mtoday{ width:auto; padding:0 13px; font-size:var(--fs-sec); font-weight:700;
  color:var(--brand) }

.mgrid{ border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  background:var(--surface) }
.mdow{ display:grid; grid-template-columns:repeat(7,1fr); background:var(--bg);
  border-bottom:1px solid var(--line) }
.mdow span{ padding:7px 2px; text-align:center; font-size:var(--fs-meta); font-weight:700;
  color:var(--ink-3) }
.mdow span.we{ color:var(--danger) }
.mbody{ display:grid; grid-template-columns:repeat(7,1fr) }
.mc{ min-height:56px; padding:5px 3px 6px; border-right:1px solid var(--line);
  border-bottom:1px solid var(--line); background:var(--surface); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center }
.mc:nth-child(7n){ border-right:0 }
.mbody .mc:nth-last-child(-n+7){ border-bottom:0 }
.mc:hover{ background:var(--brand-50) }
.mc.out{ background:var(--bg) }
.mc.out .mcd{ color:var(--ink-3); opacity:.55 }
.mcd{ font-size:var(--fs-sec); font-weight:600; color:var(--ink);
  font-variant-numeric:tabular-nums; width:24px; height:24px; border-radius:50%;
  display:grid; place-items:center; flex:0 0 auto }
.mc.today .mcd{ background:var(--brand); color:#fff }
.mc.on{ box-shadow:inset 0 0 0 2px var(--brand) }
.mce{ display:flex; flex-wrap:wrap; justify-content:center; gap:3px; min-height:7px }
.mdot{ width:6px; height:6px; border-radius:50%; background:var(--brand); display:block }
.mdot.warn{ background:var(--warn) } .mdot.bad{ background:var(--danger) }
.mdot.mine{ background:var(--ok) }
.mmore{ font-size:9.5px; font-style:normal; color:var(--ink-3); font-weight:700;
  line-height:1 }
.mcl{ display:none }
@media(min-width:640px){
  .mc{ min-height:88px; align-items:stretch; padding:6px 5px 7px }
  .mcd{ margin:0 auto 0 0 }
  .mce{ display:none }
  .mcl{ display:flex; flex-direction:column; gap:2px; width:100%; overflow:hidden }
  .mbar{ font-style:normal; font-size:var(--fs-meta); line-height:1.35; text-align:left;
    padding:1px 5px; border-radius:4px; background:var(--brand-50); color:var(--brand);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600 }
  .mbar.warn{ background:var(--warn-bg); color:var(--warn) }
  .mbar.bad { background:var(--danger-bg); color:var(--danger) }
  .mbar.mine{ background:var(--ok-bg); color:var(--ok) }
  .mbar.more{ background:none; color:var(--ink-3); font-weight:400 }
}
.mlgd{ display:flex; flex-wrap:wrap; gap:12px; margin-top:11px;
  font-size:var(--fs-meta); color:var(--ink-3) }
.mlgd span{ display:inline-flex; align-items:center; gap:5px }

/* ══════════ หน้าอุปกรณ์แบบ "ของชิ้นนี้ทำอะไรได้" ══════════
   ของเดิมเป็นหน้าคุณสมบัติ: ยี่ห้อ รุ่น ซีเรียล ปีที่ซื้อ แล้วปุ่มอยู่ล่างสุด
   แต่คนที่สแกน QR คือคนที่ "ยืนอยู่หน้าเครื่อง" เขาเห็นยี่ห้อกับรุ่นอยู่แล้วด้วยตา
   สิ่งที่เขาไม่รู้คือ "ตอนนี้ว่างไหม" กับ "จะเอาไปใช้ยังไง" — สองอย่างนี้จึงขึ้นก่อน */
.obj{ padding-bottom:20px }
.obj-ph{ width:100%; height:190px; object-fit:cover; border-radius:var(--r-lg);
  background:var(--bg); display:block }
.obj h2{ margin:14px 0 3px; font-size:var(--fs-h1); font-weight:700; color:var(--ink);
  line-height:1.3 }
.obj-sub{ font-size:var(--fs-sec); color:var(--ink-3) }
.obj-sub code{ font-family:ui-monospace,monospace; letter-spacing:.05em }

/* บรรทัดสถานะ — บล็อกเดียวในหน้าที่ได้พื้นสี เพราะเป็นคำตอบของคำถามหลัก */
.obj-st{ display:flex; align-items:flex-start; gap:11px; margin:16px 0 0;
  padding:14px 15px; border-radius:var(--r); border:1px solid transparent }
.obj-st.free{ background:var(--ok-bg);     border-color:#BFE3D5 }
.obj-st.busy{ background:var(--warn-bg);   border-color:#F0DCBB }
.obj-st.late{ background:var(--danger-bg); border-color:#F2CFCA }
.obj-ic{ width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:grid;
  place-items:center; color:#fff }
.obj-ic svg{ width:15px; height:15px; display:block }
.obj-st.free .obj-ic{ background:var(--ok) }
.obj-st.busy .obj-ic{ background:var(--warn) }
.obj-st.late .obj-ic{ background:var(--danger) }
.obj-st b{ display:block; font-size:var(--fs-cta); line-height:1.42; color:var(--ink) }
.obj-st span{ display:block; margin-top:2px; font-size:var(--fs-sec); color:var(--ink-2);
  line-height:1.5 }

.obj-act{ display:flex; flex-direction:column; gap:9px; margin:15px 0 0 }
@media(min-width:520px){ .obj-act{ flex-direction:row } .obj-act .btn{ flex:1 } }

/* ข้อมูลเครื่องยังอยู่ แค่ไม่ได้อยู่ข้างหน้า — คนที่ต้องใช้จริง (IT ตอนซ่อม) เปิดหาได้ */
.obj-more{ margin-top:18px; border-top:1px solid var(--line); padding-top:6px }
.obj-more summary{ cursor:pointer; padding:9px 2px; font-size:var(--fs-sec);
