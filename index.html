  font-weight:600; color:var(--ink-2); width:fit-content }
.obj-more summary:hover{ color:var(--brand) }
.obj-more dl{ display:grid; grid-template-columns:auto 1fr; gap:7px 16px;
  margin:8px 0 4px; font-size:var(--fs-sec) }
.obj-more dt{ color:var(--ink-3) }
.obj-more dd{ margin:0; color:var(--ink) }
.obj-more dd.mono{ font-family:ui-monospace,monospace; letter-spacing:.04em }
.obj-lnk{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; margin-top:11px; padding:13px 15px; border:1px solid var(--line);
  border-radius:var(--r); background:var(--surface); cursor:pointer;
  font-size:var(--fs-sec); font-weight:700; color:var(--brand); text-align:left }
.obj-lnk:hover{ background:var(--brand-50) }
/* ไอคอนลูกศรใน .btn ถูกกำหนดขนาดไว้แล้ว แต่ปุ่มนี้ไม่ใช่ .btn
   ถ้าไม่กำหนดเอง SVG จะยืดเต็มความกว้างที่เหลือ กลายเป็นลูกศรยักษ์กลางจอ */
.obj-lnk svg{ width:18px; height:18px; flex:0 0 auto }
.obj-lnk span{ min-width:0 }

/* ══════════ ฟอร์มจองรถแบบถามทีละขั้น ══════════
   ของเดิมกางทุกช่องออกมาพร้อมกัน 5 การ์ด — รถ เวลา เหตุผล เส้นทาง ผู้โดยสาร
   ทั้งหมดนั้นคือสิ่งที่ "ระบบ" ต้องการ ไม่ใช่ลำดับที่ "คน" คิด
   คนคิดว่า: จะไปเมื่อไร ไปไหน ไปทำอะไร ไปกี่คน — สี่ข้อนี้ก่อน ที่เหลือค่อยว่ากัน */
.qz{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 15px; margin-bottom:11px }
.qz-q{ display:flex; align-items:baseline; gap:9px; margin:0 0 11px }
.qz-n{ width:22px; height:22px; flex:0 0 auto; border-radius:50%; background:var(--brand-50);
  color:var(--brand); display:grid; place-items:center; font-size:var(--fs-meta);
  font-weight:700; align-self:center }
.qz-q h4{ margin:0; font-size:var(--fs-cta); font-weight:700; color:var(--ink) }
.qz-hint{ font-size:var(--fs-meta); color:var(--ink-3); margin-top:8px; line-height:1.5 }

/* ตัวนับจำนวนคน — กดง่ายกว่าพิมพ์ตัวเลขบนมือถือ และไม่มีทางกรอกผิดรูปแบบ */
.cnt{ display:flex; align-items:center; gap:14px }
.cnt button{ width:46px; height:46px; flex:0 0 auto; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); color:var(--brand);
  font-size:22px; font-weight:700; cursor:pointer; display:grid; place-items:center }
.cnt button:hover:not(:disabled){ border-color:var(--brand); background:var(--brand-50) }
.cnt button:disabled{ color:var(--ink-3); opacity:.45; cursor:default }
.cnt .cntv{ font-size:26px; font-weight:700; color:var(--ink); min-width:56px;
  text-align:center; font-variant-numeric:tabular-nums }
.cnt .cntu{ font-size:var(--fs-sec); color:var(--ink-3) }

/* สรุปคำตอบขั้นที่ 1 ที่หัวขั้นที่ 2 — กดกลับไปแก้ได้โดยไม่ต้องเริ่มใหม่ */
.recap{ background:var(--brand-50); border:1px solid var(--brand-300); border-radius:var(--r);
  padding:13px 15px; margin-bottom:14px; width:100%; text-align:left; cursor:pointer }
.recap:hover{ background:#DDEEF6 }
.recap-h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:var(--fs-meta); font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--brand); margin-bottom:6px }
.recap dl{ display:grid; grid-template-columns:auto 1fr; gap:3px 14px; margin:0;
  font-size:var(--fs-sec) }
.recap dt{ color:var(--ink-2) }
.recap dd{ margin:0; color:var(--ink); font-weight:600; min-width:0;
  overflow:hidden; text-overflow:ellipsis }

/* ส่วนที่ไม่ใช่ทุกเที่ยวต้องใช้ — พับไว้ ไม่ได้ตัดทิ้ง */
.fold{ border:1px solid var(--line); border-radius:var(--r); background:var(--surface);
  margin-bottom:11px; overflow:hidden }
.fold > summary{ cursor:pointer; padding:15px; font-size:var(--fs-cta); font-weight:700;
  color:var(--ink); display:flex; align-items:center; justify-content:space-between; gap:10px }
.fold > summary::-webkit-details-marker{ display:none }
.fold > summary::after{ content:'▾'; color:var(--ink-3); font-size:13px; flex:0 0 auto }
.fold[open] > summary::after{ content:'▴' }
.fold > summary:hover{ background:var(--brand-50) }
.fold-b{ padding:0 15px 15px }
.fold-s{ display:block; font-size:var(--fs-meta); font-weight:400; color:var(--ink-3);
  margin-top:2px }
.fold > summary > span{ min-width:0 }

/* รถที่ที่นั่งไม่พอกับจำนวนคนที่กรอกไว้ ต้องเห็นตั้งแต่ก่อนเลือก ไม่ใช่ตอนกดจองแล้วเด้ง */
.vsmall{ font-size:var(--fs-meta); font-weight:700; color:var(--danger); margin-top:3px }

/* ══════════ หน้าแรกแบบห้องนักบิน + บริการทั้งหมด ══════════
   หลักที่ยึด: ไม่ใช่ทุกอย่างเป็นการ์ด
   ขอบ พื้น มุมมน เงา แต่ละอย่างแปลว่า "นี่คือของคนละชิ้น"
   ถ้าใส่ให้ทุกบล็อกเท่ากันหมด ลำดับความสำคัญจะหายไปทั้งหน้า
   ที่นี่จึงเหลือแค่โซน "ต้องทำตอนนี้" ที่ได้พื้นและแถบสี ส่วนอื่นใช้เส้นบางพอ */

.home{ padding-bottom:26px }

/* ── หัวหน้าแรก ── */
.hhead{ display:flex; align-items:center; gap:14px; padding:6px 0 20px }
.hhead-tx{ min-width:0 }
.hhead .hdate{ font-size:var(--fs-meta); font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-3) }
.hhead h2{ margin:3px 0 0; font-size:var(--fs-h1); font-weight:700; color:var(--ink) }

/* สัญลักษณ์สี่เส้นทะยานขึ้นจากโลโก้ — ใช้เป็นสำเนียง ไม่ใช่ของประดับ */
.kmark{ display:inline-flex; flex:0 0 auto }
.kmark svg{ width:30px; height:27px; display:block }
.kmark svg circle, .kmark svg rect{ fill:var(--brand) }
.hhead-logo{ width:38px; height:38px; border-radius:50%; display:block; flex:0 0 auto }
.ab-logo{ width:84px; height:84px; border-radius:50%; display:block; margin:0 auto }
.kmark.soft svg circle, .kmark.soft svg rect{ fill:var(--brand-300) }
.kmark.big svg{ width:58px; height:53px }

/* ── โซน ── */
.hz{ margin:0 0 26px }
.hz-h{ display:flex; align-items:center; gap:9px; margin:0 0 11px }
.hz-h h3{ margin:0; font-size:var(--fs-h2); font-weight:700; color:var(--ink) }
.hz-n{ min-width:21px; height:21px; padding:0 6px; border-radius:11px;
  background:var(--brand); color:#fff; font-size:var(--fs-meta); font-weight:700;
  display:grid; place-items:center; font-variant-numeric:tabular-nums }
.hz-more{ font-size:var(--fs-sec); color:var(--ink-3); padding:9px 2px 0 }

/* ── การ์ด "ต้องทำตอนนี้" — บล็อกเดียวในหน้าที่ได้พื้นและแถบสี ── */
.attn{ display:flex; flex-direction:column; gap:9px }
.atc{ display:flex; flex-direction:column; align-items:flex-start; gap:9px; width:100%; text-align:left;
  padding:15px 15px 15px 17px; border-radius:var(--r);
  background:var(--surface); border:1px solid var(--line);
  border-left:4px solid var(--brand); cursor:pointer;
  box-shadow:var(--shadow); transition:transform .12s ease, box-shadow .12s ease }
.atc:hover{ transform:translateY(-1px); box-shadow:var(--shadow-lg) }
.atc:active{ transform:none }
.atc.warn{ border-left-color:var(--warn); background:var(--warn-bg) }
.atc.bad { border-left-color:var(--danger); background:var(--danger-bg) }
.atc.info{ border-left-color:var(--brand); background:var(--brand-50) }
.atc-b{ flex:1; min-width:0 }
.atc-b h4{ margin:0; font-size:var(--fs-cta); font-weight:700; color:var(--ink); line-height:1.42 }
.atc-b p{ margin:4px 0 0; font-size:var(--fs-sec); color:var(--ink-2); line-height:1.5 }
.atc-b{ width:100% }
.atc-cta{ align-self:flex-end; display:inline-flex; align-items:center; gap:3px;
  font-size:var(--fs-sec); font-weight:700; color:var(--brand); white-space:nowrap }
.atc-cta svg{ width:15px; height:15px }
.atc.warn .atc-cta{ color:var(--warn) }
.atc.bad  .atc-cta{ color:var(--danger) }

/* ไม่มีอะไรค้าง — ต้องพูดออกมา ไม่ใช่ปล่อยว่างให้เดาว่าโหลดไม่ขึ้น */
.allclear{ display:flex; align-items:center; gap:13px; padding:16px 16px;
  border:1px dashed var(--line); border-radius:var(--r); background:var(--surface) }
.allclear .ac-ic{ width:34px; height:34px; border-radius:50%; flex:0 0 auto;
  background:var(--ok-bg); color:var(--ok); display:grid; place-items:center;
  font-size:17px; font-weight:800 }
.allclear b{ font-size:var(--fs-body); color:var(--ink) }
.allclear .ac-s{ font-size:var(--fs-sec); color:var(--ink-3); margin-top:2px }

/* ── สัปดาห์นี้ — รายการ ไม่ใช่กองการ์ด ── */
.wk-d{ margin-bottom:16px }
.wk-dh{ font-size:var(--fs-meta); font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-3); padding:0 0 6px }
.wk-i{ display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:11px 4px; border-bottom:1px solid var(--line); background:none; cursor:pointer }
.wk-d .wk-i:last-child{ border-bottom:0 }
.wk-i:hover{ background:var(--brand-50) }
.wk-t{ flex:0 0 auto; width:46px; font-size:var(--fs-sec); font-weight:700; color:var(--ink-2) }
.wk-x{ flex:1; min-width:0 }
.wk-n{ display:block; font-size:var(--fs-body); font-weight:600; color:var(--ink);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.wk-s{ display:block; font-size:var(--fs-meta); color:var(--ink-3); margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.wk-k{ flex:0 0 auto; width:30px; height:30px; border-radius:8px; display:grid; place-items:center }
.wk-k svg{ width:16px; height:16px }
.wk-k.room{ background:var(--brand-50); color:var(--brand) }
.wk-k.car { background:var(--warn-bg);  color:var(--warn) }

/* ── ทางลัด ── */
.qa{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px }
.qa-b{ display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:14px 5px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); cursor:pointer; min-height:82px; justify-content:center }
.qa-b:hover{ border-color:var(--brand); background:var(--brand-50) }
.qa-i{ color:var(--brand); display:grid; place-items:center }
.qa-i svg{ width:23px; height:23px }
.qa-l{ font-size:var(--fs-meta); font-weight:600; color:var(--ink-2); text-align:center;
  line-height:1.35 }
@media(max-width:359px){ .qa{ grid-template-columns:repeat(2,1fr) } }

.allsv{ display:flex; align-items:center; justify-content:space-between; width:100%;
  margin-top:10px; padding:13px 15px; border:1px solid var(--line); border-radius:var(--r);
  background:var(--surface); font-size:var(--fs-sec); font-weight:700; color:var(--brand);
  cursor:pointer }
.allsv:hover{ background:var(--brand-50) }
.allsv svg{ width:17px; height:17px }

/* ── หน้าบริการทั้งหมด ── */
.svl{ display:flex; flex-direction:column; border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; background:var(--surface) }
.svi{ display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:14px 15px; border-bottom:1px solid var(--line); background:none; cursor:pointer }
.svl .svi:last-child{ border-bottom:0 }
.svi:hover{ background:var(--brand-50) }
.svi-i{ flex:0 0 auto; width:38px; height:38px; border-radius:10px;
  background:var(--brand-50); color:var(--brand); display:grid; place-items:center }
.svi-i svg{ width:20px; height:20px }
@media (max-width:640px){
  .svl{ display:grid; grid-template-columns:1fr 1fr }
  .svl .svi{ flex-direction:column; align-items:flex-start; gap:8px; padding:14px 12px; border-right:1px solid var(--line) }
  .svl .svi:nth-child(2n){ border-right:0 }
  .svl .svi .go{ display:none }
  .svi-s{ white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }
}
.svi-x{ flex:1; min-width:0 }
.svi-n{ display:block; font-size:var(--fs-body); font-weight:600; color:var(--ink) }
.svi-s{ display:block; font-size:var(--fs-meta); color:var(--ink-3); margin-top:1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.svi-b{ flex:0 0 auto; min-width:21px; height:21px; padding:0 6px; border-radius:11px;
  background:var(--danger); color:#fff; font-size:var(--fs-meta); font-weight:700;
  display:grid; place-items:center }
.svi .go{ flex:0 0 auto; color:var(--ink-3) }
.svi .go svg{ width:17px; height:17px }

/* จอกว้าง: หน้าแรกอ่านสองคอลัมน์ได้ แต่ "ต้องทำตอนนี้" ต้องอยู่เต็มความกว้างเสมอ
   เพราะมันคือเหตุผลที่คนเปิดหน้านี้ */
@media(min-width:900px){
  .home .hz.split{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:26px }
  .qa{ grid-template-columns:repeat(4,1fr) }
  .svl{ max-width:none }
}

/* ══════════ การเข้าถึงและตัวอักษร ══════════
   สามอย่างนี้ไม่ได้ทำให้แอปสวยขึ้นเลย แต่ทำให้มันเป็นผลิตภัณฑ์ที่โตแล้ว
   1) ระยะบรรทัดของภาษาไทยต้องหลวมกว่าอังกฤษ เพราะมีสระบนสระล่าง
   2) คนที่ใช้คีย์บอร์ดต้องเห็นว่าโฟกัสอยู่ที่ปุ่มไหน
   3) คนที่ตั้งเครื่องว่าไม่เอาแอนิเมชัน ต้องได้ตามนั้นจริง            */
body{ line-height:var(--lh); font-size:var(--fs-body) }
h1,h2,h3,h4{ font-family:var(--font-head); line-height:1.32; text-wrap:balance }
.num,.tnum{ font-variant-numeric:tabular-nums }
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--brand); outline-offset:2px; border-radius:var(--r-sm);
}
:focus:not(:focus-visible){ outline:none }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important; animation-iteration-count:1!important;
    transition-duration:.01ms!important; scroll-behavior:auto!important;
  }
}

</style>
</head>

      <span data-nav="navSos">ฉุกเฉิน</span>

      <span data-nav="navMe">ฉัน</span>

  <button class="fab" id="fab" hidden>

<script>
/* ═══════════════════════════════════════════════════════════════
   KENAN ONE — Single Page App
   ทุกโมดูลอยู่ในไฟล์เดียว URL เดียว LIFF init ครั้งเดียว
   ═══════════════════════════════════════════════════════════════ */

/* ── 1. CONFIG — แก้แค่ตรงนี้ ─────────────────────────────────── */
const CFG = {
  LIFF_ID : '2010937586-Ko0ID2zY',                   // LIFF "Kenan ONE" (Full)
  GAS_URL : 'https://tjwhmgzlpqbeqvlihcxr.supabase.co/functions/v1/api',
  LIFF_TIMEOUT_MS : 3500,
  CONSENT_VERSION : '2026-09-01',

/** อ่านผ่านแคช: ข้อมูลที่ไม่ค่อยเปลี่ยนไม่ต้องยิงถาม Apps Script ซ้ำทุกครั้ง
    Apps Script ทำงานทีละคำขอ ยิ่งยิงถี่ยิ่งต่อคิวกันเองจนช้า */
async function cached(key, ttlMs, fn){
  const c = S.cache[key];
  if(c && Date.now() - c.at < ttlMs) return c.v;
  const v = await fn();
  S.cache[key] = { at:Date.now(), v };
  return v;
}
const clearCache = k => { if(k) delete S.cache[k]; else S.cache = {}; };
/** ข้อมูลหน้าแรกที่เซิร์ฟเวอร์แนบมากับ bootstrap — ใช้ได้ครั้งเดียวและต้องยังสด
    ไม่งั้นจะกลายเป็นข้อมูลค้างที่คนเข้าใจผิดว่ายังว่างอยู่ */
function takePre(key){
  const p = S.pre;
  if(!p || p.key !== key || Date.now() - p.at > 12000) return null;
  S.pre = null;
  return p.v;
}

/** วาดจากข้อมูลรอบก่อนทันที แล้วค่อยไปถามของใหม่มาวาดทับ
    Apps Script ตอบทีละคำขอและมีช่วงตื่นเครื่อง ยังไงก็มีหน่วงอยู่ดี
    แต่ตั้งแต่ครั้งที่สองเป็นต้นไป ผู้ใช้จะเห็นหน้าเต็มทันที ไม่ต้องนั่งมองโครงกระดูก */
async function swr(key, fetchFn, paint, maxAge = 0){
  const seq = RENDER_SEQ;
  const hit = S.cache[key];
  if(hit){
    try{ paint(hit.v, true); }catch(e){}
    // เพิ่งได้ข้อมูลชุดนี้มาสดๆ (เช่นแนบมากับ bootstrap) ไม่ต้องถามซ้ำ
    if(maxAge && Date.now() - hit.at < maxAge) return hit.v;
  }
  let v = null;
  try{ v = await fetchFn(); }catch(e){ if(!hit) throw e; return hit.v; }
  if(seq !== RENDER_SEQ) return v;      // ผู้ใช้เปลี่ยนหน้าไปแล้ว อย่าวาดทับหน้าใหม่
  S.cache[key] = { at:Date.now(), v };
  paint(v, false);
  return v;
}

    abReadLong:'Read the full version',
    abLongT:'How did ' + APP_NAME + ' start? (full version)',
    abLongLead:'The short version is on the About page. This is the whole story, for anyone who wants it.',
    abLong:[
      ['p', APP_NAME + ' did not start with the question “What can we use AI for?” It started with a much simpler one: “What are we spending time and energy on every day that a system could probably handle better?”'],
      ['p', 'Many of the things we deal with at work seem small when we look at them one at a time. Finding out whose parcel has arrived. Booking a car and coordinating with a driver. Borrowing equipment and trying to find out who currently has it. Looking for information. Checking the status of something already reported. Or simply trying to answer: “Who am I supposed to ask about this?”'],
      ['p', 'But these small things happen repeatedly. When there is no shared system to manage, track, or communicate them, the work gradually falls back onto a small number of people. Someone has to remember. Someone has to follow up. Someone has to answer the same question again. Someone has to connect information between different people and different channels.'],
      ['p', 'And that is not only a matter of lost time. When information is scattered and there is no single place to see the current status, it becomes easier for work to be duplicated, overlooked, misunderstood, or lost. Over time, small operational frictions can become recurring problems that affect the quality of work, the people responsible for it, and the way the organisation works as a whole.'],
      ['h', 'The principle'],
      ['p', 'That is why I started looking at these challenges through AI, automation, and process design. The principle is actually quite simple.'],
      ['ul', ['If a system can remember something for us — let it remember.',
              'If a system can send the notification — let it notify.',
              'If a user can complete something through self-service — make that possible.',
              'And keep people’s time and energy for the work that actually requires judgement, creativity, and human interaction.']],
      ['p', 'That became the starting point for ' + APP_NAME + '.'],
      ['p', 'I do not see ' + APP_NAME + ' as simply another internal website or another menu of tools. I want it to become a shared place for the small but important parts of our working day that should be easier than they currently are.'],
      ['ul', ['Parcels', 'Car booking', 'Equipment borrowing and returns', 'Emergency communication',
              'Issue reporting and follow-up', 'Staff information', 'Internal updates',
              'And, over time, other services connected into the same experience']],
      ['h', 'Where the journey began'],
      ['p', 'For me, ' + APP_NAME + ' is also one of the first practical demonstrations that AI transformation does not have to begin with an expensive, large-scale, or highly sophisticated project. Sometimes it starts by understanding a small, recurring problem well enough to build a better way around it.'],
      ['p', 'The journey began through the Kenan Academy project, which gave me the opportunity to develop work around AI Automation, AI Use Cases, and Powered Workplace Systems, and more importantly, to apply those ideas to real organisational challenges.'],
      ['p', 'That experience later connected to my work in AI Solutions & Implementation within the AI Taskforce, where one of the missions that matters most to me is making sure AI does not remain only in training sessions, presentations, or demonstrations. It should eventually become something where people can genuinely say: “This has made the way we work better.” ' + APP_NAME + ' is one of the first pieces of that journey.'],
      ['h', 'AI changes the economics of building internal systems'],
      ['p', 'If a system like ' + APP_NAME + ' were developed entirely through a conventional external development process, the organisation would not only be paying for coding. There would also be costs for process discovery, requirement gathering, UX/UI design, frontend and backend development, integrations, testing, debugging, deployment, and repeated iteration after real users begin trying the system. For a system with multiple workflows and continuous refinement, that development cost could reasonably reach hundreds of thousands of baht.'],
      ['p', 'AI does not mean that building a system has no cost. Someone still has to understand the problem, design the workflow, make decisions, test the system, identify risks, fix what does not work, and take responsibility for what eventually goes into real use.'],
      ['p', 'What AI changes is how much one person or a small team can do. Combined with tools that Kenan already has, AI lets us reduce external development costs, lower the cash investment required to test an idea, and iterate much more quickly based on real user feedback. Instead of making a large investment before knowing whether something works, we can build a practical version, let people use it, learn from the experience, and improve it continuously.'],
      ['h', 'This came from all of us'],
      ['p', 'And that brings me to probably the most important part of ' + APP_NAME + '. Although I have been the main person building the system, it has come from all of us — from the actual experiences of Kenan staff, and from the moments when someone felt that something could be easier.'],
      ['ul', ['Some features started from “Why does this take so many steps?”',
              'Some started from “Couldn’t we just click here and get it done?”',
              'And some started very simply, with someone walking over to say “P’, something about this part feels a bit strange.”']],
      ['p', 'A surprising number of the features you see in ' + APP_NAME + ' today have grown from conversations like these. And I hope it continues that way.'],
      ['h', 'A system only matters if we use it together'],
      ['p', 'Because ultimately, even the best system has little value if we do not use it together. One of the reasons work gets repeated, information gets missed, or people have to keep following things up is that our information and communication are still spread across different places. When different people use different channels, it becomes difficult for everyone to see the same status at the same time.'],
      ['p', APP_NAME + ' can help most when it gradually becomes a shared way of working for all of us. That does not mean the system has to be perfect today. In fact, the opposite is true. I want everyone to try it and tell us directly:'],
      ['ul', ['What works.', 'What is confusing.', 'What is unnecessary.', 'What still takes too much time.']],
      ['p', 'That feedback is not just feedback about a website. It is input into how we can design a better way of working together at Kenan.'],
      ['p', 'So if there is something in your day-to-day work that still makes you think “Why are we still doing it this way?” — send it in. That might become the next use case we improve together.'],
      ['p', APP_NAME + ' is therefore not simply a system I want to finish building. I see it as the beginning of a way of working that I hope we can continue shaping together:'],
      ['ul', ['Let systems take care of unnecessary coordination.',
              'Let information reach the right people more easily.',
              'Give people back more of their time and energy.',
              'And use technology to help us create more impact without simply asking everyone to work harder.']]
    ],
    abStoryT:'How did ' + APP_NAME + ' start?',
    abStory:[
      APP_NAME + ' started with the small things we deal with every day. On their own they may not seem like major problems. But when the same issues happen again and again without a clear system to manage, track, or communicate them, small tasks start piling up on a few people. That creates more room for human error, takes up time and attention, and over time can turn small frustrations into recurring operational problems.',
      'It could be something as simple as finding out whose parcel has arrived, booking a car, borrowing equipment, looking for information, checking the status of something you reported, or just trying to figure out: “Who am I supposed to ask about this?”',
      'That made me start looking at these everyday challenges through the lens of AI, automation, and better process design — asking where technology could take over the things we currently have to chase, ask about, remember, or coordinate manually.',
      APP_NAME + ' is one of the first use cases where I had the opportunity to turn that idea into something people can actually use. I am grateful to the Kenan Academy project for the chance to develop work around AI Automation, AI Use Cases, and Powered Workplace Systems — experience that led to my role in AI Solutions & Implementation within the AI Taskforce, where an important part of the mission is turning AI into practical use cases that change how we work.',
      'Although I have been the main person building the system, ' + APP_NAME + ' has come from all of us. It comes from the real experiences of Kenan colleagues, from moments when someone thought, “Surely this could be easier,” and from ideas shared by people who simply want to make our workplace better.',
      'There is another side to this story as well. If a system like this were developed entirely through an external team — process analysis, UX/UI design, software development, integration, testing and iteration — the cost could reasonably reach hundreds of thousands of baht. Using AI together with tools Kenan already has lets us experiment, improve, and build new use cases much faster and for far less.',
      'But ultimately, even the best system has little value if we do not use it together. When information is spread across different channels, the same questions and follow-ups keep happening, and important details can easily be missed.',
      'So please try ' + APP_NAME + ' and tell us honestly what works, what is confusing, what still wastes your time — or even just “there must be a better way to do this.” Send it in. It might become the next thing we build together.'
    ],

/* คำที่ยาวกว่าต้องถูกแทนก่อน ไม่งั้น "วราภรณ์" จะไปกินคำว่า "วราภรณ์ ทองดี" */
const DEMO_EN_KEYS = Object.keys(DEMO_EN).sort((a, b) => b.length - a.length);
const TH_RE = /[\u0E00-\u0E7F]/;

function demoEnStr(v){
  if(DEMO_EN[v] !== undefined) return DEMO_EN[v];     // ตรงทั้งก้อนก่อน
  if(!TH_RE.test(v)) return v;                         // ไม่มีอักษรไทย ไม่ต้องยุ่ง
  let out = v;                                         // ที่เหลือค่อยไล่แทนทีละคำ
  for(const k of DEMO_EN_KEYS) if(out.includes(k)) out = out.split(k).join(DEMO_EN[k]);
  return out;
}

/** วิ่งลึกทั้งก้อนแล้วคืนของใหม่ — ห้ามแก้ MOCK เพราะมันถูกใช้ซ้ำทุกคำขอ */
function demoEn(v){
  if(typeof v === 'string') return demoEnStr(v);
  if(Array.isArray(v)) return v.map(demoEn);
  if(v && typeof v === 'object'){
    const o = {};
    for(const k of Object.keys(v)) o[k] = demoEn(v[k]);
    return o;
  }
  return v;
}

/** ข้อมูลที่ถูกอ่านตอนบูต (หน้าแรก ข่าว โปรไฟล์) ไม่ได้ผ่าน api()
    จึงต้องหยิบมาแปลใหม่ตอนสลับภาษา ไม่งั้นหน้าแรกจะค้างเป็นไทยอยู่หน้าเดียว */
/** ข้อความบนแถบพรีวิว — เปลี่ยนภาษาตามปุ่ม TH/EN เหมือนทุกอย่างในหน้า */
function demoBanner(){
  return S.lang === 'en'
    ? 'Preview mode · sample data' + (DEMO_DRIVER ? ' · driver view' : '')
    : 'โหมดพรีวิว · ข้อมูลตัวอย่าง' + (DEMO_DRIVER ? ' · มุมคนขับ' : '');
}
function demoSwitch(toDriver){
  if(S.lang === 'en') return toDriver ? 'Driver view →' : '← Staff view';
  return toDriver ? 'มุมคนขับ →' : '← มุมพนักงาน';
}

function demoRelang(){
  if(!DEMO) return;
  const a = MOCK.bootstrap || MOCK.getAuthState;
  const src = (S.lang === 'en') ? demoEn(a) : a;
  S.me = src.user; S.today = src.today || null; S.bootNews = src.announcements || null;
  if(S.driver){
    const d = MOCK.driverPortal;
    const dv = (S.lang === 'en') ? demoEn(d) : d;
    S.driver = dv.driver; S.drvJobs = dv.jobs || [];
    S.drvVeh = dv.vehicles || []; S.drvReports = dv.reports || [];
  }
  /* แถบพรีวิวถูกวาดครั้งเดียวตอนบูต จึงต้องมาแก้ข้อความเองตอนสลับภาษา */
  const bt = document.getElementById('dmTx');
  if(bt) bt.textContent = demoBanner();
  const bs = document.getElementById('dmStaff');
  if(bs) bs.textContent = demoSwitch(false);
  const bd = document.getElementById('dmDrv');
  if(bd) bd.textContent = demoSwitch(true);
  clearCache();
}

             { resource_id:'RM-3', name_th:'ห้อง Focus', capacity:4, category:'ห้องเล็ก', note:'' }],
      bookings:[
        { record_id:'RB-1', resource_id:'RM-1', title:'ประชุมทีม WING ประจำสัปดาห์',
          start_at:k+'T09:00:00+07:00', end_at:k+'T11:00:00+07:00',
          requester_id:'K-1180', who:'สมชาย ก.', who_dept:'Education', who_email:'somchai@kenan-asia.org' },
        { record_id:'RB-2', resource_id:'RM-2', title:'สัมภาษณ์ผู้สมัคร',
          start_at:k+'T13:30:00+07:00', end_at:k+'T15:00:00+07:00',
          requester_id:'K-4920', who:'พิพัฒน์ ส.', who_dept:'Social Impact and Innovation' }] };
    /* มุมมองรายเดือนขอ 42 วัน — กระจายการจองให้ทั้งเดือน ไม่งั้นพรีวิวจะเห็นจุดวันเดียว */
    const spread = (base, pre) => {
      const out = Object.assign({}, base, { bookings: base.bookings.slice() });
      const D = new Date();
      [2,4,5,8,9,11,15,16,18,22,23,25,29].forEach((off, ix) => {
        const dd = new Date(D); dd.setDate(D.getDate() + off - 8);
        const kk = `${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
        const h = 9 + (ix % 6);
        out.bookings.push({ record_id: pre + ix,
          resource_id: base.rooms[ix % base.rooms.length].resource_id,
          title: ['ประชุมทีมประจำสัปดาห์','อบรม MSME','สัมภาษณ์ผู้สมัคร','เวิร์กช็อป M&E'][ix % 4],
          start_at: `${kk}T${String(h).padStart(2,'0')}:00:00+07:00`,
          end_at:   `${kk}T${String(h + 2).padStart(2,'0')}:00:00+07:00`,
          requester_id: ix % 3 === 0 ? 'K-4920' : 'K-1180',
          who: ix % 3 === 0 ? 'พิพัฒน์ ส.' : 'สมชาย ก.' });
      });
      return out;
    };
    return q => {
      const base = (q && q.kind === 'zoom') ? zoom : rooms;
      return (q && Number(q.days || 1) > 7) ? spread(base, 'RBX') : base;
    };
  })(),

  driverJobAct:(q => {
    /* ในโหมดพรีวิว กดปุ่มแล้วต้องเห็นสถานะเปลี่ยนจริง ไม่งั้นเวลาพรีเซน

    const J = MOCK.driverPortal.jobs;
    const j = J.find(x => x.record_id === q.record_id);
    if(!j) return { ok:false, error:'NOT_FOUND' };
    const now = new Date().toISOString();
    if(q.act === 'depart'){ j.status = 'in_use'; j.started_at = now; j.odo_out = q.odo || ''; }
    else if(q.act === 'return'){ j.status = 'returned'; j.finished_at = now; j.odo_in = q.odo || ''; }
    else if(q.act === 'stop'){
      j.stop_log = (j.stop_log || []).concat([{ i:Number(q.stop_index) || 0, at:now }]);
    }else if(q.act === 'cancel'){
      const kill = q.reason === 'pax_cancel';
      if(kill) j.status = 'cancelled'; else { j.status = 'requested'; j.driver_id = ''; }
      return { ok:true, killed:kill };
    }
    return { ok:true };
  }),

async function api(action, payload = {}, method = 'GET'){
  if(DEMO){
    await new Promise(r => setTimeout(r, 260));       // จำลองดีเลย์จริง จะได้เห็น skeleton
    const v = MOCK[action];
    const r = (typeof v === 'function' ? v(payload) : v) ?? { ok:true };
    // สลับเป็น EN แล้วข้อมูลตัวอย่างต้องเป็นอังกฤษด้วย ไม่ใช่เมนูอังกฤษบนข้อมูลไทย
    return (S.lang === 'en') ? demoEn(r) : r;
  }
  if(!CFG.GAS_URL || CFG.GAS_URL.startsWith('PASTE_')) throw new Error('NO_CONFIG');
  const t0 = performance.now();
  const base = CFG.GAS_URL;
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tm = ac ? setTimeout(() => ac.abort(), 20000) : null;
  let res;
  if(method === 'GET'){
    const q = new URLSearchParams({ action, uid:S.uid||'', idt:__idt(), _t:Date.now(), ...payload });
    res = await fetch(`${base}?${q}`, { method:'GET', redirect:'follow', cache:'no-store',
                                        signal: ac ? ac.signal : undefined });
  }else{
    // text/plain = simple request → ไม่มี CORS preflight ที่ Apps Script ตอบไม่ได้
    res = await fetch(base, {
      method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, uid:S.uid, idt:__idt(), ...payload }),
      signal: ac ? ac.signal : undefined
    });
  }
  if(tm) clearTimeout(tm);
  const text = await res.text();
  try {
    const j = JSON.parse(text);
    if(j && (j.error === 'AUTH_EXPIRED' || j.error === 'AUTH_REQUIRED')){ try{ if(window.liff){ liff.logout(); liff.login(); } }catch(_){} }
    // เก็บเวลาไว้ 12 รายการหลังสุด เอาไว้ดูว่าช้าที่เครือข่าย ที่ Apps Script หรือที่ชีท
    S.timings.unshift({ a:action, net:Math.round(performance.now()-t0),
                        srv:j?.ms ?? null, db:j?.dbMs ?? null });
    S.timings.length = Math.min(S.timings.length, 12);
    return j;
  }
  catch(e){
    // Apps Script คืน HTML แทน JSON ได้ในบางจังหวะ (cold start / หน้า redirect ของ Google)
    const err = new Error('BAD_RESPONSE');
    err.snippet = text.slice(0, 120);
    throw err;
  }
}

/* Apps Script ตื่นจากหลับ (cold start) ใช้เวลาได้หลายวินาที และบางครั้งคืน HTML
   → ลองซ้ำแบบถอยหลังเพิ่มทีละเท่า ก่อนจะยอมแพ้ */
async function apiRetry(action, payload, method, tries = 3){
  let last;
  for(let i = 0; i <= tries; i++){
    try{ return await api(action, payload, method); }
    catch(e){
      last = e;
      if(e.message === 'NO_CONFIG' || i === tries) break;
      await new Promise(r => setTimeout(r, 600 * Math.pow(2, i)));   // 0.6s → 1.2s → 2.4s
    }
  }
  throw last;
}

const ROUTES = {};
/* ผูกการเปลี่ยนหน้าเข้ากับประวัติเบราว์เซอร์
   ไม่ทำแบบนี้ ปุ่มย้อนกลับของมือถือจะเด้งออกจากแอปทันทีตั้งแต่หน้าแรก */
function go(name, params = {}, replace = false){
  if(typeof closePanel === 'function') closePanel();
  if(replace){
    if(S.stack.length) S.stack[S.stack.length - 1] = { name, params };
    else S.stack.push({ name, params });
    try{ history.replaceState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }else{
    S.stack.push({ name, params });
    try{ history.pushState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }
  render(name, params);
}
function back(){
  if(S.stack.length > 1){ try{ history.back(); return; }catch(e){} }
  S.stack = []; go('home', {}, true);
}
window.addEventListener('popstate', () => {
  if(S.stack.length > 1){
    S.stack.pop();
    const prev = S.stack[S.stack.length - 1];
    render(prev.name, prev.params);
  }else{
    // อยู่หน้าแรกแล้วกดย้อนกลับ = ตั้งใจจะออกจริง ปล่อยให้ออกได้ตามปกติ
    render('home', {});
  }
});
$('#backBtn').onclick = back;
document.querySelectorAll('#langTop button').forEach(b => b.onclick = () => {
  if(S.lang === b.dataset.l) return;
  S.lang = b.dataset.l;

  demoRelang();
  paintNav();
  const cur = S.stack[S.stack.length - 1];
  render(cur?.name || 'home', cur?.params || {});
});

function chrome(name){
  if(S.driverMode){
    // หน้าที่คนขับเข้าได้มีเท่านี้ นอกจากนี้พาไปหน้างานของเขาแทน

  }

  const isFull = ['register','otp','consent','gate','offline'].includes(name);
  $('#backBtn').hidden = isHome || isFull;
  // จอคอมมีเมนูข้างที่มีโลโก้อยู่แล้ว แถบบนจึงควรบอก "อยู่หน้าไหน" ทุกหน้า รวมหน้าแรก

  $('#fab').hidden = !S.isOfficer ||
                     !['my-parcels','unidentified','admin'].includes(name);

    b.classList.toggle('on', b.dataset.go === name || (name === 'parcel-in' && b.dataset.go === 'my-parcels')));

let RENDER_SEQ = 0;
async function render(name, params){
  const seq = ++RENDER_SEQ;
  /* ลิงก์เก่าหรือปุ่มย้อนกลับพาคนขับไปหน้าพนักงานได้ — พาเขากลับมาหน้าของเขา
     เซิร์ฟเวอร์ปฏิเสธอยู่แล้ว แต่หน้าจอ error ไม่ได้ช่วยให้เขาทำงานต่อได้ */
  if(S.driverMode && !['driver-portal','driver-me','driver-report','driver-pair','offline','gate'].includes(name)){
    name = 'driver-portal'; params = {};
  }
  chrome(name);
  const fn = ROUTES[name] || ROUTES.home;
  $x('#main').innerHTML = `<div class="view">${skeleton(2)}</div>`;
  try{ await fn(params); }
  catch(e){
    if(seq !== RENDER_SEQ) return;   // ผู้ใช้เปลี่ยนหน้าไปแล้ว ไม่ต้องขึ้น error ของหน้าเก่า
    if(e.message === 'NO_CONFIG'){
      $x('#main').innerHTML = `<div class="view"><div class="note">${IC.info}<div><b>${t('noConfig')}</b><br>${t('noConfigBody')}</div></div></div>`;
    }else{
      errorScreen(e, () => render(name, params));
    }
  }
}

/** หน้าจอเวลาเชื่อมต่อไม่ได้ — ลองใหม่ได้ตรงนี้โดยไม่ต้องรีโหลดทั้งแอป
    และมีปุ่มทดสอบการเชื่อมต่อ เอาไว้ส่งข้อความ error ให้คนแก้ดู */
function errorScreen(e, retryFn){
  $x('#main').innerHTML = `<div class="view">
    <div class="empty">${IC.info}<h3>${esc(t('netErr'))}</h3><p>${esc(t('netErrHint'))}</p></div>
    <button class="btn primary" id="rt">${esc(t('retry'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="dg">${esc(t('diag'))}</button>
    <pre id="dgOut" hidden style="margin-top:12px;padding:11px;background:var(--surface);
      border:1px solid var(--line);border-radius:12px;font-size:var(--fs-meta);
      white-space:pre-wrap;word-break:break-all;color:var(--ink-2)"></pre>
  </div>`;
  $('#rt').onclick = () => (retryFn ? retryFn() : location.reload());
  $('#dg').onclick = async () => {
    const box = $('#dgOut'); box.hidden = false; box.textContent = t('loading');
    let out = 'error: ' + (e?.message || e) + (e?.snippet ? '\nsnippet: ' + e.snippet : '') + '\n';
    out += 'uid: ' + (S.uid ? S.uid.slice(0,8) + '…' : '(none)') + '\n';
    out += 'liff: ' + (S.liffReady ? 'ok' : 'no') + '\n';
    // net = เวลารวมที่รอ · srv = เวลาที่ Apps Script ใช้จริง · db = เวลาอ่าน Google Sheet
    // net สูงแต่ srv ต่ำ = เสียเวลาไปกับการปลุกเครื่อง ไม่ใช่โค้ดเรา
    out += 'timings (net/srv/db ms):\n' + S.timings.map(x =>
      '  ' + x.a + ' ' + x.net + '/' + (x.srv ?? '-') + '/' + (x.db ?? '-')).join('\n') + '\n';
    try{
      const r = await api('ping', {}, 'GET');
      out += 'ping: ' + JSON.stringify(r);
    }catch(err){
      out += 'ping FAILED: ' + (err?.message || err) + (err?.snippet ? '\n' + err.snippet : '');
    }
    box.textContent = out;
  };
}

   เตือนล่วงหน้า 60 วัน เพื่อให้มีเวลาไปต่ออายุ */
function licWarn(exp){
  if(!exp) return '';
  const days = Math.floor((Date.parse(exp) - Date.now()) / 86400000);
  if(isNaN(days) || days > 60) return '';
  const bad = days < 0;
  return `<div style="font-size:var(--fs-meta);font-weight:800;margin-top:2px;color:${
    bad ? 'var(--bad)' : 'var(--warn)'}">${esc(bad ? t('licExpired') : t('licSoon')(days))}</div>`;
}

/* หัวข้อของวัน — คนอ่าน "วันนี้/พรุ่งนี้" เร็วกว่าอ่านวันที่ */
function dayLabel(key){
  const today = dayKey(new Date());
  const tmr   = dayKey(new Date(Date.now() + 86400000));
  if(key === today) return t('dayToday');
  if(key === tmr)   return t('dayTomorrow');
  return new Date(key + 'T00:00:00+07:00').toLocaleDateString(
    S.lang === 'th' ? 'th-TH' : 'en-GB', { weekday:'short', day:'numeric', month:'short' });
}

/** ลายเซ็น — ใช้ในหน้าเกี่ยวกับ ตรงหัวบล็อกให้กำลังใจ */
function sigBlock(){
  return `<button class="sig" id="sigBtn" type="button" aria-label="${esc(t('sigWho'))}">
    <img class="sig-im" src="${SIG_ART}" alt="" width="64" height="64">
    <span class="sig-h" aria-hidden="true"></span>
    <span class="sig-t" role="status">${esc(t('sigWho'))}</span>
  </button>`;
}

/** บนจอคอมชี้เมาส์ก็ขึ้นเอง (CSS) · บนมือถือไม่มี hover จึงต้องแตะ
    แตะแล้วโชว์สามวินาทีแล้วหายเอง จะได้ไม่ต้องมีปุ่มปิด */
function wireSig(){
  const b = $('#sigBtn'); if(!b) return;
  let tm = null;
  b.onclick = () => {
    b.classList.add('on');
    clearTimeout(tm);
    tm = setTimeout(() => b.classList.remove('on'), 3000);
  };
}



/* ══════════════════════════════════════════════════════════════════
 *  เกี่ยวกับ Kenan ONE — ฉบับเต็ม
 *
 *  หน้าเกี่ยวกับมีฉบับย่อพอให้อ่านจบในลิฟต์ ส่วนที่มาทั้งหมดยาวกว่านั้นมาก
 *  ยัดทั้งสองอย่างไว้หน้าเดียวจะได้ผลแย่ทั้งคู่ — คนรีบก็เลื่อนผ่าน
 *  คนอยากอ่านก็ต้องหาเอาเองว่าเนื้อหาจริงเริ่มตรงไหน จึงแยกเป็นสองหน้า
 * ══════════════════════════════════════════════════════════════════ */
ROUTES['about-long'] = async () => {
  setTitle(t('abLongT'));
  const blocks = t('abLong').map(b =>
      b[0] === 'h'  ? `<h3 class="ab-h">${esc(b[1])}</h3>`
    : b[0] === 'ul' ? `<ul class="ab-ul">${b[1].map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    :                 `<p>${esc(b[1])}</p>`).join('');

  $x('#main').innerHTML = `<div class="view">
    <header class="ab-hero">
      <img class="ab-logo" src="${LOGO_URI}" alt="" width="84" height="84">
      <h2>${esc(t('abLongT'))}</h2>
      <p>${esc(t('abLongLead'))}</p>
    </header>
    <div class="ab-body ab-long">
      ${blocks}
      <p class="ab-close">${esc(t('abClose'))}</p>
    </div>
    <div style="height:16px"></div>
    <button class="btn primary" id="alFb">${esc(t('meReport'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="alBack">${esc(t('abTitle'))}</button>
  </div>`;
  $('#alFb').onclick   = () => go('about', { act:'feedback' });
  $('#alBack').onclick = () => go('about');
};


ROUTES['other-systems'] = async () => {
  setTitle(t('svOther'));
  $x('#main').innerHTML = `<div class="view">
    <p class="ab-body" style="margin:0 0 4px">${esc(t('lkWhy2'))}</p>
    <div id="svOther">${skeleton(3)}</div>
  </div>`;
  await paintOtherSystems();
};

function wireDevBox(){
  document.querySelectorAll('[data-dgo]').forEach(b => b.onclick = () =>
    b.dataset.dgo === 'help' ? go('help') : go('about', { act:'feedback' }));

  /* ยอดกำลังใจไม่ใช่ข้อมูลที่ต้องรีบรู้ จึงโหลดหลังหน้าแรกวาดเสร็จ
     ถ้าเรียกไม่ได้ก็ซ่อนไปเงียบๆ หน้าแรกต้องไม่พังเพราะของประดับ */
  (async () => {
    let a = null;
    try{ a = await apiRetry('getAbout', {}, 'GET'); }catch(e){ return; }
    if(!a?.ok) return;
    const box = $('#devCheer'); if(!box) return;
    box.hidden = false;
    const paint = () => { const n = $('#devN'); if(n) n.textContent = a.total ? a.total : ''; };

    document.querySelectorAll('#devCheer .dev-e').forEach(b => {
      if(a.mine?.[b.dataset.dk]) b.classList.add('given');

/* ────────────────────────────────────────────────────────────────
 *  แผงอ่านด้านข้าง
 *
 *  แผ่นเลื่อนขึ้นจากล่าง (sheet) เหมาะกับการ "ตัดสินใจสั้นๆ" — เลือก ยืนยัน ปิด
 *  แต่ไม่เหมาะกับการอ่านยาว เพราะบนจอคอมมันบังทั้งหน้าเพื่อแสดงข้อความสองย่อหน้า
 *  ตรงนี้จึงเป็นคนละตัว: บนจอคอมเลื่อนเข้ามาจากขวาและอยู่ข้างๆ รายการเดิม
 *  บนมือถือเปิดเต็มจอ เพราะจอแคบไม่มีที่ให้วางสองอย่างข้างกัน
 * ──────────────────────────────────────────────────────────────── */
let _pnPrev = null;

function panel(html, title){
  const p = $('#panel');
  $x('#pnTitle').textContent = title || '';
  $x('#pnBody').innerHTML = html;
  p.classList.add('on');
  $('#pnScrim').classList.add('on');
  document.body.classList.add('pn-open');
  _pnPrev = document.activeElement;
  p.setAttribute('aria-hidden', 'false');
  setTimeout(() => { const c = $('#pnClose'); if(c) c.focus(); }, 30);
}

function closePanel(){
  const p = $('#panel');
  if(!p.classList.contains('on')) return;
  p.classList.remove('on');
  p.setAttribute('aria-hidden', 'true');
  $('#pnScrim').classList.remove('on');
  document.body.classList.remove('pn-open');
  try{ _pnPrev?.focus(); }catch(e){}
  _pnPrev = null;
}

/* รูปในประกาศ กดแล้วต้องดูเต็มได้ — บนจอคอมรูปย่อขนาด 4:3 อ่านตัวหนังสือในภาพไม่ออก
   ประกาศ HR ส่วนใหญ่คือภาพที่มีตัวหนังสือ ถ้าซูมไม่ได้ก็เท่ากับไม่ได้ประกาศ */
function wireZoom(scope){
  (scope || document).querySelectorAll('.imgcell img').forEach(im => {
    im.style.cursor = 'zoom-in';
    im.onclick = () => {
      if(!im.src) return;
      const z = $('#zoom');
      $x('#zoomImg').src = im.src;
      z.classList.add('on');
    };
  });
}

 *  4) ไม่มีที่ให้ใส่ผู้ติดต่อกรณีฉุกเฉินเลย ทั้งที่เป็นเหตุผลหนึ่งที่ทำทำเนียบ

/** MM-DD (+ปี) → ค่าที่ <input type="date"> รับได้ */
function bdToISO(mmdd, yr){
  const p = String(mmdd || '').split('-');
  if(p.length !== 2 || !p[0] || !p[1]) return '';
  const y = /^\d{4}$/.test(String(yr)) ? String(yr) : String(BD_NOYEAR);
  return `${y}-${('0' + p[0]).slice(-2)}-${('0' + p[1]).slice(-2)}`;
}

  </div>`;

  let psrc = src;
  const drawPrev = () => {
    const u = psrc === 'line' ? linePic
            : psrc === 'own'  ? (pimg.v?.card || m.photo || '') : '';
    $x('#pPrev').innerHTML = u
      ? `<img src="${esc(u)}" alt="" class="prev-im">`
      : `<span class="prev-im prev-tx">${esc(String(m.nickname || m.name_th || '·').trim().charAt(0))}</span>`;
    $('#pOwn').hidden = psrc !== 'own';
  };
  drawPrev();
  document.querySelectorAll('#pSrc button').forEach(b => b.onclick = () => {
    psrc = b.dataset.src;
    document.querySelectorAll('#pSrc button').forEach(x => x.classList.toggle('on', x === b));
    drawPrev();
  });
  const phIn = $('#pPh'); if(phIn) phIn.addEventListener('change', () => setTimeout(drawPrev, 400));

  if(act === 'emg') setTimeout(() => {
    const e = $('#emgTop'); if(!e) return;
    e.scrollIntoView({ block:'start',
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    $('#eName').focus();
  }, 160);

  $('#pSave').onclick = async () => {
    const en = $('#eName').value.trim(), ep = $('#ePhone').value.trim();
    const okN = !!en, okP = /^[0-9+][0-9\-\s]{5,}$/.test(ep);
    $('#eNameE').hidden = okN; $('#ePhoneE').hidden = okP;
    if(!okN || !okP){
      $('#emgTop').scrollIntoView({ block:'start',
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
      toast(t('prEmgNeed'), 'bad');
      return;
    }

    /* ช่องวันที่ให้ค่ามาเป็น YYYY-MM-DD แต่เซิร์ฟเวอร์รับ วัน-เดือน
       แปลงตรงนี้ที่เดียว จะได้ไม่ต้องไปแก้กติกาฝั่งเซิร์ฟเวอร์ที่ของเดิมใช้อยู่ */
    const iso = $('#pBd').value;
    const keepYr = $('#pShowYr').checked;
    const bdOut = iso ? `${iso.slice(8, 10)}-${iso.slice(5, 7)}` : '';
    const yrOut = (iso && keepYr && Number(iso.slice(0, 4)) !== BD_NOYEAR) ? iso.slice(0, 4) : '';

    const b = $('#pSave'); b.disabled = true;
    try{
      await apiRetry('updateMyProfile',
        { phone:$('#pPhone').value.trim(), position:$('#pPos').value.trim(),
          emp_code:$('#pEmp').value.trim(),
          birthday:bdOut, birth_year:yrOut,
          show_birthday:$('#pShowBd').checked ? 'true' : 'false',
          show_birth_year:keepYr ? 'true' : 'false',
          photo_src:psrc,
          photo:pimg.v?.full || '', card:pimg.v?.card || '',
          emg_name:en, emg_phone:ep, emg_relation:$('#eRel').value,
          show_phone:$('#pShow').checked ? 'true' : 'false' }, 'POST');

      S.me = S.me || {};
      Object.assign(S.me, {
        phone:$('#pPhone').value.trim(), position:$('#pPos').value.trim(),
        emp_code:$('#pEmp').value.trim(), show_phone:$('#pShow').checked,
        birthday:bdOut, birth_year:yrOut, photo_src:psrc,
        show_birthday:$('#pShowBd').checked, show_birth_year:keepYr,
        emg_name:en, emg_phone:ep, emg_relation:$('#eRel').value
      });
      if(pimg.v?.card) S.me.photo = pimg.v.card;
      clearCache('dir'); clearCache('emp');
      toast(t('prSaved'), 'ok');
      go('profile', {}, true);
    }catch(e){ toast(t('netErr'), 'bad'); }
    b.disabled = false;
  };
};

/** วันนี้แบบ YYYY-MM-DD ตามเวลาไทย — ใช้เป็นเพดานของช่องวันเกิด */
function todayISO(){
  const p = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Bangkok',
    year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
  return p;
}

ROUTES['admin-devline'] = async () => {
  setTitle(t('dlTitle'));
  if(!S.isSuper){
    $x('#main').innerHTML = `<div class="view" style="padding-top:36px">
      ${emptyState(IC.info, t('adminNo'), t('adminNoBody'))}</div>`;
    return;
  }
  $x('#main').innerHTML = `<div class="view"><div id="dw">${skeleton(3)}</div></div>`;

  let rows = [];
  try{ const r = await apiRetry('getDevLines', {}, 'GET'); rows = r?.items || []; }catch(e){}
  /* ยังไม่เคยแก้ = แผ่นว่าง → เอาชุดที่อยู่ในโค้ดมาตั้งต้นให้ ไม่ใช่ให้เริ่มจากศูนย์

  if(!rows.length){
    const th = t('devLines'), en = T.en.devLines || th;
    rows = th.map((x, i) => ({ text_th:x, text_en:en[i] || '' }));
  }

  const draw = () => {
    $x('#dl2').innerHTML = rows.map((r, i) => `
      <div class="dlrow">
        <div class="dlno">${i + 1}</div>
        <div class="dlf">
          <textarea data-i="${i}" data-f="th" rows="2" maxlength="220"
            placeholder="${esc(t('dlPhTh'))}">${esc(r.text_th || '')}</textarea>
          <textarea data-i="${i}" data-f="en" rows="2" maxlength="220"
            placeholder="${esc(t('dlPhEn'))}">${esc(r.text_en || '')}</textarea>
        </div>
        <button class="dlx" data-x="${i}" aria-label="${esc(t('dlDel'))}">✕</button>
      </div>`).join('');
    document.querySelectorAll('#dl2 textarea').forEach(a => a.oninput = () => {
      rows[Number(a.dataset.i)][a.dataset.f === 'th' ? 'text_th' : 'text_en'] = a.value;
      drawPrev();
    });
    document.querySelectorAll('#dl2 .dlx').forEach(b => b.onclick = () => {
      if(rows.length <= 1){ toast(t('dlNeedOne'), 'bad'); return; }
      rows.splice(Number(b.dataset.x), 1); draw();
    });
    drawPrev();
  };

  /* ตัวอย่างจริงบนพื้นเดียวกับหน้าแรก — ประโยคที่อ่านดีในช่องแก้ไข
     อาจยาวเกินสามบรรทัดตอนไปอยู่ในกล่องจริง */
  const drawPrev = () => {
    const d = new Date();
    const ix = (d.getFullYear() * 366 + d.getMonth() * 31 + d.getDate()) % Math.max(rows.length, 1);
    const line = (S.lang === 'th' ? rows[ix]?.text_th : rows[ix]?.text_en) || rows[ix]?.text_th || '';
    $x('#dlPrev').innerHTML = `<div class="devbox" style="pointer-events:none">
      <div class="dev-hd">
        <img class="dev-logo" src="${LOGO_URI}" alt="" width="30" height="30">
        <p class="dev-line">${esc(line)}</p>
      </div></div>`;
  };

  $x('#dw').innerHTML = `
    <div class="note info">${IC.info}<div>${esc(t('dlWhy'))}</div></div>
    <div class="section-title">${esc(t('dlPreview'))}</div>
    <div id="dlPrev"></div>
    <div class="section-title">${esc(t('dlLines'))}</div>
    <div id="dl2"></div>
    <button class="btn ghost" id="dlAdd" style="margin-top:10px">＋ ${esc(t('dlAdd'))}</button>
    <div class="sticky-cta"><button class="btn primary" id="dlSave">${esc(t('prSave'))}</button></div>`;
  draw();

  $('#dlAdd').onclick = () => {
    if(rows.length >= 30){ toast(t('dlMax'), 'bad'); return; }
    rows.push({ text_th:'', text_en:'' }); draw();
    const all = document.querySelectorAll('#dl2 textarea');
    all[all.length - 2]?.focus();
  };

  $('#dlSave').onclick = async () => {
    const keep = rows.filter(r => (r.text_th || '').trim() || (r.text_en || '').trim());
    if(!keep.length){ toast(t('dlNeedOne'), 'bad'); return; }
    const b = $('#dlSave'); b.disabled = true;
    try{
      const r = await apiRetry('saveDevLines', { lines: JSON.stringify(keep) }, 'POST');
      if(r?.ok === false) throw 0;
      S.devLines = keep;
      toast(t('prSaved'), 'ok'); go('home', {}, true);
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };
};

          <div class="field"><label>${esc(t('emgWhat'))}</label>
            <textarea id="hNote" rows="2" placeholder="${esc(t('emgWhatPh'))}"></textarea></div>
          <button class="btn danger" id="hGo" style="background:var(--bad);color:#fff">${esc(t('emgSend'))}</button>
          <button class="btn ghost" id="hX">${esc(t('cancel'))}</button>`);
        $('#hX').onclick = closeSheet;
        $('#hGo').onclick = async () => {
          const loc = $('#hLoc').value.trim(), note = $('#hNote').value.trim();
          closeSheet();
          try{ await apiRetry('respondAlert',
                { alert_id:A.alert.alert_id, status:'help', location:loc, note }, 'POST');
               toast(t('emgSent'), 'ok'); go('calltree', {}, true); }
          catch(e){ toast(t('netErr'), 'bad'); }
        };
      };
    };
    wireSafe(); wireHelp();

    /* เปลี่ยนคำตอบได้ตลอด — สถานการณ์ฉุกเฉินเปลี่ยนได้ในสิบนาที
       คนที่ตอบ "ปลอดภัย" ตอนแรกแล้วสถานการณ์แย่ลง ต้องขอความช่วยเหลือได้ */
    if($('#bAgain')) $('#bAgain').onclick = () => {
      $x('#alertBox').querySelector('.note')?.remove();
      $('#bAgain').outerHTML = askBtns;
      wireSafe(); wireHelp();
    };
    if($('#bBoard')) $('#bBoard').onclick = () => go('alert-board');

  }else if(A?.canDeclare){
    $x('#alertBox').innerHTML =
      `<button class="btn ghost" id="dec" style="margin-bottom:14px">${esc(t('emgDeclare'))}</button>`;
    $('#dec').onclick = declareSheet;
  }

  let items = [];
  try{ const r = await apiRetry('getContacts', {}, 'GET'); items = r?.items || []; }catch(e){}
  if(!items.length){
    // ค่าตั้งต้นสำหรับกรณีที่ยังไม่ได้ใส่ในชีท — เบอร์ฉุกเฉินสาธารณะของไทย
    items = [
      { group:'external', name_th:'เหตุฉุกเฉินแห่งชาติ', name_en:'National Emergency', phone:'191' },
      { group:'external', name_th:'การแพทย์ฉุกเฉิน',    name_en:'Emergency Medical',   phone:'1669' },
      { group:'external', name_th:'ดับเพลิง',            name_en:'Fire',                phone:'199' }
    ];
  }
  const groups = [
    { k:'external', label:t('ctExternal'), sos:true },
    { k:'internal', label:t('ctInternal') },
    { k:'lead',     label:t('ctLead') }
  ];
  $x('#list').innerHTML = groups.map(g => {
    const rows = items.filter(i => (i.group || 'internal') === g.k);
    if(!rows.length) return '';
    return `<div class="contact-group"><h3>${esc(g.label)}</h3><div class="rows">${rows.map(c => `
      <div class="row">
        <div class="body">
          <div class="t">${esc(S.lang === 'th' ? (c.name_th || c.name_en) : (c.name_en || c.name_th))}</div>
          <div class="s num">${esc(c.phone)}</div>
        </div>
        <a class="callbtn ${g.sos ? 'sos' : ''}" href="tel:${esc(c.phone)}" aria-label="${esc(t('ctCall'))}">${IC.phone}</a>
      </div>`).join('')}</div></div>`;
  }).join('') + (S.isAdmin
    ? `<div style="height:14px"></div>
       <button class="btn ghost" id="ctMan">${esc(t('admContacts'))}</button>` : '');
  if($('#ctMan')) $('#ctMan').onclick = () => go('admin-contacts');
};


/* ── กระดานเหตุฉุกเฉิน ────────────────────────────────────────
   เรียงตามสิ่งที่ต้องทำต่อ ไม่ใช่ตามตัวอักษร:
   ยังไม่มีใครไปถึง → กำลังไปหา → ช่วยแล้ว → ยังไม่ตอบ → ปลอดภัย        */
ROUTES['alert-board'] = async () => {
  setTitle(t('emgBoard'));
  $x('#main').innerHTML = `<div class="view"><div id="bd">${skeleton(3)}</div></div>`;
  let b = null;
  try{ b = await apiRetry('getAlertBoard', {}, 'GET'); }catch(e){}
  if(!b?.ok){ $x('#bd').innerHTML = emptyState(IC.info, t('adminNo'), t('adminNoBody')); return; }
  if(!b.active){ $x('#bd').innerHTML = emptyState(IC.bellBig, t('emgClosed'), ''); return; }

  const helping = b.helping || [], helped = b.helped || [];
  const answered = b.safe.length + b.help.length + helping.length + helped.length;

  /* ปุ่มในแถวคือสิ่งที่ทำให้กระดานนี้ต่างจากรายชื่อเฉยๆ
     คนดูแลต้องกดได้ตรงนั้นว่า "ฉันรับเรื่องนี้" โดยไม่ต้องออกไปหน้าอื่น */
  const row = (r, kind) => `
    <div class="row emgrow ${esc(kind)}">
      <span class="av ${kind === 'help' ? 'no' : ''}">${
        esc(String(r.nickname || r.name || '?').trim().charAt(0))}</span>
      <div class="body">
        <div class="t">${esc(r.name)}${r.nickname ? ' · ' + esc(r.nickname) : ''}</div>
        <div class="s">${esc([r.dept, r.location, r.note].filter(Boolean).join(' · ') || '—')}</div>
        ${r.helper ? `<div class="emgby">${esc(kind === 'helped'
          ? t('emgByHelped')(r.helper, r.helped_at ? fmtDate(r.helped_at) : '')
          : t('emgByHelping')(r.helper))}</div>` : ''}
        ${r.emg ? `<button class="emgc" data-emg="${esc(r.id)}">${esc(t('emgKin'))}</button>` : ''}
      </div>
      <div class="emgacts">
        ${r.phone ? `<a class="mini call" href="tel:${esc(r.phone)}" aria-label="${esc(t('ctCall'))}">📞</a>` : ''}
        ${b.canHelp && kind === 'help'
          ? `<button class="mini go" data-mk="helping" data-u="${esc(r.id)}">${esc(t('emgTake'))}</button>` : ''}
        ${b.canHelp && kind === 'helping'
          ? `<button class="mini ok" data-mk="helped" data-u="${esc(r.id)}">${esc(t('emgDone'))}</button>` : ''}
        ${b.canHelp && kind === 'helped'
          ? `<button class="mini" data-mk="help" data-u="${esc(r.id)}">${esc(t('emgReopen'))}</button>` : ''}
      </div>
    </div>`;

  const sec = (title, rows, kind, tone) => rows.length ? `
    <div class="section-title" ${tone ? `style="color:${tone}"` : ''}>${esc(title)} · ${rows.length}</div>
    <div class="rows">${rows.map(r => row(r, kind)).join('')}</div>` : '';

  $x('#bd').innerHTML = `
    <div class="card" style="border-color:var(--bad,#DC2626)">
      <div style="font-size:var(--fs-meta);font-weight:800;color:var(--bad,#DC2626)">${esc(fmtDate(b.alert.at))}</div>
      <h3 style="margin:5px 0 0;font-size:17px">${esc(b.alert.title)}</h3>
    </div>
    <div class="tiles" style="margin-top:12px">
      <div class="tile" style="min-height:76px;background:var(--bad-bg);border-color:var(--bad-line)">
        <div class="nm" style="font-size:25px;color:var(--bad)">${b.help.length}</div>
        <div class="en">${esc(t('emgHelpN'))}</div></div>
      <div class="tile" style="min-height:76px;background:var(--warn-bg);border-color:var(--warn-line)">
        <div class="nm" style="font-size:25px;color:var(--warn)">${b.none.length}</div>
        <div class="en">${esc(t('emgNone'))}</div></div>
      <div class="tile" style="min-height:76px;background:var(--ok-bg);border-color:var(--ok-line)">
        <div class="nm" style="font-size:25px;color:var(--ok)">${b.safe.length + helped.length}</div>
        <div class="en">${esc(t('emgSafeN'))}</div></div>
      <div class="tile" style="min-height:76px">
        <div class="nm" style="font-size:25px">${answered}/${b.total}</div>
        <div class="en">${esc(t('emgTotal'))}</div></div>
    </div>
    ${sec(t('emgHelpN'),  b.help,  'help',    'var(--bad)')}
    ${sec(t('emgHelping'), helping, 'helping', 'var(--warn)')}
    ${sec(t('emgNone'),   b.none,  'none',    'var(--warn)')}
    ${sec(t('emgHelped'), helped,  'helped',  'var(--ok)')}
    ${sec(t('emgSafeN'),  b.safe,  'safe',    '')}
    ${b.canClose ? `<div style="margin-top:16px"><button class="btn ghost" id="cls">${esc(t('emgClose'))}</button></div>` : ''}`;

  /* ผู้ติดต่อกรณีฉุกเฉินไม่ขึ้นเอง ต้องกดเปิดทีละคน
     เป็นข้อมูลของบุคคลที่สามที่พนักงานให้ไว้ ไม่ควรอยู่ในสายตาตอนเลื่อนดูเฉยๆ */
  const all = [...b.help, ...helping, ...helped, ...b.none, ...b.safe];
  document.querySelectorAll('#bd [data-emg]').forEach(x => x.onclick = () => {
    const p = all.find(r => String(r.id) === x.dataset.emg);
    if(!p?.emg) return;
    x.outerHTML = `<div class="emgkin">
      <b>${esc(t('emgKin'))}</b> ${esc(p.emg.name)}${p.emg.relation ? ' · ' + esc(p.emg.relation) : ''}<br>
      <a href="tel:${esc(p.emg.phone)}">${esc(t('ctCall'))} ${esc(p.emg.phone)}</a></div>`;
  });

  document.querySelectorAll('#bd [data-mk]').forEach(x => x.onclick = async () => {
    x.disabled = true;
    try{
      const r = await apiRetry('helpUpdate',
        { alert_id:b.alert.alert_id, user_id:x.dataset.u, state:x.dataset.mk }, 'POST');
      if(r?.ok === false) throw 0;
      toast(t('emgMarked'), 'ok'); go('alert-board', {}, true);
    }catch(e){ toast(t('netErr'), 'bad'); x.disabled = false; }
  });

  if($('#cls')) $('#cls').onclick = async () => {
    if(b.help.length || helping.length){
      if(!window.confirm(t('emgCloseAsk'))) return;
    }
    try{ await apiRetry('closeAlert', { alert_id:b.alert.alert_id }, 'POST');
         toast(t('emgClosed'), 'ok'); go('alert-board', {}, true); }
    catch(e){ toast(t('netErr'), 'bad'); }
  };
};


ROUTES.search = async ({ kw } = {}) => {
  setTitle(t('schTitle'));
  const q0 = String(kw || '');
  $x('#main').innerHTML = `<div class="view">
    <div class="srch">
      <input id="sq" value="${esc(q0)}" placeholder="${esc(t('schPh2'))}"
        inputmode="search" enterkeyhint="search" autocomplete="off">
      <button id="sqx" aria-label="${esc(t('schClear'))}">✕</button>
    </div>
    <p class="schhint" id="sqHint">${esc(t('schHint'))}</p>
    <div id="sqOut"></div>
  </div>`;

  const inp = $('#sq');
  setTimeout(() => inp.focus(), 120);
  $('#sqx').onclick = () => { inp.value = ''; inp.focus(); paint(''); };

  let seq = 0;
  const paint = async v => {
    const kwl = v.trim().toLowerCase();
    const mine = ++seq;
    $x('#sqHint').hidden = !!kwl;

    if(kwl.length < 2){ $x('#sqOut').innerHTML = ''; return; }

    /* ── 1. เมนู: ค้นในเครื่อง ขึ้นทันทีไม่ต้องรอเน็ต ── */
    const svc = [];
    SERVICE_GROUPS().forEach(gr => gr.items.forEach(i => {
      if((i.label + ' ' + (i.sub || '') + ' ' + (i.kw || '')).toLowerCase().includes(kwl))
        svc.push(i);
    }));

    const sec = (title, body) => body
      ? `<div class="hz-h" style="margin-top:18px"><h3>${esc(title)}</h3></div>${body}` : '';

    $x('#sqOut').innerHTML =
      sec(t('schSvc'), svc.length ? `<div class="svl">${svc.slice(0, 6).map(svRow).join('')}</div>` : '') +
      `<div id="sqSrv" class="schwait">${esc(t('schLooking'))}</div>`;
    document.querySelectorAll('#sqOut .svl [data-go]').forEach(b =>
      b.onclick = () => go(b.dataset.go));

    /* ── 2. ของฉัน + คน + ระบบอื่น: ถามเซิร์ฟเวอร์ครั้งเดียว ── */
    let r = null;
    try{ r = await apiRetry('oneSearch', { kw:kwl }, 'GET'); }catch(e){}
    if(mine !== seq) return;                 // พิมพ์ต่อไปแล้ว ผลชุดนี้ตกรุ่น ทิ้งไป
    if(!r?.ok){ $x('#sqSrv').textContent = t('netErr'); return; }

    const ST = { arrived:t('prcS_wait'), notified:t('prcS_wait'), claimed:t('prcS_done'),
                 closed:t('prcS_done'), reserved:t('eqReserved'), issued:t('eqOut'),
                 approved:t('assigned'), assigned:t('assigned'), in_use:t('mnOut') };

    const recs = r.records.length ? `<div class="rows">${r.records.map(x => `
      <button class="row" data-rgo="${esc(x.go)}" data-rec="${esc(x.record_id)}">
        <div class="thumb">${x.type === 'car' ? IC.car : x.type === 'room' ? IC.cal
          : x.type === 'borrow' ? IC.laptop : x.type === 'issue' ? IC.tool : IC.box}</div>
        <div class="body">
          <div class="t">${esc(x.title || '—')}</div>
          <div class="s">${esc([x.where, x.at ? fmtDate(x.at) : ''].filter(Boolean).join(' · '))}</div>
        </div>
        <span class="pill ${x.open ? 'wait' : 'done'}">${esc(ST[x.status] || x.status)}</span>
      </button>`).join('')}</div>` : '';

    const ppl = r.people.length ? `<div class="rows">${r.people.map(p => `
      <div class="row schp">
        <span class="av2">${esc((p.name || '?').trim().charAt(0))}</span>
        <div class="body">
          <div class="t">${esc(p.name)}${p.nickname ? ` <span class="nick">(${esc(p.nickname)})</span>` : ''}</div>
          <div class="s">${esc([p.position, p.dept].filter(Boolean).join(' · '))}</div>
          <div class="schc">
            ${p.phone ? `<a href="tel:${esc(p.phone)}">${IC.phone}${esc(p.phone)}</a>` : ''}
            ${p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ''}
          </div>
        </div>
      </div>`).join('')}</div>` : '';

    const lks = r.links.length ? `<div class="svl">${r.links.map(l => `
      <button class="svi" data-url="${esc(l.url)}">
        <span class="svi-i">${LKIC[l.icon] || LKIC.link}</span>
        <span class="svi-x"><span class="svi-n">${esc(
          S.lang === 'th' ? l.title_th : (l.title_en || l.title_th))}</span>
          <span class="svi-s">${esc(S.lang === 'th' ? l.note_th : (l.note_en || l.note_th))}</span></span>
        <span class="go">${IC.ext}</span>
      </button>`).join('')}</div>` : '';

    const body = sec(t('schMine'), recs) + sec(t('schPeople'), ppl) + sec(t('svOther'), lks);
    $x('#sqSrv').outerHTML = body || (svc.length ? '' :
      `<div style="padding:26px 0">${emptyState(IC.search, t('schNone'), t('schNoneBody')(v.trim()))}</div>`);

    document.querySelectorAll('#sqOut [data-rgo]').forEach(b => b.onclick = () => {
      const dest = b.dataset.rgo || '';
      if(dest) go(dest, ['my-parcels', 'issues'].includes(dest) ? { rec:b.dataset.rec } : {});
    });
    document.querySelectorAll('#sqOut [data-url]').forEach(b =>
      b.onclick = () => openExternal(b.dataset.url));
  };

  /* หน่วง 300 มิลลิวินาทีก่อนถามเซิร์ฟเวอร์
     ถ้ายิงทุกตัวอักษร พิมพ์ "ประชุม" = ยิงหกครั้ง แล้วผลชุดแรกจะมาทับชุดหลัง */
  let timer;
  inp.oninput = () => { clearTimeout(timer); timer = setTimeout(() => paint(inp.value), 300); };
  inp.onkeydown = e => { if(e.key === 'Enter'){ clearTimeout(timer); paint(inp.value); } };
  if(q0) paint(q0);
};

 *  ศูนย์แจ้งเตือน

 *  ของเดิมเรียงตามเวลาอย่างเดียว ทุกอันหน้าตาเท่ากันหมด
 *  "พัสดุมาถึงแล้ว" (ต้องลุกไปทำ) กับ "การจองได้รับอนุมัติ" (รู้ไว้เฉยๆ)
 *  จึงอยู่ปนกัน แล้วเรื่องที่ต้องทำก็จมอยู่กลางกองเรื่องที่ไม่ต้องทำ

ROUTES.notifications = async () => {
  setTitle(t('notifTitle'));
  $x('#main').innerHTML = `<div class="view"><div id="list">${skeleton(3)}</div></div>`;
  let items = [];
  try{ const r = await apiRetry('getNotifications', {}, 'GET'); items = r?.items || []; }catch(e){}

  if(!items.length){
    $x('#list').innerHTML = emptyState(IC.bellBig, t('notifEmpty'), '');
    S.notifCount = 0; $x('#bellDot').hidden = true;
    return;
  }

  /* กริยาต่อเหตุการณ์ — ไม่มีในตาราง ค่อยใช้คำกลาง
     เขียนไว้ที่เดียว จะได้ไม่ต้องไล่แก้ทั้งฝั่งเซิร์ฟเวอร์และฝั่งแอปเวลาเพิ่มเหตุการณ์ */
  const nfCta = n => (t('nfCtas') || {})[String(n.event)] || t('nfOpen');

  const B = [
    { k:'action', l:t('nfAction'), s:t('nfActionSub') },
    { k:'update', l:t('nfUpdate'), s:'' },
    { k:'info',   l:t('nfInfo'),   s:'' }
  ];
  const row = n => `
    <button class="nrow ${esc(n.bucket || 'update')}" ${n.go
      ? `data-rec="${esc(n.record_id || '')}" data-go="${esc(n.go)}"` : ''}>
      <span class="ndotm" aria-hidden="true"></span>
      <span class="nbody">
        <span class="nt">${esc(evLabel(n))}</span>
        <span class="ns">${esc(fmtDate(n.at))}</span>
      </span>
      ${n.go ? `<span class="ncta">${esc(nfCta(n))} ${IC.chev}</span>` : ''}
    </button>`;

  $x('#list').innerHTML = B.map(b => {
    const rows = items.filter(n => (n.bucket || 'update') === b.k);
    if(!rows.length) return '';
    return `<div class="nsec">
      <div class="nsec-h"><h3>${esc(b.l)}</h3>
        ${b.k === 'action' ? `<span class="hz-n">${rows.length}</span>` : ''}</div>
      ${b.s ? `<p class="nsec-s">${esc(b.s)}</p>` : ''}
      <div class="nlist">${rows.map(row).join('')}</div>
    </div>`;
  }).join('');

  document.querySelectorAll('#list .nrow[data-go]').forEach(b => b.onclick = () => {
    const dest = b.dataset.go || 'my-parcels';
    const rec  = b.dataset.rec || '';
    go(dest, (rec && ['my-parcels', 'issues', 'issue-queue'].includes(dest)) ? { rec } : {});
  });
  S.notifCount = 0; $x('#bellDot').hidden = true;
};

/** เปิดลิงก์นอกระบบ — ใน LIFF ต้องบอกให้เปิดเบราว์เซอร์จริง
    ไม่งั้นมันจะเปิดในหน้าต่างของ LINE แล้วผู้ใช้กลับเข้า Kenan ONE ไม่ได้ */
function openExternal(url){
  if(!/^https:\/\//i.test(String(url || ''))) return;
  try{
    if(S.liffReady && typeof liff?.openWindow === 'function'){
      liff.openWindow({ url, external:true }); return;
    }
  }catch(e){}
  window.open(url, '_blank', 'noopener');
}

async function paintOtherSystems(){

  sheet(`<h3>${esc(x ? t('lkEdit') : t('lkAdd'))}</h3>
    <div class="field"><label>${esc(t('lkTitle'))}<span class="req">*</span></label>

      <input id="kTe" value="${esc(v.title_en || '')}"></div>

    <div class="field"><label>${esc(t('lkNote'))}</label>
      <input id="kN" value="${esc(v.note_th || '')}" placeholder="${esc(t('lkNotePh'))}"></div>

        .map(c => `<option value="${c}">`).join('')}</datalist></div>
    <div class="field"><label>${esc(t('lkIcon'))}</label>
      <div class="ikp" id="kI">${LKIC_LIST.map(k => `
        <button type="button" class="ik ${v.icon === k ? 'on' : ''}" data-i="${k}"
          aria-label="${k}">${LKIC[k]}</button>`).join('')}</div></div>
    <div class="field"><label>${esc(t('lkWho'))}</label>
      <select id="kR">
        <option value="" ${!v.roles ? 'selected' : ''}>${esc(t('lkWhoAll'))}</option>
        <option value="officer" ${v.roles === 'officer' ? 'selected' : ''}>${esc(t('lkWhoOfficer'))}</option>

    ${x ? `<button class="btn ghost" id="kD" style="color:var(--danger)">${esc(t('lkHide'))}</button>` : ''}
    <button class="btn ghost" id="kX">${esc(t('cancel'))}</button>`, { wide:true });

  let icon = v.icon || 'link';
  document.querySelectorAll('#kI .ik').forEach(b => b.onclick = () => {
    icon = b.dataset.i;
    document.querySelectorAll('#kI .ik').forEach(x2 => x2.classList.toggle('on', x2 === b));
  });
  $('#kX').onclick = closeSheet;
  if($('#kD')) $('#kD').onclick = async () => {
    try{ await apiRetry('deleteLink', { link_id:v.link_id }, 'POST'); closeSheet();
         toast(t('lkHidden'), 'ok'); refresh(); }catch(e){ toast(t('netErr'), 'bad'); }
  };

      if(r?.ok === false) throw 0;

function burst(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const s = document.createElement('span');
  s.className = 'ch-burst'; s.textContent = '✦';
  el.appendChild(s);
  setTimeout(() => s.remove(), 700);
}

function msgSheet(m, refresh){
  sheet(`<h3>${esc(t('msgEdit'))}</h3>
    <p class="sub" style="font-family:ui-monospace,monospace">${esc(m.key)}</p>

    <div class="field"><label>${esc(t('msgHead'))}</label>
      <input id="mT" value="${esc(m.title)}"></div>
    <div class="field"><label>${esc(t('msgBody'))}</label>
      <textarea id="mB" rows="7" style="width:100%;resize:vertical;line-height:1.6">${esc(m.body)}</textarea></div>

    ${m.vars.length ? `<div class="field"><label>${esc(t('msgVars'))}</label>
      <div class="vchips">${m.vars.map(v => `
        <button type="button" class="vchip" data-v="${esc(v)}">{${esc(v)}}</button>`).join('')}</div>
      <div class="hint">${esc(t('msgVarsHint'))}</div></div>` : ''}

    <div class="field"><label>${esc(t('msgUrg'))}</label>
      <select id="mU">
        <option value="normal" ${m.urgency==='normal'?'selected':''}>${esc(t('msgUrgN'))}</option>
        <option value="high" ${m.urgency==='high'?'selected':''}>${esc(t('msgUrgH'))}</option>
        <option value="emergency" ${m.urgency==='emergency'?'selected':''}>${esc(t('msgUrgE'))}</option>
      </select></div>
    <label class="switch" style="margin-bottom:14px">
      <input type="checkbox" id="mO" ${m.off ? 'checked' : ''}>
      <span><b>${esc(t('msgTurnOff'))}</b><br>
        <span style="font-size:var(--fs-meta);color:var(--ink-3)">${esc(t('msgTurnOffSub'))}</span></span>
    </label>

    <div class="field"><label>${esc(t('msgPreview'))}</label>
      <div class="lchat"><div class="lbub" id="mP"></div></div>
      <div class="hint">${esc(t('msgPreviewHint'))}</div></div>

    <button class="btn primary" id="mS">${esc(t('admResSave'))}</button>
    <button class="btn soft" id="mTest">${esc(t('msgTest'))}</button>
    ${m.edited ? `<button class="btn ghost" id="mR">${esc(t('msgReset'))}</button>` : ''}
    <button class="btn ghost" id="mX">${esc(t('cancel'))}</button>`, { wide:true });

  /* ── พรีวิวแบบเดียวกับที่เซิร์ฟเวอร์เรนเดอร์: บรรทัดที่มีตัวแปรว่างจะหายทั้งบรรทัด
        ตรงนี้เติมค่าตัวอย่างให้ทุกตัว จึงเห็นครบทุกบรรทัด ── */
  const render = () => {
    const fill = s2 => String(s2).replace(/\{(\w+)\}/g, (_, k) => `(${k})`);
    const head = fill($('#mT').value).trim();
    const body = fill($('#mB').value);
    $x('#mP').innerHTML = `<b>${esc(head)}</b>` +
      (body ? '<br>' + body.split('\n').map(l =>
        /^https?:\/\//.test(l.trim())
          ? `<span class="llink">${esc(l)}</span>` : esc(l)).join('<br>') : '');
  };
  $('#mT').oninput = render; $('#mB').oninput = render; render();

  // แตะชิปตัวแปรแล้วแทรกลงตำแหน่งเคอร์เซอร์ — พิมพ์ชื่อตัวแปรเองมีโอกาสสะกดผิด
  document.querySelectorAll('.vchip').forEach(c => c.onclick = () => {
    const ta = $('#mB'), p = ta.selectionStart ?? ta.value.length, tag = `{${c.dataset.v}}`;
    ta.value = ta.value.slice(0, p) + tag + ta.value.slice(ta.selectionEnd ?? p);
    ta.focus(); ta.selectionStart = ta.selectionEnd = p + tag.length;
    render();
  });

  $('#mX').onclick = closeSheet;
  if($('#mR')) $('#mR').onclick = async () => {
    try{ await apiRetry('resetMessage', { key:m.key }, 'POST'); closeSheet();
         toast(t('msgResetOk'), 'ok'); refresh(); }catch(e){ toast(t('netErr'), 'bad'); }
  };
  $('#mTest').onclick = async () => {
    const b = $('#mTest'); b.disabled = true;
    try{
      const r = await apiRetry('testMessage', { key:m.key }, 'POST');
      toast(r?.ok ? t('msgTestSent')
                  : (r?.error === 'NO_LINE' ? t('msgTestNoLine') : t('netErr')),
            r?.ok ? 'ok' : 'bad');
    }catch(e){ toast(t('netErr'), 'bad'); }
    b.disabled = false;
  };
  const save = async (confirm) => {
    const b = $('#mS'); b.disabled = true;
    try{
      const r = await apiRetry('saveMessage', {
        key:m.key, title:$('#mT').value, body:$('#mB').value,
        urgency:$('#mU').value, off:$('#mO').checked, confirm: !!confirm
      }, 'POST');
      /* ตัวแปรที่โค้ดไม่ได้ส่งให้ จะกลายเป็นช่องว่างตอนส่งจริงทุกฉบับ
         ถามก่อนดีกว่าปล่อยให้ข้อความขาดชื่อไปเงียบๆ เป็นเดือน */
      if(r?.error === 'UNKNOWN_VARS'){
        b.disabled = false;
        if(confirm2(t('msgBadVars')(r.vars.join(', ')))) return save(true);
        return;
      }
      if(r?.ok === false) throw 0;
      closeSheet(); toast(t('admResSaved'), 'ok'); refresh();
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };
  $('#mS').onclick = () => save(false);
}
const confirm2 = msg => window.confirm(msg);

ROUTES['admin-parcels'] = async (params = {}) => {

    $x('#main').innerHTML = `<div class="view" style="padding-top:36px">

  }
  const F = ['wait', 'done', 'unid', 'all'];
  let filter = F.includes(params.filter) ? params.filter : 'wait';
  let kw = params.kw || '', page = Number(params.page) || 0;

  $x('#main').innerHTML = `<div class="view">
    <div class="srch">
      <input id="pKw" value="${esc(kw)}" placeholder="${esc(t('prcSearch'))}"
        inputmode="search" enterkeyhint="search">

  const nav = o => go('admin-parcels', Object.assign({ filter, kw, page }, o), true);

  if(!r?.ok){ $x('#pList').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }

  /* ── รายการ ── */
  if(!r.items.length){

    $x('#pPage').innerHTML = '';
    return;
  }
  const PILL = { arrived:'wait', notified:'wait', unidentified:'wait',

  const LBL  = { arrived:t('prcS_wait'), notified:t('prcS_wait'),
                 unidentified:t('prcS_unid'), claimed:t('prcS_done'), closed:t('prcS_done') };

  $x('#pList').innerHTML = `<div class="rows">${r.items.map(p => {
    const done = PILL[p.status] === 'done';
    /* เวลาที่รอ คือตัวเลขที่บอกอะไรได้จริงที่สุดในหน้านี้
       ของที่รับแล้ว = รอไปกี่วันกว่าจะมารับ · ของที่ยังค้าง = ค้างมาแล้วกี่วัน */
    const h = p.wait_h;
    const wait = h === null ? '' :
      (h < 24 ? t('prcHrs')(Math.round(h)) : t('prcDays')(Math.round(h / 24)));
    const late = !done && h !== null && h >= 72;
    return `<button class="row" data-id="${esc(p.record_id)}">
      ${p.thumb_id ? `<img class="thumb" data-ph="${esc(p.thumb_id)}" alt="">`
                   : `<div class="thumb">${IC.box}</div>`}
      <div class="body">
        <div class="t">${esc(p.title || p.tracking_no || t('prcUntitled'))}</div>
        <div class="s">${esc([
            p.who || t('prcNoWho'),
            done ? t('prcGotOn')(fmtDate(p.closed_at)) : t('prcInOn')(fmtDate(p.created_at))
          ].join(' · '))}</div>
        ${p.tracking_no ? `<div class="s" style="font-family:ui-monospace,monospace">${
          esc(p.tracking_no)}</div>` : ''}
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <span class="pill ${PILL[p.status] || 'wait'}">${esc(LBL[p.status] || p.status)}</span>
        ${wait ? `<div class="pwait ${late ? 'late' : ''}">${esc(wait)}</div>` : ''}
      </div>
    </button>`;
  }).join('')}</div>`;
  paintPhotos($('#pList'));

  const byId = {}; r.items.forEach(p => byId[p.record_id] = p);
  document.querySelectorAll('#pList .row').forEach(b =>
    b.onclick = () => parcelSheet(byId[b.dataset.id]));

  /* ── หน้าถัดไป ── */
  const last = Math.max(0, Math.ceil(r.total / r.per) - 1);
  $x('#pPage').innerHTML = last > 0 ? `<div class="pager">
    <button class="btn ghost" id="pPrev" ${page <= 0 ? 'disabled' : ''}>← ${esc(t('prcPrev'))}</button>
    <span>${esc(t('prcPageN')(page + 1, last + 1, r.total))}</span>
    <button class="btn ghost" id="pNext" ${page >= last ? 'disabled' : ''}>${esc(t('prcNext'))} →</button>
  </div>` : `<p class="pager-n">${esc(t('prcShowing')(r.total))}</p>`;
  if($('#pPrev')) $('#pPrev').onclick = () => nav({ page:page - 1 });
  if($('#pNext')) $('#pNext').onclick = () => nav({ page:page + 1 });
};

  /* อ่านฉลากพัสดุบนเครื่องผู้ใช้เอง (OCR ในเบราว์เซอร์) — รูปไม่ถูกส่งออกไปที่ใดเลย ปลอดภัยตาม PDPA */
async function localScanParcel(photo){
  if(!window.Tesseract){
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = photo; });
  const sc = Math.min(1, 1500 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
  const mk = deg => { const c = document.createElement('canvas'); const sw = (deg === 90 || deg === 270); c.width = sw ? h : w; c.height = sw ? w : h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.translate(c.width / 2, c.height / 2); x.rotate(deg * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h); return c; };
  const norm = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
  const worker = await Tesseract.createWorker('tha+eng');
  let best = { score: -1, tm: null, hit: null };
  try{
    for(const deg of [0, 90, 270, 180]){
      const out = await worker.recognize(mk(deg));
      const text = (out && out.data && out.data.text) || '';
      const T = norm(text);
      const tm = text.replace(/[ \-]/g, '').match(/[A-Z]{2}\d{9}[A-Z]{2}|TH[0-9A-Z]{10,15}|\d{12,15}/);
      let hit = null;
      (S.employees || []).forEach(p => { const n = norm(p.name_th); if(!hit && n.length > 3 && T.includes(n)) hit = p; });
      (S.employees || []).forEach(p => { const n = norm(p.nickname); if(!hit && n.length > 2 && T.includes(n)) hit = p; });
      const score = (hit ? 100 : 0) + (tm ? 50 : 0) + ((out && out.data && out.data.confidence) || 0) / 10;
      if(score > best.score) best = { score: score, tm: tm, hit: hit };
      if(hit || tm) break;
    }
  } finally { try{ await worker.terminate(); }catch(e){} }
  return { ok:true, trackingNo: best.tm ? best.tm[0] : '', recipientName: best.hit ? best.hit.name_th : '' };
}
$('#scanBtn').onclick = async () => {

async function speedTest(){
  const box = $('#spdOut'); box.hidden = false; box.textContent = t('loading');
  const t1 = performance.now(); const p1 = await apiRetry('ping', {}, 'GET');
  const cold = Math.round(performance.now() - t1);
  const t2 = performance.now(); await apiRetry('ping', {}, 'GET');
  const warm = Math.round(performance.now() - t2);
  const okBuild = p1?.build === CFG.BUILD;
  box.textContent =
    (okBuild ? '✅ ' + t('spdBuildOk') + ' (' + CFG.BUILD + ')'
             : '⚠️ ' + t('spdBuildBad') + '\n   ' + t('spdBuildApp') + ': ' + CFG.BUILD +
               '\n   ' + t('spdBuildSrv') + ': ' + (p1?.build || t('spdBuildOld'))) + '\n\n' +
    t('spdFirst') + ': ' + cold + ' ms\n' +
    t('spdSecond') + ': ' + warm + ' ms\n\n' +
    'action  net / srv / db (ms)\n' +
    S.timings.map(x => x.a + '  ' + x.net + ' / ' + (x.srv ?? '-') + ' / ' + (x.db ?? '-')).join('\n');
}

  $('#paste').onclick = () => {

    const lines = raw.split(/\n+/).map(x => x.trim()).filter(Boolean);
    $('#nTh').value = lines[0] || '';
    $('#bTh').value = lines.slice(1).join('\n');
    $('#pasteBox').value = '';
    toast(t('admNewsPasteBtn'), 'ok');
  };

  const TAGS = S.lang === 'th'
    ? ['สำคัญ','เร่งด่วน','ต้องดำเนินการ','HR','ทั้งองค์กร','กิจกรรม','อาคาร/สถานที่','นโยบาย']
    : ['Important','Urgent','Action required','HR','All staff','Event','Building','Policy'];

      tags = tags.includes(v) ? tags.filter(x => x !== v) : tags.concat(v);
      paintTags();
    });
