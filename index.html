/**
 * @param kind  'room' | 'car' | 'borrow'
 * @param rec   { record_id, start_at, end_at, title, resource_id, project_code, driver_id }
 * @param opt   { resources:[{id,name}], drivers:[…], projects:[…], officer:bool, onDone:fn }
 */
function editBookSheet(kind, rec, opt = {}){
  const d0 = dayKey(rec.start_at), t1 = hhmm(rec.start_at), t2 = hhmm(rec.end_at);
  const res = opt.resources || [];
  const drv = opt.drivers || [];

  sheet(`<h3>${esc(t('ebTitle'))}</h3>
    <p class="sub">${esc(rec.title || '')}</p>
    <div class="field"><label>${esc(t('ebDate'))}</label>
      <input id="ebD" type="date" value="${esc(d0)}"></div>
    <div class="times" style="margin-bottom:14px">
      <div class="tbox"><div class="k">${esc(t('ebFrom'))}</div>
        <input id="ebS" type="time" step="900" value="${esc(t1)}" class="tin big"></div>
      <div class="tbox"><div class="k">${esc(t('ebTo'))}</div>
        <input id="ebE" type="time" step="900" value="${esc(t2)}" class="tin big"></div>
    </div>
    ${kind !== 'borrow' ? `<div class="field"><label>${
      esc(kind === 'car' ? t('carPurpose') : t('rmSubject'))}</label>
      <input id="ebT" value="${esc(rec.title || '')}"></div>` : ''}
    ${res.length > 1 ? `<div class="field"><label>${
      esc(kind === 'car' ? t('ebVeh') : t('rmPick'))}</label>
      <select id="ebR">${res.map(x => `<option value="${esc(x.id)}" ${
        String(x.id) === String(rec.resource_id) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}
    ${(kind === 'car' && opt.officer && drv.length) ? `<div class="field"><label>${esc(t('carDriver'))}</label>
      <select id="ebV"><option value="">${esc(t('ebNoDriver'))}</option>${drv.map(x =>
        `<option value="${esc(x.driver_id || x.id)}" ${
          String(x.driver_id || x.id) === String(rec.driver_id) ? 'selected' : ''}>${
          esc(x.name)}</option>`).join('')}</select>
      <div class="hint">${esc(t('ebDriverWhy'))}</div></div>` : ''}
    <div class="err" id="ebErr" hidden></div>
    <button class="btn primary" id="ebGo">${esc(t('ebSave'))}</button>
    <button class="btn ghost" id="ebX">${esc(t('cancel'))}</button>`, { wide:true });

  $('#ebX').onclick = closeSheet;
  $('#ebGo').onclick = async () => {
    const day = $('#ebD').value, a = $('#ebS').value, b = $('#ebE').value;
    const err = m => { const e = $('#ebErr'); e.textContent = m; e.hidden = false; };
    if(!day || !a || !b){ err(t('ebNeedTime')); return; }
    if(b <= a){ err(t('ebBadTime')); return; }

    const btn = $('#ebGo'); btn.disabled = true; $('#ebErr').hidden = true;
    const body = {
      record_id: rec.record_id,
      start_at: `${day}T${a}:00+07:00`,
      end_at:   `${day}T${b}:00+07:00`
    };
    if($('#ebT')) body.title = $('#ebT').value.trim();
    if($('#ebR')) body.resource_id = $('#ebR').value;
    if($('#ebV')) body.driver_id = $('#ebV').value;

    try{
      const r = await apiRetry('editBooking', body, 'POST');
      if(r?.error === 'CLASH'){
        /* บอกให้ชัดว่าชนกับใคร ช่วงไหน — "จองไม่ได้" เฉยๆ ทำให้คนลองสุ่มเวลาไปเรื่อย */
        err(t('ebClash')(r.clash?.who || '', fmtDate(r.clash?.start_at), hhmm(r.clash?.end_at)));
        btn.disabled = false; return;
      }
      if(r?.error === 'LOCKED'){ err(t('ebLocked')); btn.disabled = false; return; }
      if(r?.ok === false) throw 0;
      closeSheet(); toast(t('ebSaved'), 'ok');
      opt.onDone?.();
    }catch(e){ err(t('netErr')); btn.disabled = false; }
  };
}


/* ────────────────────────────────────────────────────────────────
 *  ตารางงานของคนขับรายคน (ผู้ดูแล)
 *
 *  หน้าจัดการคนขับเดิมตอบได้แค่ "คนนี้คือใคร" แต่คำถามที่ผู้ดูแลถามจริง
 *  คือ "พรุ่งนี้พี่สมพงษ์ว่างไหม" กับ "วันนี้เขาเข้าไม่ได้ ต้องย้ายงานไหนบ้าง"
 * ──────────────────────────────────────────────────────────────── */
ROUTES['driver-jobs'] = async ({ id } = {}) => {
  setTitle(t('djTitle'));
  $x('#main').innerHTML = `<div class="view"><div id="dj">${skeleton(3)}</div></div>`;
  if(!id){ $x('#dj').innerHTML = emptyState(IC.info, t('djPick'), ''); return; }

  let r = null;
  try{ r = await apiRetry('driverJobs', { driver_id:id }, 'GET'); }catch(e){}
  if(!r?.ok){ $x('#dj').innerHTML = emptyState(IC.info, t('adminNo'), t('adminNoBody')); return; }

  const row = j => `
    <button class="row djrow" data-j="${esc(j.record_id)}">
      <div class="body">
        <div class="t">${esc(hhmm(j.start_at))}–${esc(hhmm(j.end_at))} · ${esc(j.title || '-')}</div>
        <div class="s">${esc([fmtDate(j.start_at), j.trip, j.vehicle].filter(Boolean).join(' · '))}</div>
        <div class="s">${esc([j.who ? t('djBy')(j.who) : '', j.route, j.project,
          j.km ? j.km + ' ' + t('carKm') : ''].filter(Boolean).join(' · '))}</div>
      </div>
      <span class="pill ${['returned','cancelled'].includes(j.status) ? 'done' : 'wait'}">${
        esc(carStName(j.status))}</span>
    </button>`;

  $x('#dj').innerHTML = `
    <div class="card">
      <div style="font-size:17px;font-weight:800">${esc(r.driver.name)}</div>
      <div style="font-size:var(--fs-sec);color:var(--ink-3)">${
        esc([r.driver.company, r.driver.phone].filter(Boolean).join(' · '))}</div>
      ${r.driver.phone ? `<a class="btn soft" href="tel:${esc(r.driver.phone)}"
        style="margin-top:10px;text-decoration:none">${IC.phone} ${esc(t('ctCall'))}</a>` : ''}
    </div>

    <div class="section-title">${esc(t('djVeh'))}</div>
    <div class="chips" id="djv">${r.vehicles.map(v => `
      <button class="chip ${v.mine ? 'on' : ''}" data-v="${esc(v.resource_id)}"
        ${v.taken ? 'disabled title="' + esc(t('djVehTaken')(v.taken)) + '"' : ''}>
        ${esc(v.name)}${v.plate ? ' · ' + esc(v.plate) : ''}${v.taken ? ' 🔒' : ''}</button>`).join('')}</div>
    <div class="fhint" style="margin-top:6px">${esc(t('djVehWhy'))}</div>
    <button class="btn soft" id="djSave" style="margin-top:10px" hidden>${esc(t('djVehSave'))}</button>

    <div class="section-title">${esc(t('djUpcoming'))} · ${r.upcoming.length}</div>
    ${r.upcoming.length ? `<div class="rows">${r.upcoming.map(row).join('')}</div>`
      : `<div class="quiet">${esc(t('djNoUpcoming'))}</div>`}

    <div class="section-title">${esc(t('djPast'))}</div>
    ${r.past.length ? `<div class="rows">${r.past.map(row).join('')}</div>`
      : `<div class="quiet">${esc(t('djNoPast'))}</div>`}`;

  /* ── จับคู่รถ ── */
  let picked = new Set(r.vehicles.filter(v => v.mine).map(v => String(v.resource_id)));
  const orig = [...picked].sort().join(',');
  document.querySelectorAll('#djv .chip:not([disabled])').forEach(b => b.onclick = () => {
    const k = b.dataset.v;
    picked.has(k) ? picked.delete(k) : picked.add(k);
    b.classList.toggle('on', picked.has(k));
    $('#djSave').hidden = [...picked].sort().join(',') === orig;
  });
  $('#djSave').onclick = async () => {
    const b = $('#djSave'); b.disabled = true;
    try{
      await apiRetry('assignDriverVehicles',
        { driver_id:id, resource_ids:[...picked].join(',') }, 'POST');
      clearCache(); toast(t('djVehSaved'), 'ok'); go('driver-jobs', { id }, true);
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };

  /* ── แก้ไขงาน ── */
  const all = [...r.upcoming, ...r.past];
  document.querySelectorAll('#dj .djrow').forEach(b => b.onclick = () => {
    const j = all.find(x => x.record_id === b.dataset.j); if(!j) return;
    if(['returned','cancelled'].includes(j.status)){ toast(t('ebLocked'), ''); return; }
    editBookSheet('car', {
      record_id:j.record_id, start_at:j.start_at, end_at:j.end_at,
      title:j.title, resource_id:j.resource_id, driver_id:id
    }, {
      officer: true,
      resources: r.vehicles.map(v => ({ id:v.resource_id, name:v.name + (v.plate ? ' · ' + v.plate : '') })),
      drivers: r.drivers,
      onDone: () => go('driver-jobs', { id }, true)
    });
  });
};


/* ════════════════════════════════════════════════════════════════
 *  พอร์ทัลคนขับ — เขียนใหม่ทั้งหน้า
 *
 *  คนขับส่วนใหญ่อายุ 50+ ใช้มือถือกลางแดด และเปิดแอปตอนกำลังจะออกรถ
 *  หน้าเดิมเป็นรายการงานเรียงกันเหมือนหน้าอื่นในระบบ ซึ่งแปลว่า
 *  คำถามเดียวที่เขามี — "งานต่อไปคืออะไร" — ต้องอ่านเองจากกองข้อมูล
 *
 *  ของใหม่: งานถัดไปหนึ่งงานเป็นพระเอกเต็มจอ ปุ่มใหญ่ ตัวหนังสือใหญ่
 *  ที่เหลือเป็นรายการสั้นๆ ข้างล่าง · ภาษาไทยอย่างเดียว ไม่มีสวิตช์ภาษา
 * ════════════════════════════════════════════════════════════════ */

/** ปุ่มหลักของคนขับ — สูง 68px เพราะนิ้วโป้งกลางแดดไม่ได้แม่นยำเท่าเมาส์ */
const drvAct = (j, live) => `
  <button class="dbtn ${live ? 'ret' : 'go'}" data-act="${live ? 'return' : 'depart'}"
    data-r="${esc(j.record_id)}">
    <span class="dbtn-d"></span>${esc(live ? 'ถึงแล้ว · กลับถึงออฟฟิศ' : 'เริ่มออกเดินทาง')}</button>`;

function drvHero(j){
  const live = j.status === 'in_use';
  const stops = Array.isArray(j.stops) ? j.stops : [];
  const from  = stops.length ? (stops[0].from || 'ออฟฟิศ') : 'ออฟฟิศ';
  const to    = stops.length ? (stops[stops.length - 1].to || stops[stops.length - 1].place || '') : '';
  const hit   = new Set((j.stop_log || []).map(x => Number(x.i)));

  return `<section class="dhero ${live ? 'live' : ''}">
    <div class="dhero-h">
      <span class="dhero-t">${esc(hhmm(j.start_at))}</span>
      <span class="dhero-d">${esc(drvDayWord(j.start_at))}</span>
      ${live ? '<span class="dhero-live">● กำลังเดินทาง</span>' : ''}
    </div>
    <div class="dhero-v">${esc(j.vehicle || '-')}${j.plate ? ' · ' + esc(j.plate) : ''}</div>
    <div class="dhero-r">${esc(from)}${to ? ' → ' + esc(to) : ''}</div>
    <div class="dhero-m">
      <div><b>${esc(j.title || '-')}</b></div>
      <div>ผู้โดยสาร ${esc(j.requester || '-')}${j.passengers ? ' · ' + esc(j.passengers) : ''}</div>
      ${j.items ? `<div>ของที่ต้องขน ${esc(j.items)}</div>` : ''}
      ${j.note ? `<div class="dhero-n">${esc(j.note)}</div>` : ''}
    </div>

    ${stops.length ? `<div class="dstops">${stops.map((sp, i) => `
      <div class="dstop ${hit.has(i) ? 'hit' : ''}">
        <span class="dstop-n">${i + 1}</span>
        <span class="dstop-x">${esc(sp.to || sp.place || '-')}</span>
        ${live && !hit.has(i) ? `<button class="dstop-b" data-stop="${i}"
          data-sj="${esc(j.record_id)}">ถึงจุดนี้</button>` : ''}
      </div>`).join('')}</div>` : ''}

    <div class="dhero-btns">
      ${j.requester_phone
        ? `<a class="dbtn call" href="tel:${esc(j.requester_phone)}">โทรหาผู้โดยสาร</a>`
        : ''}
      ${to ? `<a class="dbtn map" target="_blank" rel="noopener"
          href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(to)}">ดูเส้นทาง</a>` : ''}
    </div>
    ${drvAct(j, live)}
    ${live ? '' : `<button class="dbtn off" data-cancel="${esc(j.record_id)}">ไปงานนี้ไม่ได้</button>`}
  </section>`;
}

/** วันนี้ / พรุ่งนี้ / วันที่ — คนขับสนใจแค่สามคำนี้ ไม่ต้องมีวันในสัปดาห์ */
function drvDayWord(iso){
  const d = dayKey(iso), today = dayKey(new Date());
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  if(d === today) return 'วันนี้';
  if(d === dayKey(tm)) return 'พรุ่งนี้';
  return fmtDate(iso).split(' ').slice(0, 2).join(' ');
}


/* ══════════════════════════════════════════════════════════════════
 *  หน้าแรกของคนขับ
 *  เปิดมาแล้วต้องรู้ทันทีว่า "งานต่อไปคืออะไร" โดยไม่ต้องอ่านอะไรเลย
 * ══════════════════════════════════════════════════════════════════ */
ROUTES['driver-portal'] = async () => {
  setTitle('งานของฉัน');
  const ok = await loadDriver(true);
  if(!ok){
    $x('#main').innerHTML = `<div class="view">${
      S.driverOff ? emptyState(IC.info, t('dpOff'), t('dpOffBody'))
                  : emptyState(IC.car, t('dpPair'), t('dpPairBody'))}
      ${S.driverOff ? '' : `<button class="btn primary" id="gp">${esc(t('dpPairGo'))}</button>`}</div>`;
    if($('#gp')) $('#gp').onclick = () => go('driver-pair');
    return;
  }

  const jobs = (S.drvJobs || []).filter(j => !['returned','cancelled'].includes(j.status));
  /* งานที่กำลังเดินทางอยู่มาก่อนเสมอ ต่อให้เวลาเริ่มจะเก่ากว่างานอื่น
     เพราะปุ่มที่เขาต้องกดต่อไปคือ "กลับถึงออฟฟิศ" ของงานนั้น */
  jobs.sort((a, b) => (b.status === 'in_use') - (a.status === 'in_use') ||
                      String(a.start_at).localeCompare(String(b.start_at)));
  const next = jobs[0];
  const rest = jobs.slice(1);
  const done = (S.drvJobs || []).filter(j => j.status === 'returned').reverse();

  const name = firstName(S.driver?.name || '');
  const myVeh = (S.drvVeh || []).map(v => v.name + (v.plate ? ' · ' + v.plate : '')).join(', ');

  $x('#main').innerHTML = `<div class="view drv">
    <div class="dgreet">สวัสดีครับ ${esc(name ? 'พี่' + name : '')}</div>
    ${myVeh ? `<div class="dveh">${IC.car}<span>${esc(myVeh)}</span></div>` : ''}

    ${next ? `<h3 class="dsec">งานถัดไป</h3>${drvHero(next)}`
           : `<div class="dnone">${IC.car}<b>วันนี้ไม่มีงานที่ต้องออกรถ</b>
              <span>ถ้ามีงานใหม่ ระบบจะส่งไลน์บอกทันที</span></div>`}

    ${rest.length ? `<h3 class="dsec">งานถัดไปอีก ${rest.length} งาน</h3>
      <div class="dlist">${rest.map(j => `
        <button class="drow" data-open="${esc(j.record_id)}">
          <span class="drow-t">${esc(hhmm(j.start_at))}</span>
          <span class="drow-x">
            <span class="drow-n">${esc(j.title || '-')}</span>
            <span class="drow-s">${esc(drvDayWord(j.start_at))}${
              j.vehicle ? ' · ' + esc(j.vehicle) : ''}</span>
          </span>
          <span class="drow-g">${IC.chev}</span>
        </button>`).join('')}</div>` : ''}

    ${done.length ? `<h3 class="dsec">งานที่จบแล้ว</h3>
      <div class="dlist">${done.slice(0, 5).map(j => `
        <div class="drow off">
          <span class="drow-t">${esc(hhmm(j.start_at))}</span>
          <span class="drow-x">
            <span class="drow-n">${esc(j.title || '-')}</span>
            <span class="drow-s">${esc(fmtDate(j.start_at))}${
              j.odo_out && j.odo_in
                ? ' · ' + esc(String(Number(j.odo_in) - Number(j.odo_out))) + ' กม.' : ''}</span>
          </span>
        </div>`).join('')}</div>` : ''}
  </div>`;

  /* งานอื่นในรายการ กดแล้วเลื่อนขึ้นมาเป็นงานหลักชั่วคราว
     ดีกว่าเปิดหน้าใหม่ เพราะคนขับไม่ต้องหาทางกดย้อนกลับ */
  document.querySelectorAll('#main [data-open]').forEach(b => b.onclick = () => {
    const j = jobs.find(x => x.record_id === b.dataset.open); if(!j) return;
    sheet(drvHero(j) + `<button class="btn ghost" id="dcx">ปิด</button>`, { wide:true });
    $('#dcx').onclick = closeSheet;
    wireDrvActions();
  });
  wireDrvActions();

  function wireDrvActions(){
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => odoSheet(b.dataset.act, b.dataset.r));
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelSheet(b.dataset.cancel));
    document.querySelectorAll('[data-stop]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try{
        await apiRetry('driverJobAct',
          { record_id:b.dataset.sj, act:'stop', stop_index:b.dataset.stop }, 'POST');
        toast('บันทึกแล้ว', 'ok'); closeSheet(); go('driver-portal', {}, true);
      }catch(e){ toast('ต่อเน็ตไม่ได้ ลองใหม่อีกครั้ง', 'bad'); b.disabled = false; }
    });
  }

  function odoSheet(act, rec){
    const out = act === 'depart';
    sheet(`<h3>${out ? 'เริ่มออกเดินทาง' : 'กลับถึงออฟฟิศแล้ว'}</h3>
      <div class="field"><label>${out ? 'เลขไมล์ตอนออก' : 'เลขไมล์ตอนกลับ'}</label>
        <input id="od" inputmode="numeric" class="dbig" placeholder="เช่น 128450"></div>
      <div class="fhint">ไม่ทันดูก็ข้ามได้ครับ กดยืนยันได้เลย</div>
      <button class="btn primary dbtn ${out ? 'go' : 'ret'}" id="okd">${
        out ? 'ยืนยัน ออกเดินทาง' : 'ยืนยัน ถึงแล้ว'}</button>
      <button class="btn ghost" id="cxd">ยกเลิก</button>`);
    $('#cxd').onclick = closeSheet;
    setTimeout(() => $('#od')?.focus(), 250);
    $('#okd').onclick = async () => {
      $('#okd').disabled = true;
      try{
        await apiRetry('driverJobAct', { record_id:rec, act, odo:$('#od').value.trim() }, 'POST');
        closeSheet(); toast(out ? 'บันทึกว่าออกเดินทางแล้ว' : 'บันทึกว่ากลับถึงแล้ว', 'ok');
        go('driver-portal', {}, true);
      }catch(e){ toast('ต่อเน็ตไม่ได้ ลองใหม่อีกครั้ง', 'bad'); $('#okd').disabled = false; }
    };
  }

  /* ── ยกเลิกงาน ──
     เหตุผลเป็นตัวเลือก ไม่ใช่ช่องพิมพ์ เพราะระบบต้องรู้ว่าใบนี้จบแล้ว
     หรือยังต้องหาคนขับใหม่ ซึ่งสองอย่างนี้แยกจากข้อความอิสระไม่ได้ */
  function cancelSheet(rec){
    sheet(`<h3>ไปงานนี้ไม่ได้</h3>
      <p class="sub">เลือกเหตุผลด้วยครับ ระบบจะแจ้งผู้จองกับผู้ดูแลให้เอง</p>
      <div class="dopts" id="dcr">${DRV_CANCEL_REASONS.map((x, i) => `
        <button class="dopt ${i === 0 ? 'on' : ''}" data-k="${esc(x.k)}">${esc(x.th)}</button>`).join('')}</div>
      <div class="field" style="margin-top:14px"><label>อยากบอกอะไรเพิ่ม (ไม่ใส่ก็ได้)</label>
        <input id="dcn" class="dbig" placeholder="เช่น รถเข้าอู่ถึงบ่าย"></div>
      <button class="btn dbtn off" id="dcgo">ยืนยัน ยกเลิกงานนี้</button>
      <button class="btn ghost" id="dcx2">ไม่ยกเลิก</button>`);
    let reason = DRV_CANCEL_REASONS[0].k;
    document.querySelectorAll('#dcr .dopt').forEach(b => b.onclick = () => {
      reason = b.dataset.k;
      document.querySelectorAll('#dcr .dopt').forEach(x => x.classList.toggle('on', x === b));
    });
    $('#dcx2').onclick = closeSheet;
    $('#dcgo').onclick = async () => {
      $('#dcgo').disabled = true;
      try{
        const r = await apiRetry('driverJobAct',
          { record_id:rec, act:'cancel', reason, note:$('#dcn').value.trim() }, 'POST');
        if(r?.ok === false) throw 0;
        closeSheet();
        toast(r?.killed ? 'ยกเลิกงานเรียบร้อย' : 'แจ้งแล้ว ผู้ดูแลจะหาคนขับใหม่ให้', 'ok');

    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  const IC_HELD = SV('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.6v4.7l3 1.8"/>');
  const IC_LATE = SV('<path d="M12 4v10M12 18.6h.01"/>');

  const st = i.available
    ? { cls:'free', ic:IC_OK, head:t('objFree'),
        sub: i.storage_location || t('objNoPlace') }
    : i.mine
      ? { cls: overdue ? 'late' : 'busy', ic: overdue ? IC_LATE : IC_HELD,
          head: overdue ? t('objMineLate') : t('objMine'),
          sub: i.due ? t('objDueOn')(fmtDate(i.due)) : t('objNoDue') }
      : { cls: overdue ? 'late' : 'busy', ic: overdue ? IC_LATE : IC_HELD,
          head: t('objHeldBy')(i.holder || '—'),
          sub: [ i.since ? t('objSince')(fmtDate(i.since)) : '',
                 i.due   ? t('objDueOn')(fmtDate(i.due))   : t('objNoDue') ]
                 .filter(Boolean).join(' · ') };

     คนที่กำลังจะหยิบไปใช้ยาวๆ จะได้รู้ก่อนว่ามีคนรออยู่ */
  const nx = i.next_resv;

  $x('#main').innerHTML = `<div class="view obj">
    ${(i.photo_id || i.thumb_id || i.thumb)
      ? `<img class="obj-ph" id="itp" alt="" ${i.thumb ? `src="${i.thumb}"` : ''}>` : ''}
    <h2>${esc(i.name_th)}</h2>
    <div class="obj-sub">${i.asset_tag ? `<code>${esc(i.asset_tag)}</code>` : ''}${
      i.asset_tag && (spec || i.category) ? ' · ' : ''
    }${esc([spec, i.category].filter(Boolean).join(' · '))}</div>

    <div class="obj-st ${st.cls}">
      <span class="obj-ic" aria-hidden="true">${st.ic}</span>
      <div style="min-width:0"><b>${esc(st.head)}</b><span>${esc(st.sub)}</span></div>
    </div>

    <div class="obj-act">
      ${i.mine
        ? `<button class="btn g" id="ir" style="background:var(--ok);color:#fff">${esc(t('eqReturn'))}</button>`
        : (i.available

    </div>

    ${nx ? `<div class="note ${nx.mine ? 'info' : ''}" style="margin-top:13px">${IC.cal}
      <div>${esc(nx.mine ? t('objNextMine')(fmtDate(nx.start_at))
                         : t('objNextBy')(nx.who || '—', fmtDate(nx.start_at)))}</div></div>` : ''}

    ${i.manual_url ? `<button class="obj-lnk" id="iman">
      <span>${esc(t('objManual'))}</span>${IC.chev}</button>` : ''}

    <details class="obj-more">
      <summary>${esc(t('objSpecs'))}</summary>
      <dl>
        ${i.asset_tag ? `<dt>${esc(t('eqTag'))}</dt><dd class="mono">${esc(i.asset_tag)}</dd>` : ''}
        ${i.brand || i.model ? `<dt>${esc(t('objBrand'))}</dt><dd>${esc(spec)}</dd>` : ''}
        ${i.serial ? `<dt>${esc(t('itemSerial'))}</dt><dd class="mono">${esc(i.serial)}</dd>` : ''}

        ${i.purchase_year ? `<dt>${esc(t('itemYear'))}</dt><dd>${esc(i.purchase_year)}</dd>` : ''}

/** เปิดกล้องสแกนของ LINE ถ้าเครื่องนี้เปิดได้ ถ้าไม่ได้ก็ให้พิมพ์รหัสแทน
    ไม่ใช่ทุกเครื่องที่เปิดกล้องจากใน LIFF ได้ — ต้องมีทางที่สองเสมอ */
async function scanTag(){
  let val = null;
  try{
    if(S.liffReady && typeof liff?.scanCodeV2 === 'function'){
      const res = await liff.scanCodeV2();
      val = res?.value || null;
    }
  }catch(e){ val = null; }
  if(val){
    const m = String(val).match(/[?&]tag=([^&]+)/);
    const tag = m ? decodeURIComponent(m[1]) : String(val).trim();
    go('item', { tag });
    return;
  }
  sheet(`<h3>${esc(t('eqScan'))}</h3>
    <p class="sub">${esc(t('eqScanNo'))}</p>
    <div class="field"><label>${esc(t('eqTagAsk'))}</label>
      <input id="tg" placeholder="${esc(t('eqTagPh'))}" autocapitalize="characters"
        style="font-family:ui-monospace,monospace;letter-spacing:.08em"></div>
    <button class="btn primary" id="tgo">${esc(t('confirm'))}</button>
    <button class="btn ghost" id="tcx">${esc(t('cancel'))}</button>`);
  $('#tcx').onclick = closeSheet;
  setTimeout(() => $('#tg')?.focus(), 250);
  $('#tgo').onclick = () => {
    const v = $('#tg').value.trim().toUpperCase();
    if(!v) return;
    closeSheet(); go('item', { tag:v });
  };
}

      <div class="field"><label>${esc(t('fEmail'))}<span class="req">*</span></label>
        <input id="rEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@kenan-asia.org">

      <div class="field"><label>${esc(t('fDept'))}</label>

          <option>Social Impact and Innovation Program</option><option>Partnership and Communications</option>
          <option>IT</option><option>General Administration</option><option>Procurement</option><option value="Driver / External">Driver / External · คนขับรถ / บุคคลภายนอก</option>
        </select></div>
      <div class="field"><label>${esc(t('fOffice'))}</label>
        <select id="rOffice"><option value="BKK">Bangkok</option><option value="DEEPSOUTH">Deep South</option></select></div>
    </div>
    <div class="sticky-cta"><button class="btn primary" id="rSubmit">${esc(t('regSubmit'))}</button></div>
  </div>`;

  if(S.regDraft){
    $('#rName').value = S.regDraft.name_th; $('#rNameEn').value = S.regDraft.name_en;
    $('#rNick').value = S.regDraft.nickname; $('#rEmail').value = S.regDraft.email;
    $('#rDept').value = S.regDraft.department; $('#rOffice').value = S.regDraft.office;

  $('#rSubmit').onclick = async () => {

      email, department:$('#rDept').value, office:$('#rOffice').value
    };
    const b = $('#rSubmit'); b.disabled = true; b.textContent = t('loading');

/* ── ยืนยันอีเมลด้วยรหัส 6 หลัก ─────────────────────────────── */
ROUTES.otp = async () => {
  const d = S.regDraft || {};
  $x('#main').innerHTML = `<div class="view">
    ${stepBar(ONBOARD(), 3)}
    <div class="greet"><h2>${esc(t('otpTitle'))}</h2><p>${esc(t('otpLead')(d.email || ''))}</p></div>
    <div class="card">
      <div class="field" style="margin-bottom:0">
        <label>${esc(t('otpLabel'))}</label>
        <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
               placeholder="000000"
               style="text-align:center;font-size:30px;font-weight:800;letter-spacing:10px;padding:16px">
        <div class="err" id="eOtp" hidden></div>
        <div class="hint" style="text-align:center">${esc(t('otpHint'))}</div>
      </div>
    </div>
    <button class="btn primary" id="okOtp" disabled>${esc(t('otpVerify'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="resend">${esc(t('otpResend'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="editReg">${esc(t('otpBack'))}</button>
  </div>`;

  const inp = $('#otp'), ok = $('#okOtp');
  inp.focus();
  inp.oninput = () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 6);
    ok.disabled = inp.value.length !== 6;
    $('#eOtp').hidden = true;
  };
  $('#editReg').onclick = () => go('register', {}, true);
  $('#resend').onclick = async () => {
    try{ await apiRetry('requestOtp', { email:d.email }, 'POST'); toast(t('otpSent'), 'ok'); }
    catch(e){ toast(t('netErr'), 'bad'); }
  };
  ok.onclick = async () => {
    ok.disabled = true; ok.textContent = t('loading');
    try{
      const r = await apiRetry('submitRegistration',
        Object.assign({}, d, { otp:inp.value, consent_version:CFG.CONSENT_VERSION }), 'POST');
      if(r?.error === 'OTP_WRONG' || r?.error === 'OTP_EXPIRED'){
        $('#eOtp').textContent = t(r.error === 'OTP_WRONG' ? 'otpWrong' : 'otpExpired');
        $('#eOtp').hidden = false;
        ok.disabled = false; ok.textContent = t('otpVerify');
        return;
      }
      if(r?.ok === false) throw 0;
      // ลงทะเบียนสำเร็จ — โหลดสถานะใหม่แล้วเข้าหน้าแรก
      const auth = await apiRetry('getAuthState', {}, 'GET');
      S.me = auth?.user || null;
      S.isAdmin = !!auth?.isAdmin;
      S.isSuper = !!auth?.isSuper;
      S.isOfficer = !!(auth?.isAdmin || auth?.isOfficer);
      S.regStatus = auth?.registrationStatus || 'approved';
      S.regDraft = null;
      S.stack = [];
      toast(t('regOk'), 'ok');
      go('home');
    }catch(e){
      toast(t('netErr'), 'bad');
      ok.disabled = false; ok.textContent = t('otpVerify');
    }
  };
};

/** ย่อรูปเป็น 2 ขนาด: full (อ่านฉลาก) + thumb (แสดงในรายการ)
    วาดผ่าน canvas ทำให้ EXIF ทั้งหมดรวมถึงพิกัด GPS หายไปเอง */
function shrink2(file){
  return new Promise((res, rej) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => img.src = fr.result;
    fr.onerror = rej;
    img.onload = () => {
      const draw = (max, q) => {
        let { width:w, height:h } = img;
        const sc = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        return c.toDataURL('image/jpeg', q);
      };
      // card = รูปจิ๋วสำหรับเก็บลงชีทโดยตรง ต้องเล็กพอที่ช่องเดียวรับไหว (50,000 ตัวอักษร)
      res({ full: draw(1280, .82), thumb: draw(400, .7), card: draw(220, .6) });
    };
    img.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/** โหลดรูปทุกใบในหน้าเดียวด้วยคำขอเดียว — เดิมยิงทีละใบแล้วต่อคิวกันจนช้า */
const photoCache = {};
/** รูปเล็กของห้อง/อุปกรณ์/รถ
    ถ้ามาพร้อมรายการอยู่แล้ว (o.thumb) วาดเลย ไม่ต้องยิงขอรูปเป็นคำขอที่สอง
    ที่ยังไม่มีค่อยขอผ่าน data-ph ตามเดิม (ของเก่าที่อัปโหลดไว้ก่อนหน้านี้) */
function phImg(o, cls, style){
  const st = style ? ` style="${style}"` : '';
  if(o?.thumb)    return `<img class="${cls}"${st} src="${o.thumb}" alt="">`;
  if(o?.thumb_id) return `<img class="${cls}"${st} data-ph="${esc(o.thumb_id)}" alt="">`;
  return '';
}
async function paintPhotos(scope){
  const els = [...(scope || document).querySelectorAll('img[data-ph]')];
  if(!els.length) return;
  els.forEach(e => { if(photoCache[e.dataset.ph]) e.src = photoCache[e.dataset.ph]; });
  const need = [...new Set(els.map(e => e.dataset.ph).filter(id => id && !photoCache[id]))];
  if(!need.length) return;
  try{
    const r = await apiRetry('getPhotos', { ids:need.slice(0,12).join(',') }, 'POST');
    Object.keys(r?.photos || {}).forEach(k => photoCache[k] = r.photos[k]);
    els.forEach(e => { if(photoCache[e.dataset.ph]) e.src = photoCache[e.dataset.ph]; });
  }catch(e){}
}

/** ดึงรูปจากเซิร์ฟเวอร์ (ไฟล์ใน Drive เป็นส่วนตัว ไม่ได้เปิดลิงก์สาธารณะ) */
async function loadPhoto(fileId, imgEl){
  if(!fileId || !imgEl) return null;
  if(photoCache[fileId]){ imgEl.src = photoCache[fileId]; return photoCache[fileId]; }
  try{
    const r = await apiRetry('getPhoto', { file_id:fileId }, 'GET');
    if(r?.data){ photoCache[fileId] = r.data; if(imgEl) imgEl.src = r.data; return r.data; }
  }catch(e){}
  return null;
}

/* ── ดูรูปเต็มจอ + ซูม ─────────────────────────────────────────
   จ่าหน้าซองมักตัวเล็กและเบลอ ถ้าอ่านไม่ออกคนจะไม่กล้ากดรับ
   จึงต้องซูมได้จริง ทั้งด้วยปุ่ม แตะสองครั้ง และนิ้วหุบ-กาง */
let lbZ = 1, lbX = 0, lbY = 0;
function lbApply(){
  $('#lbImg').style.transform = `translate(${lbX}px,${lbY}px) scale(${lbZ})`;
  $('#lbFit').textContent = Math.round(lbZ * 100) + '%';
}
function lbSet(z, keepPan){
  lbZ = Math.min(6, Math.max(1, z));
  if(lbZ === 1 || !keepPan){ lbX = 0; lbY = 0; }
  lbApply();
}
async function openPhoto(fileId, title){
  if(!fileId){ toast(t('noPhoto')); return; }
  const img = $('#lbImg');
  img.removeAttribute('src');
  $('#lbTitle').textContent = title || '';
  $('#lbHint').textContent = t('zoomHint');
  lbSet(1);
  $('#lb').classList.add('on');
  const data = await loadPhoto(fileId, img);
  if(!data){ toast(t('netErr'), 'bad'); $('#lb').classList.remove('on'); }
}
function closePhoto(){ $('#lb').classList.remove('on'); }
$('#lbX').onclick   = closePhoto;
$('#lbIn').onclick  = () => lbSet(lbZ * 1.6, true);
$('#lbOut').onclick = () => lbSet(lbZ / 1.6, true);
$('#lbFit').onclick = () => lbSet(lbZ > 1 ? 1 : 2.5);

(function lbGestures(){
  const stage = $('#lbStage');
  let pts = new Map(), startDist = 0, startZ = 1, panning = false, sx = 0, sy = 0, lastTap = 0;

  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size === 2){
      const [a, b] = [...pts.values()];
      startDist = Math.hypot(a.x - b.x, a.y - b.y); startZ = lbZ;
    }else if(pts.size === 1){
      panning = lbZ > 1; sx = e.clientX - lbX; sy = e.clientY - lbY;
      const now = Date.now();
      if(now - lastTap < 300) lbSet(lbZ > 1 ? 1 : 2.5);   // แตะสองครั้งเพื่อซูม
      lastTap = now;
    }
  });
  stage.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size === 2 && startDist){
      const [a, b] = [...pts.values()];
      lbSet(startZ * (Math.hypot(a.x - b.x, a.y - b.y) / startDist), true);
    }else if(panning && pts.size === 1){
      lbX = e.clientX - sx; lbY = e.clientY - sy; lbApply();
    }
  });
  const up = e => { pts.delete(e.pointerId); if(pts.size < 2) startDist = 0; if(!pts.size) panning = false; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
})();

S.lastError = null;
function softFail(e){

async function boot(){

     เปลี่ยน APP_NAME ที่เดียวแล้วครบทุกจุดรวมถึงแท็บเบราว์เซอร์ */

  if(DEMO){
    S.uid = 'U-demo';
    S.profile = { displayName:'พิพัฒน์ ส.', pictureUrl:'' };
    const a0 = MOCK.bootstrap || MOCK.getAuthState;

    $x('#bellDot').textContent = S.notifCount; $x('#bellDot').hidden = false;
    const banner = el(`<div style="background:#FFFBEB;border-bottom:1px solid #FDE68A;color:#92400E;

      <a href="?demo" id="dmStaff" style="color:#92400E;font-weight:800;${DEMO_DRIVER ? '' : 'display:none'}">${esc(demoSwitch(false))}</a>
      <a href="?demo=driver" id="dmDrv" style="color:#92400E;font-weight:800;${DEMO_DRIVER ? 'display:none' : ''}">${esc(demoSwitch(true))}</a>
    </div>`);
    document.querySelector('.topbar').after(banner);

    /* มุมคนขับ: ไม่ต้องผ่านหน้าจับคู่รหัส เพราะในพรีวิวไม่มีเซิร์ฟเวอร์ให้จับคู่
       เข้าโหมดคนขับตรงๆ แล้วโหลดข้อมูลจำลองชุดคนขับแทน */
    if(DEMO_DRIVER){
      S.driverMode = true; document.body.classList.add('drvmode');
      S.lang = 'th';
      S.stack = [];
      go('driver-portal', {}, true);
      return;
    }
    go('home');
    return;
  }

  const timeout = new Promise(r => setTimeout(() => r('timeout'), CFG.LIFF_TIMEOUT_MS));
  try{
    const r = await Promise.race([
      liff.init({ liffId:CFG.LIFF_ID }).then(() => 'ok').catch(() => 'fail'),
      timeout
    ]);
    if(r === 'ok'){
      S.liffReady = true;
      if(!liff.isLoggedIn()){ liff.login(); return; }
      S.profile = await liff.getProfile();
      S.uid = S.profile.userId;
      try{ liff.getFriendship().then(function(f){ if(f && f.friendFlag === false) __friendBar(); }).catch(function(){}); }catch(e){}
      // ล้าง ?code=&state=&liff... ที่ LIFF ต่อท้ายมาหลังล็อกอิน

      if(location.search) history.replaceState({}, '', location.pathname);
    }
  }catch(e){}

  if(!S.uid){ go('gate'); return; }

  let auth;
  try{
    /* ส่ง URL รูปโปรไฟล์ LINE ไปด้วย เซิร์ฟเวอร์เก็บไว้ให้ทำเนียบใช้

  /* LINE id นี้ไม่ใช่พนักงาน แต่เป็นคนขับที่จับคู่ไว้แล้ว
     เซิร์ฟเวอร์ส่งข้อมูลพอร์ทัลคนขับมาให้ในคำขอเดียวกันแล้ว ไม่ต้องยิงซ้ำ */

  S.isOfficer = !!(auth?.isAdmin || auth?.isOfficer);
  S.regStatus = auth?.registrationStatus || (S.me ? 'approved' : 'none');
  S.notifCount= auth?.notificationCount || 0;
  if(S.notifCount){ $x('#bellDot').textContent = S.notifCount; $x('#bellDot').hidden = false; }

  S.stack = [];
  if(!S.me?.consent_at)               go('consent');
  else if(S.regStatus !== 'approved') go('register');
  else if(START_AT && START_AT !== 'home'){
    // มาจากปุ่ม Rich Menu ลิงก์ในข้อความแจ้งเตือน หรือสแกน QR ที่ตัวอุปกรณ์
    S.stack = [{ name:'home', params:{} }];
    go(START_AT, START_TAG ? { tag:START_TAG }
                           : (START_REC ? { rec:START_REC } : {}));
  }
  else                                go('home');
}
boot();
</script>
</body>
</html>
